<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>İnşaat Haritası</title>

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.css">

<!-- Alt menünün yazı tipi -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js"></script>

<style>
* { box-sizing: border-box; }

/*
 * İÇERİK GENİŞLİĞİ
 * Ana sayfadaki inşaat kartları ve ayrıntı sayfası
 * aynı genişliği kullanır. --side-gap, bu
 * genişliği ortalamak için iki yanda kalan boşluktur.
 */
:root {
    --content-width: 640px;
    --side-gap: max(16px, calc((100% - var(--content-width)) / 2));
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#map {
    position: absolute;
    inset: 0;
}

/* -----------------------------
   ALT PANELLER
   panel       : inşaat ekleme formu
   loginPanel  : giriş / kayıt
----------------------------- */

#panel,
#loginPanel {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    width: min(92%, 400px);
    max-height: calc(100% - 40px);
    overflow-y: auto;
    background: white;
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 5px 25px rgba(0,0,0,.25);
    z-index: 20;
    display: none;
}

#panel h3,
#loginPanel h3 {
    margin: 0 0 14px;
    font-size: 20px;
}

#locationName,
#placeType,
#startDate,
#endDate,
#company,
#buildStatus,
#floors,
#units,
#description,
#loginUsername,
#loginEmail,
#loginPassword {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    font-family: inherit;
    background: white;
    margin-bottom: 10px;
}

/* Kullanıcı adı kutusu sadece kayıt olurken görünür */
#loginUsername {
    display: none;
}

.field-row {
    display: flex;
    gap: 8px;
}

.field-row > label {
    flex: 1;
    min-width: 0;
}

.field-label {
    display: block;
    font-size: 12px;
    color: #666;
    margin-bottom: 4px;
}

#imageInput {
    width: 100%;
    margin-bottom: 10px;
}

/* Seçilen resimlerin küçük önizlemeleri */
#thumbs {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 8px;
}

.thumb {
    position: relative;
    width: 64px;
    height: 64px;
}

.thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
    display: block;
}

.thumb button {
    position: absolute;
    top: -7px;
    right: -7px;
    width: 22px;
    height: 22px;
    flex: none;
    padding: 0;
    border-radius: 50%;
    background: #c62828;
    color: white;
    font-size: 14px;
    line-height: 22px;
}

#sizeInfo {
    font-size: 12px;
    color: #777;
    margin-bottom: 12px;
}

.buttons {
    display: flex;
    gap: 8px;
}

button {
    flex: 1;
    border: 0;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
    cursor: default;
}

#addBtn,
#loginBtn {
    background: #28a745;
    color: white;
}

#cancelBtn,
#loginCancelBtn {
    background: #eee;
    color: #333;
}

/* Giriş / kayıt arasında geçiş bağlantısı */
#loginSwitch {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 6px;
    background: none;
    color: #1a73e8;
    font-size: 14px;
    font-weight: normal;
}

/* -----------------------------
   HARİTADAKİ İNŞAAT İŞARETİ
   Sade, sabit büyüklükte bir iğne. Üstündeki etikette
   ikon ve tür adı yazar; etiket sadece yakınlaşınca
   görünür (bkz. MARKER_LABEL_MIN_ZOOM).
----------------------------- */

.place-marker {
    /* Konumlandırmayı (position: absolute) MapLibre yapar. */
    width: 28px;
    height: 37px;
    cursor: pointer;
}

.place-pin {
    position: relative;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #28a745;
    border: 3px solid white;
    box-shadow: 0 3px 8px rgba(0,0,0,.35);
}

/* Ortadaki beyaz nokta */
.place-pin::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 8px;
    height: 8px;
    margin: -4px 0 0 -4px;
    border-radius: 50%;
    background: white;
}

/* Alttaki sivri uç */
.place-pin::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: -11px;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top: 9px solid #28a745;
    border-bottom: 0;
}

.place-label {
    display: none;
    position: absolute;
    left: 50%;
    bottom: 100%;
    transform: translateX(-50%);
    margin-bottom: 4px;
    background: white;
    color: #222;
    font-size: 12px;
    font-weight: bold;
    padding: 3px 8px;
    border-radius: 10px;
    white-space: nowrap;
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
}

body.show-place-labels .place-label {
    display: block;
}

/* -----------------------------
   İŞARETE TIKLAMA: KÜÇÜK KUTU
   Küçük resim + ekleyen kişi.
   Kutuya tıklanınca ayrıntı sayfası açılır.
----------------------------- */

.popup-content {
    width: 220px;
    cursor: pointer;
}

.popup-content img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 8px;
    display: block;
    background: #eee;
}

.popup-title {
    font-weight: bold;
    font-size: 16px;
    overflow-wrap: anywhere;
}

.popup-sub {
    font-size: 13px;
    color: #555;
    margin-top: 2px;
}

.popup-hint {
    font-size: 12px;
    color: #1a73e8;
    margin-top: 6px;
}

/* -----------------------------
   AYRINTI SAYFASI
   Haritanın üzerine alttan açılır. Arka planı tüm sayfayı
   kaplar, içerik ortadaki sütunda durur.
   Üstte kaydırmalı resimler, altta üç sekme.
----------------------------- */

#detailSheet {
    position: fixed;
    inset: 0;
    z-index: 30;

    /* Arka plan tüm sayfayı (haritayı da) kaplar. */
    background: #f4f5f7;

    transform: translateY(100%);
    visibility: hidden;
    transition: transform .28s ease, visibility 0s linear .28s;
}

#detailSheet.open {
    transform: translateY(0);
    visibility: visible;
    transition: transform .28s ease, visibility 0s;
}

/* İçerik sütunu: ana sayfadaki kartlarla aynı genişlikte */
#detailInner {
    position: relative;
    width: 100%;
    max-width: var(--content-width);
    height: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: white;
    box-shadow: 0 0 20px rgba(0,0,0,.12);
}

#detailCloseBtn {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 2;
    flex: none;
    width: 40px;
    height: 40px;
    padding: 0;
    border-radius: 50%;
    background: rgba(0,0,0,.55);
    color: white;
    font-size: 18px;
}

#detailGallery {
    position: relative;
    flex: none;
    height: 42%;
    background: #111;
}

#detailImages {
    display: flex;
    height: 100%;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
}

#detailImages::-webkit-scrollbar {
    display: none;
}

#detailImages img {
    flex: none;
    width: 100%;
    height: 100%;
    object-fit: contain;
    scroll-snap-align: center;
}

/* Resimler arasında geçiş okları (bilgisayar için) */
#detailPrevBtn,
#detailNextBtn {
    display: none;
    position: absolute;
    top: 50%;
    z-index: 2;
    flex: none;
    width: 44px;
    height: 44px;
    margin-top: -22px;
    padding: 0;
    border-radius: 50%;
    background: rgba(0,0,0,.55);
    color: white;
    font-size: 26px;
    line-height: 1;
}

#detailPrevBtn {
    left: 12px;
}

#detailNextBtn {
    right: 12px;
}

#detailCounter {
    position: absolute;
    right: 12px;
    bottom: 10px;
    background: rgba(0,0,0,.6);
    color: white;
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 10px;
}

#detailTitle {
    flex: none;
    margin: 14px 18px 8px;
    font-size: 20px;
    overflow-wrap: anywhere;
}

#detailTabs {
    display: flex;
    flex: none;
    padding: 0 10px;
    border-bottom: 1px solid #e5e5e5;
}

#detailTabs button {
    background: none;
    border-radius: 0;
    color: #666;
    font-size: 14px;
    padding: 12px 4px;
    border-bottom: 3px solid transparent;
}

#detailTabs button.active {
    color: #28a745;
    border-bottom-color: #28a745;
}

#detailBody {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px;
}

.tab-page {
    display: none;
}

.tab-page.active {
    display: block;
}

.tab-empty {
    margin: 0;
    font-size: 14px;
    color: #777;
}

.detail-row {
    font-size: 15px;
    color: #333;
    margin-bottom: 10px;
}

.detail-row span {
    color: #777;
}

#detailDeleteBtn {
    display: none;
    width: 100%;
    margin-top: 14px;
    background: #fdecea;
    color: #c62828;
}

/* -----------------------------
   ALT MENÜ
   Ana Sayfa / Harita arasında geçiş. Ortadaki mavi
   düğme menüyü açıp kapatır. Tasarım alt-menu.html
   dosyasından alındı; buraya uyarlanan yerler:
   z-index (form ve ayrıntı sayfasının altında kalsın)
   ve düğmenin iç boşluğu.
----------------------------- */

.alt-menu {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    width: 300px;
    height: 133px;               /* kapsül 78 + butonun taşan kısmı 55 */
    filter: drop-shadow(0 8px 18px rgba(60, 80, 140, .14));
    z-index: 19;
    font-family: 'Nunito', -apple-system, 'Segoe UI', Roboto, sans-serif;

    /* Menünün boş köşeleri haritaya tıklamayı engellemesin. */
    pointer-events: none;
}

.alt-menu .kapsul,
.alt-menu .ac-kapa {
    pointer-events: auto;
}

/* Beyaz kapsül */
.kapsul {
    position: relative;
    height: 78px;
    padding: 8px;
    display: flex;
    justify-content: space-between;
    background: #fff;
    border-radius: 39px;
    transform-origin: 50% 100%;
    transition: transform .35s cubic-bezier(.34, 1.4, .64, 1), opacity .25s ease;
}

/* Kapsül ile yuvarlak butonu yumuşakça birleştiren kavisler */
.kapsul::before,
.kapsul::after {
    content: '';
    position: absolute;
    top: calc(100% - 0.5px);
    width: 18px;
    height: 14px;
    pointer-events: none;
}

.kapsul::before {
    left: calc(50% - 57px);
    background: radial-gradient(circle at 0 100%, transparent 14px, #fff 14.5px);
}

.kapsul::after {
    left: calc(50% + 39px);
    background: radial-gradient(circle at 100% 100%, transparent 14px, #fff 14.5px);
}

/* Menü öğeleri */
.oge {
    width: 130px;
    height: 62px;
    border: none;
    border-radius: 31px;
    background: #f0f1f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    color: #2b2f3a;
    text-decoration: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background .2s ease, transform .15s ease;
}

.oge:hover  { background: #e6e9f2; }
.oge:active { transform: scale(.96); }
.oge.aktif  { background: #e3edff; color: #1f6ff2; }
.oge:focus-visible { outline: 3px solid #9cc2ff; outline-offset: 2px; }

.oge .ikon {
    font-size: 24px;
    line-height: 1;
}

/* Ortadaki mavi buton */
.ac-kapa {
    position: absolute;
    left: 50%;
    top: 47px;
    flex: none;
    width: 86px;
    height: 86px;
    margin-left: -43px;
    padding: 0;
    border: 5px solid #fff;
    border-radius: 50%;
    background: linear-gradient(180deg, #3d8dff 0%, #1f6ff2 100%);
    box-shadow: 0 10px 24px rgba(37, 117, 252, .45);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .15s ease, box-shadow .2s ease;
}

.ac-kapa:hover  { box-shadow: 0 12px 30px rgba(37, 117, 252, .6); }
.ac-kapa:active { transform: scale(.94); }
.ac-kapa:focus-visible { outline: 3px solid #9cc2ff; outline-offset: 3px; }

/*
 * Ok: menü açıkken aşağı bakar (basınca kapanır),
 * kapalıyken yukarı bakar (basınca açılır).
 */
.ac-kapa svg {
    width: 30px;
    height: 30px;
    transform: rotate(180deg);
    transition: transform .3s ease;
}

/* Kapalı durum */
.alt-menu.kapali .kapsul {
    transform: scale(.2);
    opacity: 0;
    pointer-events: none;
}

.alt-menu.kapali .ac-kapa svg { transform: rotate(0deg); }

@media (max-width: 340px) {
    .alt-menu { transform: translateX(-50%) scale(.9); transform-origin: 50% 100%; }
}

/* Menü düğmesi: ana sayfada "Son eklenenler" başlığının sağında */
#menuBtn {
    flex: none;
    width: 40px;
    height: 40px;
    padding: 0;
    background: none;
    color: #333;
    font-size: 24px;
}

/* -----------------------------
   ANA SAYFA
   Haritanın üzerinde durur; Harita sekmesinde gizlenir.
----------------------------- */

#homePage {
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    z-index: 18;
    background: #f4f5f7;
    display: none;
    flex-direction: column;
}

body[data-tab="home"] #homePage {
    display: flex;
}

#homeMenu {
    position: absolute;
    top: 54px;
    right: var(--side-gap);
    z-index: 2;
    display: none;
    flex-direction: column;
    min-width: 210px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 5px 25px rgba(0,0,0,.25);
    overflow: hidden;
}

#homeMenu.open {
    display: flex;
}

#homeMenu button {
    flex: none;
    background: none;
    border-radius: 0;
    padding: 14px 16px;
    text-align: left;
    font-size: 15px;
    font-weight: normal;
    color: #222;
    border-bottom: 1px solid #eee;
}

#homeMenu button:last-child {
    border-bottom: 0;
}

#homeMain {
    flex: 1;
    overflow-y: auto;
    /* Alttaki boşluk: son kart alt menünün arkasında kalmasın. */
    padding: 12px var(--side-gap) 180px;
}

#homeTitleRow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
}

#homeTitleRow h2 {
    margin: 0;
    font-size: 16px;
    color: #444;
}

.home-card {
    display: flex;
    flex: none;
    width: 100%;
    gap: 12px;
    align-items: center;
    padding: 10px;
    margin-bottom: 10px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.12);
    text-align: left;
    font-weight: normal;
    color: #222;
}

.home-card img {
    flex: none;
    width: 88px;
    height: 56px;
    object-fit: cover;
    border-radius: 8px;
    background: #eee;
}

.home-card-text {
    min-width: 0;
}

.home-card-title {
    font-size: 15px;
    font-weight: bold;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.home-card-sub {
    font-size: 13px;
    color: #666;
    margin-top: 3px;
}

.home-empty {
    font-size: 14px;
    color: #777;
    line-height: 1.5;
}

/* -----------------------------
   FORMDAKİ EK BİLGİLER (isteğe bağlı)
----------------------------- */

#extraFields {
    margin-bottom: 10px;
}

#extraFields summary {
    padding: 8px 0;
    font-size: 14px;
    color: #1a73e8;
    cursor: pointer;
}

#description {
    resize: vertical;
    min-height: 70px;
}

/* -----------------------------
   AYRINTI SAYFASI: PAYLAŞ DÜĞMESİ
----------------------------- */

#detailShareBtn {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 2;
    flex: none;
    height: 40px;
    padding: 0 14px;
    border-radius: 20px;
    background: rgba(0,0,0,.55);
    color: white;
    font-size: 14px;
}

.detail-text {
    font-size: 15px;
    color: #333;
    line-height: 1.5;
    margin: 4px 0 10px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

/* -----------------------------
   KONUMUM BUTONU
----------------------------- */

#locationBtn {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 15;

    width: 48px;
    height: 48px;

    border: none;
    border-radius: 50%;

    background: white;
    color: #333;

    font-size: 22px;

    box-shadow: 0 2px 10px rgba(0,0,0,.25);

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    padding: 0;
}

#locationBtn:active {
    transform: scale(.94);
}

#locationBtn.loading {
    opacity: .6;
}

/* -----------------------------
   GÖRÜNÜM SEÇENEKLERİ
----------------------------- */

#options {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 15;

    background: white;
    border-radius: 14px;
    padding: 6px 12px;

    box-shadow: 0 2px 10px rgba(0,0,0,.25);

    font-size: 14px;
    color: #333;
}

#options label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 0;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
}

#options input {
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: #28a745;
    cursor: pointer;
}

</style>
</head>

<body>

<div id="map"></div>

<!-- ANA SAYFA -->
<div id="homePage">

    <nav id="homeMenu">
        <button id="menuLatest">Son eklenenler</button>
        <button id="menuMine">Yüklemelerim</button>
        <button id="menuMap">Haritayı aç</button>
        <button id="menuAccount">Giriş yap / Kayıt ol</button>
    </nav>

    <main id="homeMain">
        <div id="homeTitleRow">
            <h2 id="homeTitle">Son eklenenler</h2>
            <button id="menuBtn" aria-label="Menü">☰</button>
        </div>
        <div id="homeList"></div>
    </main>
</div>

<!-- ALT MENÜ -->
<nav class="alt-menu" id="altMenu" aria-label="Alt menü">
    <div class="kapsul" id="kapsul">
        <a href="#" class="oge" data-sayfa="anasayfa">
            <span class="ikon">🏠</span>
            <span>Ana Sayfa</span>
        </a>
        <a href="#" class="oge" data-sayfa="harita">
            <span class="ikon">🗺️</span>
            <span>Harita</span>
        </a>
    </div>

    <button class="ac-kapa" id="acKapa" type="button" aria-label="Menüyü aç/kapat" aria-expanded="true" aria-controls="kapsul">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 15 12 9 18 15"></polyline>
        </svg>
    </button>
</nav>

<button id="locationBtn" aria-label="Konumum" title="Konumum">📍</button>

<div id="options">
    <label>
        <input id="showStreets" type="checkbox">
        Cadde ve sokak isimleri
    </label>
    <label>
        <input id="showPlaces" type="checkbox">
        Diğer yerler
    </label>
</div>

<!-- GİRİŞ / KAYIT -->
<div id="loginPanel">
    <h3 id="loginTitle">Giriş yap</h3>

    <input id="loginUsername" type="text" placeholder="Kullanıcı adı (a-z, 0-9, _)" maxlength="20" autocomplete="off" autocapitalize="none" spellcheck="false">

    <input id="loginEmail" type="email" placeholder="E-posta" autocomplete="username">

    <input id="loginPassword" type="password" placeholder="Şifre" autocomplete="current-password">

    <div class="buttons">
        <button id="loginCancelBtn">İptal</button>
        <button id="loginBtn">Giriş</button>
    </div>

    <button id="loginSwitch">Hesabın yok mu? Kayıt ol</button>
</div>

<!-- İNŞAAT EKLEME FORMU -->
<div id="panel">
    <h3>İnşaat ekle</h3>

    <input id="locationName" type="text" placeholder="İnşaat adı (isteğe bağlı)" maxlength="100">

    <select id="placeType" aria-label="İnşaat türü">
        <option value="">Tür seç…</option>

/* Firebase hatalarını Türkçe mesaja çevirir. */
function firebaseErrorMessage(error) {

    const code = (error && error.code) || '';

    if (
        code === 'permission-denied' ||
        code === 'storage/unauthorized'
    ) {
        return 'Bu işlem için yetkin yok.';
    }

    if (
        code === 'auth/invalid-credential' ||
        code === 'auth/wrong-password' ||
        code === 'auth/user-not-found' ||
        code === 'auth/invalid-email'
    ) {
        return 'E-posta veya şifre hatalı.';
    }

    if (code === 'auth/email-already-in-use')
        return 'Bu e-posta ile zaten bir hesap var. Giriş yapmayı deneyin.';

    if (code === 'auth/weak-password')
        return 'Şifre en az 6 karakter olmalı.';

    if (code === 'auth/too-many-requests')
        return 'Çok fazla deneme yapıldı. Biraz sonra tekrar deneyin.';

    if (
        code === 'auth/network-request-failed' ||
        code === 'unavailable' ||
        code === 'storage/retry-limit-exceeded'
    ) {
        return 'İnternet bağlantısı kurulamadı.';
    }

    if (!code && error && error.message)
        return error.message;

    return 'İşlem başarısız: ' + (code || 'bilinmeyen hata');
}


/* =================================================

================================================= */

const STYLE_URL = 'https://tiles.openfreemap.org/styles/liberty';

/* POI ikonlarının küçültme oranı (1 = orijinal) */
const POI_ICON_SCALE = 0.5;

/* Cadde ve sokak isimlerinin yazı küçültme oranı (1 = orijinal) */
const STREET_TEXT_SCALE = 0.75;

/*
 * Etiketlerin kaç yakınlaştırma seviyesi DAHA ERKEN
 * (daha uzaktan) görüneceği. 0 = haritanın kendi ayarı.
 *
 *   Sokak isimleri   : 15   -> 14
 *   Ana cadde/yollar : 12.2 -> 11.2
 *   Diğer yerler     : 15 / 16 / 17 -> 13.5 / 14.5 / 15.5
 *                      (önem sırasına göre üç kademe)
 *
 * Sokaklar için 1'den büyük değer işe yaramaz: sokak
 * isimleri harita verisinde 14. seviyeden önce yok.
 */
const STREET_ZOOM_SHIFT = 1;
const PLACE_ZOOM_SHIFT = 1.5;

/* Türkçe isim önceliği uygulanacak veri katmanları */
const TURKISH_NAME_LAYERS = [
    'poi',
    'park',
    'transportation_name',
    'place',
    'aerodrome_label'
];

const map = new maplibregl.Map({
    container: 'map',
    center: [26.4144, 40.1467],
    zoom: 14,
    doubleClickZoom: true,
    attributionControl: false
});

/*
 * Kaynak bilgisi (OpenFreeMap / OpenStreetMap) küçük
 * bir "i" düğmesi olarak gösterilir. Tamamen kaldırma:
 * OpenStreetMap verisinin lisansı kaynak gösterilmesini
 * zorunlu kılıyor.
 */
map.addControl(
    new maplibregl.AttributionControl({ compact: true }),
    'bottom-right'
);

/*
 * OpenStreetMap kaynak gösterme kuralı: yazı açılışta
 * görünür olmalı; harita kaydırılınca veya 5 saniye
 * sonra "i" düğmesine küçülebilir.
 *
 * MapLibre haritayı kaydırınca kendisi küçültür.
 * Burada ek olarak 5 saniye sonra küçültüyoruz.
 */
const ATTRIBUTION_VISIBLE_MS = 5000;

function collapseAttribution() {

    const el = map.getContainer().querySelector(
        '.maplibregl-ctrl-attrib'
    );

    if (!el || !el.classList.contains('maplibregl-compact'))
        return;

    el.removeAttribute('open');
    el.classList.remove('maplibregl-compact-show');
}

map.once('load', () => {
    setTimeout(collapseAttribution, ATTRIBUTION_VISIBLE_MS);
});


/* =================================================
   GÖRÜNÜM SEÇENEKLERİ
   -------------------------------------------------
   Harita temiz başlar. Kutular işaretlenince ilgili
   katmanlar görünür olur.
     streets : cadde/sokak isimleri + yol numaraları
     places  : mekânlar, duraklar, parklar, havalimanı
================================================= */

const visibleGroups = {
    streets: false,
    places: false
};

const PLACE_SOURCE_LAYERS = [
    'poi',
    'park',
    'aerodrome_label'
];

/* Katmanın hangi seçeneğe ait olduğunu döndürür. */
function layerGroup(layer) {

    if (layer.type !== 'symbol')
        return null;

    const sourceLayer = layer['source-layer'];

    if (sourceLayer === 'transportation_name')
        return 'streets';

    if (PLACE_SOURCE_LAYERS.includes(sourceLayer))
        return 'places';

    return null;
}

/* Seçeneklerin güncel halini haritaya uygular. */
function applyVisibility() {

    const style = map.getStyle();

    if (!style || !style.layers)
        return;

    style.layers.forEach(layer => {

        const group = layerGroup(layer);

        if (!group)
            return;

        try {
            map.setLayoutProperty(
                layer.id,
                'visibility',
                visibleGroups[group] ? 'visible' : 'none'
            );
        } catch (e) {}
    });
}

document.getElementById('showStreets').addEventListener(
    'change',
    function() {
        visibleGroups.streets = this.checked;
        applyVisibility();
    }
);

document.getElementById('showPlaces').addEventListener(
    'change',
    function() {
        visibleGroups.places = this.checked;
        applyVisibility();
    }
);

/* Tarayıcı geri gelince eski işaretleri hatırlamasın. */
document.getElementById('showStreets').checked = false;
document.getElementById('showPlaces').checked = false;


/*
 * icon-size değerini oranla çarpar.
 * Değer sayı, eski tip {stops: [...]} nesnesi veya
 * ifade (interpolate / step / diğer) olabilir.
 */
function scaleSize(value, scale) {

    if (value === undefined || value === null)
        return scale;

    if (typeof value === 'number')
        return value * scale;

    /* Eski tip fonksiyon: { stops: [[zoom, değer], ...] } */
    if (!Array.isArray(value)) {

        if (Array.isArray(value.stops)) {
            return Object.assign({}, value, {
                stops: value.stops.map(stop => [
                    stop[0],
                    scaleSize(stop[1], scale)
                ])
            });
        }

        return value;
    }

    const op = value[0];

    /* ['interpolate', tip, girdi, z1, d1, z2, d2, ...] */
    if (typeof op === 'string' && op.indexOf('interpolate') === 0) {
        return value.map((item, i) =>
            (i >= 4 && i % 2 === 0)
                ? scaleSize(item, scale)
                : item
        );
    }

    /* ['step', girdi, d0, z1, d1, z2, d2, ...] */
    if (op === 'step') {
        return value.map((item, i) =>
            (i >= 2 && i % 2 === 0)
                ? scaleSize(item, scale)
                : item
        );
    }

    return ['*', value, scale];
}


/*
 * Stil haritaya verilmeden önce düzenlenir.
 */
function prepareStyle(style) {

    (style.layers || []).forEach(layer => {

        if (layer.type !== 'symbol')
            return;

        if (!layer.layout)
            layer.layout = {};

        const sourceLayer = layer['source-layer'];

        /* GÖRÜNÜM SEÇENEKLERİ: harita temiz başlar */
        const group = layerGroup(layer);

        if (group) {
            layer.layout.visibility =
                visibleGroups[group] ? 'visible' : 'none';
        }

        /* ETİKETLER DAHA UZAKTAN GÖRÜNSÜN */
        const isStreetName =
            sourceLayer === 'transportation_name' &&
            !layer.layout['icon-image'];

        const zoomShift = isStreetName
            ? STREET_ZOOM_SHIFT
            : (sourceLayer === 'poi' ? PLACE_ZOOM_SHIFT : 0);

        if (zoomShift && typeof layer.minzoom === 'number')
            layer.minzoom = Math.max(0, layer.minzoom - zoomShift);

        /* TÜRKÇE İSİM ÖNCELİĞİ */
        if (
            layer.layout['text-field'] &&
            TURKISH_NAME_LAYERS.includes(sourceLayer)
        ) {
            layer.layout['text-field'] = [
                'coalesce',
                ['get', 'name:tr'],
                ['get', 'name'],
                ['get', 'name:latin']
            ];
        }

        /*
         * CADDE VE SOKAK İSİMLERİ
         * Yol numarası levhaları (ikonlu katmanlar) hariç.
         * text-size belirtilmemişse MapLibre varsayılanı 16'dır.
         */
        if (
            sourceLayer === 'transportation_name' &&
            layer.layout['text-field'] &&
            !layer.layout['icon-image']
        ) {
            const currentTextSize = layer.layout['text-size'];

            layer.layout['text-size'] = scaleSize(
                (currentTextSize === undefined || currentTextSize === null)
                    ? 16
                    : currentTextSize,
                STREET_TEXT_SCALE
            );
        }

        /*
         * TÜM POI İKONLARI (duraklar dahil)
         * Yazı boyutuna dokunulmuyor.
         */
        if (
            sourceLayer === 'poi' &&
            layer.layout['icon-image']
        ) {
            layer.layout['icon-size'] = scaleSize(
                layer.layout['icon-size'],
                POI_ICON_SCALE
            );
        }
    });

    return style;
}


fetch(STYLE_URL)
    .then(response => {
        if (!response.ok)
            throw new Error('Stil indirilemedi: ' + response.status);
        return response.json();
    })
    .then(style => {
        map.setStyle(prepareStyle(style));
    })
    .catch(error => {
        /* Stil düzenlenemezse harita yine de açılsın. */
        console.error(error);
        map.once('style.load', applyVisibility);
        map.setStyle(STYLE_URL);
    });


/* =================================================

================================================= */

let pressTimer = null;
let pressStart = null;
let pressLngLat = null;

map.getCanvas().addEventListener(
    'touchstart',
    function(e) {

        if (!e.touches || e.touches.length !== 1)
            return;

        const touch = e.touches[0];

        pressStart = {
            x: touch.clientX,
            y: touch.clientY
        };

        const rect =
            map.getCanvas().getBoundingClientRect();

        pressLngLat = map.unproject({
            x: touch.clientX - rect.left,
            y: touch.clientY - rect.top
        });

        clearTimeout(pressTimer);

        pressTimer = setTimeout(() => {

            if (!pressLngLat)
                return;

            openAddPanel(pressLngLat);

        }, 700);
    },
    { passive: true }
);

map.getCanvas().addEventListener(
    'touchmove',
    function(e) {

        if (!pressStart)
            return;

        const touch = e.touches[0];

        const dx = touch.clientX - pressStart.x;
        const dy = touch.clientY - pressStart.y;

        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance > 10) {
            clearTimeout(pressTimer);
            pressStart = null;
            pressLngLat = null;
        }
    },
    { passive: true }
);

map.getCanvas().addEventListener(
    'touchend',
    function() {
        clearTimeout(pressTimer);
        pressStart = null;
        pressLngLat = null;
    }
);


/* =================================================

let mouseStart = null;
let mouseLngLat = null;

map.getCanvas().addEventListener(

/* =================================================
   KULLANICI KONUMU
================================================= */

const locationBtn =
    document.getElementById('locationBtn');

let userLocationMarker = null;

let locationAccuracyCircle = null;


/*
 * Konumum butonuna basıldığında çalışır.
 */
locationBtn.addEventListener(
    'click',
    function() {

        if (!navigator.geolocation) {

            alert(
                'Bu cihazda konum özelliği desteklenmiyor.'
            );

            return;
        }

        locationBtn.classList.add('loading');

        navigator.geolocation.getCurrentPosition(

            function(position) {

                locationBtn.classList.remove('loading');

                const lat =
                    position.coords.latitude;

                const lng =
                    position.coords.longitude;

                const accuracy =
                    position.coords.accuracy;


                const userLngLat = [
                    lng,
                    lat
                ];


                /*
                 * Daha önce konum işareti varsa kaldır.
                 */
                if (userLocationMarker) {
                    userLocationMarker.remove();
                }


                if (locationAccuracyCircle) {
                    locationAccuracyCircle.remove();
                }


                /*
                 * Mavi konum noktası.
                 */
                const el =
                    document.createElement('div');

                el.style.width = '18px';
                el.style.height = '18px';

                el.style.borderRadius = '50%';

                el.style.background = '#4285F4';

                el.style.border =
                    '3px solid white';

                el.style.boxShadow =
                    '0 1px 5px rgba(0,0,0,.4)';


                userLocationMarker =
                    new maplibregl.Marker({
                        element: el
                    })
                    .setLngLat(userLngLat)
                    .addTo(map);


                /*
                 * Kullanıcının bulunduğu noktaya git.
                 */
                map.flyTo({

                    center: userLngLat,

                    zoom: Math.max(
                        map.getZoom(),
                        15
                    ),

                    duration: 1000

                });


            },

            function(error) {

                locationBtn.classList.remove(
                    'loading'
                );


                let message =
                    'Konum alınamadı.';


                switch (error.code) {

                    case error.PERMISSION_DENIED:

                        message =
                            'Konum izni verilmedi. ' +
                            'Tarayıcı veya uygulama ayarlarından ' +
                            'konum iznini açın.';

                        break;


                    case error.POSITION_UNAVAILABLE:

                        message =
                            'Konum bilgisi şu anda kullanılamıyor.';

                        break;


                    case error.TIMEOUT:

                        message =
                            'Konum alınırken zaman aşımına uğradı.';

                        break;

                }


                alert(message);

            },

            {
                enableHighAccuracy: true,

                timeout: 10000,

                maximumAge: 30000

            }

        );

    }
);

/* '2026-10-10' -> '10.10.2026' */
function formatDate(value) {

    if (typeof value !== 'string' || value.length !== 10)
        return 'Belirtilmemiş';

    const parts = value.split('-');

    return parts[2] + '.' + parts[1] + '.' + parts[0];
}


/* =================================================
