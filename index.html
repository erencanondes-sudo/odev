<style>
* { box-sizing: border-box; }

/*
 * İÇERİK GENİŞLİĞİ
 * Ana sayfadaki inşaat kartları ve ayrıntı sayfası
 * aynı genişliği kullanır. --side-gap, bu
 * genişliği ortalamak için iki yanda kalan boşluktur.
 */
:root {
    --content-width: 640px;
    --side-gap: max(16px, calc((100% - var(--content-width)) / 2));
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#map {
    position: absolute;
    inset: 0;
}

/* -----------------------------
   ALT PANELLER
   panel       : inşaat ekleme formu
   loginPanel  : giriş / kayıt
----------------------------- */

#panel,
#loginPanel {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    width: min(92%, 400px);
    max-height: calc(100% - 40px);
    overflow-y: auto;
    background: white;
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 5px 25px rgba(0,0,0,.25);
    z-index: 20;
    display: none;
}

#panel h3,
#loginPanel h3 {
    margin: 0 0 14px;
    font-size: 20px;
}

#locationName,
#placeType,
#startDate,
#endDate,
#company,
#buildStatus,
#floors,
#units,
#description,
#loginUsername,
#loginEmail,
#loginPassword {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    font-family: inherit;
    background: white;
    margin-bottom: 10px;
}

/* Kullanıcı adı kutusu sadece kayıt olurken görünür */
#loginUsername {
    display: none;
}

.field-row {
    display: flex;
    gap: 8px;
}

.field-row > label {
    flex: 1;
    min-width: 0;
}

.field-label {
    display: block;
    font-size: 12px;
    color: #666;
    margin-bottom: 4px;
}

#imageInput {
    width: 100%;
    margin-bottom: 10px;
}

/* Seçilen resimlerin küçük önizlemeleri */
#thumbs {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 8px;
}

.thumb {
    position: relative;
    width: 64px;
    height: 64px;
}

.thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
    display: block;
}

.thumb button {
    position: absolute;
    top: -7px;
    right: -7px;
    width: 22px;
    height: 22px;
    flex: none;
    padding: 0;
    border-radius: 50%;
    background: #c62828;
    color: white;
    font-size: 14px;
    line-height: 22px;
}

#sizeInfo {
    font-size: 12px;
    color: #777;
    margin-bottom: 12px;
}

.buttons {
    display: flex;
    gap: 8px;
}

button {
    flex: 1;
    border: 0;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
    cursor: default;
}

#addBtn,
#loginBtn {
    background: #28a745;
    color: white;
}

#cancelBtn,
#loginCancelBtn {
    background: #eee;
    color: #333;
}

/* Giriş / kayıt arasında geçiş bağlantısı */
#loginSwitch {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 6px;
    background: none;
    color: #1a73e8;
    font-size: 14px;
    font-weight: normal;
}

/* -----------------------------
   HARİTADAKİ İNŞAAT İŞARETİ
   Sade, sabit büyüklükte bir iğne. Üstündeki etikette
   ikon ve tür adı yazar; etiket sadece yakınlaşınca
   görünür (bkz. MARKER_LABEL_MIN_ZOOM).
----------------------------- */

.place-marker {
    /* Konumlandırmayı (position: absolute) MapLibre yapar. */
    width: 28px;
    height: 37px;
    cursor: pointer;
}

.place-pin {
    position: relative;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #28a745;
    border: 3px solid white;
    box-shadow: 0 3px 8px rgba(0,0,0,.35);
}

/* Ortadaki beyaz nokta */
.place-pin::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 8px;
    height: 8px;
    margin: -4px 0 0 -4px;
    border-radius: 50%;
    background: white;
}

/* Alttaki sivri uç */
.place-pin::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: -11px;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top: 9px solid #28a745;
    border-bottom: 0;
}

.place-label {
    display: none;
    position: absolute;
    left: 50%;
    bottom: 100%;
    transform: translateX(-50%);
    margin-bottom: 4px;
    background: white;
    color: #222;
    font-size: 12px;
    font-weight: bold;
    padding: 3px 8px;
    border-radius: 10px;
    white-space: nowrap;
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
}

body.show-place-labels .place-label {
    display: block;
}

/* -----------------------------
   İŞARETE TIKLAMA: KÜÇÜK KUTU
   Küçük resim + ekleyen kişi.
   Kutuya tıklanınca ayrıntı sayfası açılır.
----------------------------- */

.popup-content {
    width: 220px;
    cursor: pointer;
}

.popup-content img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 8px;
    display: block;
    background: #eee;
}

.popup-title {
    font-weight: bold;
    font-size: 16px;
    overflow-wrap: anywhere;
}

.popup-sub {
    font-size: 13px;
    color: #555;
    margin-top: 2px;
}

.popup-hint {
    font-size: 12px;
    color: #1a73e8;
    margin-top: 6px;
}

/* -----------------------------
   AYRINTI SAYFASI
   Haritanın üzerine alttan açılır. Arka planı tüm sayfayı
   kaplar, içerik ortadaki sütunda durur.
   Üstte kaydırmalı resimler, altta üç sekme.
----------------------------- */

#detailSheet {
    position: fixed;
    inset: 0;
    z-index: 30;

    /* Arka plan tüm sayfayı (haritayı da) kaplar. */
    background: #f4f5f7;

    transform: translateY(100%);
    visibility: hidden;
    transition: transform .28s ease, visibility 0s linear .28s;
}

#detailSheet.open {
    transform: translateY(0);
    visibility: visible;
    transition: transform .28s ease, visibility 0s;
}

/* İçerik sütunu: ana sayfadaki kartlarla aynı genişlikte */
#detailInner {
    position: relative;
    width: 100%;
    max-width: var(--content-width);
    height: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: white;

/* -----------------------------
   ALT MENÜ
   Ana Sayfa / Harita arasında geçiş. Ortadaki mavi
   düğme menüyü açıp kapatır. Tasarım alt-menu.html
   dosyasından alındı; buraya uyarlanan yerler:
   z-index (form ve ayrıntı sayfasının altında kalsın),
   düğmenin iç boşluğu, okun yönü ve mavi düğmenin
   boyutu (86 yerine 72 piksel).
----------------------------- */

.alt-menu {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    width: 300px;
    height: 126px;               /* kapsül 78 + butonun taşan kısmı 48 */
    filter: drop-shadow(0 8px 18px rgba(60, 80, 140, .14));
    z-index: 19;
    font-family: 'Nunito', -apple-system, 'Segoe UI', Roboto, sans-serif;

    /* Menünün boş köşeleri haritaya tıklamayı engellemesin. */
    pointer-events: none;
}

.alt-menu .kapsul,
.alt-menu .ac-kapa {
    pointer-events: auto;
}

/* Beyaz kapsül */
.kapsul {
    position: relative;
    height: 78px;
    padding: 8px;
    display: flex;
    justify-content: space-between;
    background: #fff;
    border-radius: 39px;
    transform-origin: 50% 100%;
    transition: transform .35s cubic-bezier(.34, 1.4, .64, 1), opacity .25s ease;
}

/* Kapsül ile yuvarlak butonu yumuşakça birleştiren kavisler */
.kapsul::before,
.kapsul::after {
    content: '';
    position: absolute;
    top: calc(100% - 0.5px);
    width: 18px;
    height: 14px;
    pointer-events: none;
}

.kapsul::before {
    left: calc(50% - 50px);
    background: radial-gradient(circle at 0 100%, transparent 14px, #fff 14.5px);
}

.kapsul::after {
    left: calc(50% + 32px);
    background: radial-gradient(circle at 100% 100%, transparent 14px, #fff 14.5px);
}

/* Menü öğeleri */
.oge {
    width: 130px;
    height: 62px;
    border: none;
    border-radius: 31px;
    background: #f0f1f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    color: #2b2f3a;
    text-decoration: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background .2s ease, transform .15s ease;
}

.oge:hover  { background: #e6e9f2; }
.oge:active { transform: scale(.96); }
.oge.aktif  { background: #e3edff; color: #1f6ff2; }
.oge:focus-visible { outline: 3px solid #9cc2ff; outline-offset: 2px; }

.oge .ikon {
    font-size: 24px;
    line-height: 1;
}

/* Ortadaki mavi buton */
.ac-kapa {
    position: absolute;
    left: 50%;
    top: 54px;
    flex: none;
    width: 72px;
    height: 72px;
    margin-left: -36px;
    padding: 0;
    border: 5px solid #fff;
    border-radius: 50%;
    background: linear-gradient(180deg, #3d8dff 0%, #1f6ff2 100%);
    box-shadow: 0 10px 24px rgba(37, 117, 252, .45);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .15s ease, box-shadow .2s ease;
}

.ac-kapa:hover  { box-shadow: 0 12px 30px rgba(37, 117, 252, .6); }
.ac-kapa:active { transform: scale(.94); }
.ac-kapa:focus-visible { outline: 3px solid #9cc2ff; outline-offset: 3px; }

/*
 * Ok: menü açıkken aşağı bakar (basınca kapanır),
 * kapalıyken yukarı bakar (basınca açılır).
 */
.ac-kapa svg {
    width: 26px;
    height: 26px;
    transform: rotate(180deg);
    transition: transform .3s ease;
}

/* Kapalı durum */
.alt-menu.kapali .kapsul {
    transform: scale(.2);
    opacity: 0;
    pointer-events: none;
}

.alt-menu.kapali .ac-kapa svg { transform: rotate(0deg); }

@media (max-width: 340px) {
    .alt-menu { transform: translateX(-50%) scale(.9); transform-origin: 50% 100%; }
}

<script type="module">

/* =================================================
   FIREBASE
   -------------------------------------------------
   Auth      : e-posta / şifre ile giriş ve kayıt
   Firestore : "places"    inşaat kayıtları
               "users"     kullanıcı adı (uid -> ad)
               "usernames" kullanıcı adı (ad -> uid),
                           aynı adın iki kez alınmasını önler
   Storage   : resimler, "places/<uid>/" klasöründe

   Herkes haritayı görebilir. Hesap açan herkes
   inşaat ekleyebilir; herkes yalnızca kendi
   eklediğini silebilir.
================================================= */

import { initializeApp }
    from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';

import {
    getAuth,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    signOut
} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js';

import {
    getFirestore,
    collection,
    doc,
    getDoc,
    setDoc,
    deleteDoc,
    writeBatch,
    query,
    where,
    onSnapshot,
    serverTimestamp
} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js';

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL,
    deleteObject
} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-storage.js';

const firebaseConfig = {
    apiKey: "AIzaSyAjePBYTAqvEOMKCAM0OYjlnHKXP7SL5Us",

};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);
const storage = getStorage(firebaseApp);

/* Giriş yapmış kullanıcı (yoksa null) ve kullanıcı adı */
let currentUser = null;
let currentUsername = null;

/* Firebase hatalarını Türkçe mesaja çevirir. */
function firebaseErrorMessage(error) {

    const code = (error && error.code) || '';

    if (
        code === 'permission-denied' ||
        code === 'storage/unauthorized'
    ) {
        return 'Bu işlem için yetkin yok.';
    }

    if (
        code === 'auth/invalid-credential' ||
        code === 'auth/wrong-password' ||
        code === 'auth/user-not-found' ||
        code === 'auth/invalid-email'
    ) {
        return 'E-posta veya şifre hatalı.';
    }

    if (code === 'auth/email-already-in-use')
        return 'Bu e-posta ile zaten bir hesap var. Giriş yapmayı deneyin.';

    if (code === 'auth/weak-password')
        return 'Şifre en az 6 karakter olmalı.';

    if (code === 'auth/too-many-requests')
        return 'Çok fazla deneme yapıldı. Biraz sonra tekrar deneyin.';

    if (
        code === 'auth/network-request-failed' ||
        code === 'unavailable' ||
        code === 'storage/retry-limit-exceeded'
    ) {
        return 'İnternet bağlantısı kurulamadı.';
    }

    if (!code && error && error.message)
        return error.message;

    return 'İşlem başarısız: ' + (code || 'bilinmeyen hata');
}


/* =================================================
   HARİTA
   -------------------------------------------------
   Harita önce stilsiz oluşturulur. Stil dosyası
   ayrıca indirilir, Türkçe isimler ve küçük POI
   ikonları stile ÖNCEDEN işlenir, sonra haritaya
   verilir. Böylece ikonlar ilk çizimde bile küçük
   görünür (önce büyük görünüp küçülme olmaz).
================================================= */

const STYLE_URL = 'https://tiles.openfreemap.org/styles/liberty';

/* POI ikonlarının küçültme oranı (1 = orijinal) */
const POI_ICON_SCALE = 0.5;

/* Cadde ve sokak isimlerinin yazı küçültme oranı (1 = orijinal) */
const STREET_TEXT_SCALE = 0.75;

/*
 * Etiketlerin kaç yakınlaştırma seviyesi DAHA ERKEN
 * (daha uzaktan) görüneceği. 0 = haritanın kendi ayarı.
 *
 *   Sokak isimleri   : 15   -> 14
 *   Ana cadde/yollar : 12.2 -> 11.2
 *   Diğer yerler     : 15 / 16 / 17 -> 13.5 / 14.5 / 15.5
 *                      (önem sırasına göre üç kademe)
 *
 * Sokaklar için 1'den büyük değer işe yaramaz: sokak
 * isimleri harita verisinde 14. seviyeden önce yok.
 */
const STREET_ZOOM_SHIFT = 1;
const PLACE_ZOOM_SHIFT = 1.5;

/* Türkçe isim önceliği uygulanacak veri katmanları */
const TURKISH_NAME_LAYERS = [
    'poi',
    'park',
    'transportation_name',
    'place',
    'aerodrome_label'
];

const map = new maplibregl.Map({
    container: 'map',
    center: [26.4144, 40.1467],
    zoom: 14,
    doubleClickZoom: true,
    attributionControl: false
});

/*
 * Kaynak bilgisi (OpenFreeMap / OpenStreetMap) küçük
 * bir "i" düğmesi olarak gösterilir. Tamamen kaldırma:
 * OpenStreetMap verisinin lisansı kaynak gösterilmesini
 * zorunlu kılıyor.
 */
map.addControl(
    new maplibregl.AttributionControl({ compact: true }),
    'top-right'
);

/*
 * OpenStreetMap kaynak gösterme kuralı: yazı açılışta
 * görünür olmalı; harita kaydırılınca veya 5 saniye
 * sonra "i" düğmesine küçülebilir.
 *
 * MapLibre haritayı kaydırınca kendisi küçültür.
 * Burada ek olarak 5 saniye sonra küçültüyoruz.
 */
const ATTRIBUTION_VISIBLE_MS = 5000;

function collapseAttribution() {

    const el = map.getContainer().querySelector(
        '.maplibregl-ctrl-attrib'
    );

    if (!el || !el.classList.contains('maplibregl-compact'))
        return;

    el.removeAttribute('open');
    el.classList.remove('maplibregl-compact-show');
}

/*
 * Süre, harita kullanıcıya İLK KEZ gösterildiğinde başlar.
 * Uygulama Ana Sayfa'da açıldığı için harita arkada yüklenir;
 * süre o sırada işlerse kullanıcı yazıyı hiç görmez.
 */
let mapLoaded = false;
let attributionTimerStarted = false;

function startAttributionTimer() {

    if (
        attributionTimerStarted ||
        !mapLoaded ||
        document.body.dataset.tab !== 'map'
    ) {
        return;
    }

    attributionTimerStarted = true;

    setTimeout(collapseAttribution, ATTRIBUTION_VISIBLE_MS);
}

map.once('load', () => {
    mapLoaded = true;
    startAttributionTimer();
});


/* =================================================
   GÖRÜNÜM SEÇENEKLERİ
   -------------------------------------------------
   Harita temiz başlar. Kutular işaretlenince ilgili
   katmanlar görünür olur.
     streets : cadde/sokak isimleri + yol numaraları
     places  : mekânlar, duraklar, parklar, havalimanı
================================================= */

const visibleGroups = {
    streets: false,
    places: false
};

const PLACE_SOURCE_LAYERS = [
    'poi',
    'park',
    'aerodrome_label'
];

/* Katmanın hangi seçeneğe ait olduğunu döndürür. */
function layerGroup(layer) {

    if (layer.type !== 'symbol')
        return null;

    const sourceLayer = layer['source-layer'];

    if (sourceLayer === 'transportation_name')
        return 'streets';

    if (PLACE_SOURCE_LAYERS.includes(sourceLayer))
        return 'places';

    return null;
}

/* Seçeneklerin güncel halini haritaya uygular. */
function applyVisibility() {

    const style = map.getStyle();

    if (!style || !style.layers)
        return;

    style.layers.forEach(layer => {

        const group = layerGroup(layer);

        if (!group)
            return;

        try {
            map.setLayoutProperty(
                layer.id,
                'visibility',
                visibleGroups[group] ? 'visible' : 'none'
            );
        } catch (e) {}
    });
}

document.getElementById('showStreets').addEventListener(
    'change',
    function() {
        visibleGroups.streets = this.checked;
        applyVisibility();
    }
);

document.getElementById('showPlaces').addEventListener(
    'change',
    function() {
        visibleGroups.places = this.checked;
        applyVisibility();
    }
);

/* Tarayıcı geri gelince eski işaretleri hatırlamasın. */
document.getElementById('showStreets').checked = false;
document.getElementById('showPlaces').checked = false;


/*
 * icon-size değerini oranla çarpar.
 * Değer sayı, eski tip {stops: [...]} nesnesi veya
 * ifade (interpolate / step / diğer) olabilir.
 */
function scaleSize(value, scale) {

    if (value === undefined || value === null)
        return scale;

    if (typeof value === 'number')
        return value * scale;

    /* Eski tip fonksiyon: { stops: [[zoom, değer], ...] } */
    if (!Array.isArray(value)) {

        if (Array.isArray(value.stops)) {
            return Object.assign({}, value, {
                stops: value.stops.map(stop => [
                    stop[0],
                    scaleSize(stop[1], scale)
                ])
            });
        }

        return value;
    }

    const op = value[0];

    /* ['interpolate', tip, girdi, z1, d1, z2, d2, ...] */
    if (typeof op === 'string' && op.indexOf('interpolate') === 0) {
        return value.map((item, i) =>
            (i >= 4 && i % 2 === 0)
                ? scaleSize(item, scale)
                : item
        );
    }

    /* ['step', girdi, d0, z1, d1, z2, d2, ...] */
    if (op === 'step') {
        return value.map((item, i) =>
            (i >= 2 && i % 2 === 0)
                ? scaleSize(item, scale)
                : item
        );
    }

    return ['*', value, scale];
}


/*
 * Stil haritaya verilmeden önce düzenlenir.
 */
function prepareStyle(style) {

    (style.layers || []).forEach(layer => {

        if (layer.type !== 'symbol')
            return;

        if (!layer.layout)
            layer.layout = {};

        const sourceLayer = layer['source-layer'];

        /* GÖRÜNÜM SEÇENEKLERİ: harita temiz başlar */
        const group = layerGroup(layer);

        if (group) {
            layer.layout.visibility =
                visibleGroups[group] ? 'visible' : 'none';
        }

        /* ETİKETLER DAHA UZAKTAN GÖRÜNSÜN */
        const isStreetName =
            sourceLayer === 'transportation_name' &&
            !layer.layout['icon-image'];

        const zoomShift = isStreetName
            ? STREET_ZOOM_SHIFT
            : (sourceLayer === 'poi' ? PLACE_ZOOM_SHIFT : 0);

        if (zoomShift && typeof layer.minzoom === 'number')
            layer.minzoom = Math.max(0, layer.minzoom - zoomShift);

        /* TÜRKÇE İSİM ÖNCELİĞİ */
        if (
            layer.layout['text-field'] &&
            TURKISH_NAME_LAYERS.includes(sourceLayer)
        ) {
            layer.layout['text-field'] = [
                'coalesce',
                ['get', 'name:tr'],
                ['get', 'name'],
                ['get', 'name:latin']
            ];
        }

        /*
         * CADDE VE SOKAK İSİMLERİ
         * Yol numarası levhaları (ikonlu katmanlar) hariç.
         * text-size belirtilmemişse MapLibre varsayılanı 16'dır.
         */
        if (
            sourceLayer === 'transportation_name' &&
            layer.layout['text-field'] &&
            !layer.layout['icon-image']
        ) {
            const currentTextSize = layer.layout['text-size'];

            layer.layout['text-size'] = scaleSize(
                (currentTextSize === undefined || currentTextSize === null)
                    ? 16
                    : currentTextSize,
                STREET_TEXT_SCALE
            );
        }

        /*
         * TÜM POI İKONLARI (duraklar dahil)
         * Yazı boyutuna dokunulmuyor.
         */
        if (
            sourceLayer === 'poi' &&
            layer.layout['icon-image']
        ) {
            layer.layout['icon-size'] = scaleSize(
                layer.layout['icon-size'],
                POI_ICON_SCALE
            );
        }
    });

    return style;
}


fetch(STYLE_URL)
    .then(response => {
        if (!response.ok)
            throw new Error('Stil indirilemedi: ' + response.status);
        return response.json();
    })
    .then(style => {
        map.setStyle(prepareStyle(style));
    })
    .catch(error => {
        /* Stil düzenlenemezse harita yine de açılsın. */
        console.error(error);
        map.once('style.load', applyVisibility);
        map.setStyle(STYLE_URL);
    });

================================================= */

let pressTimer = null;
let pressStart = null;
let pressLngLat = null;

map.getCanvas().addEventListener(
    'touchstart',
    function(e) {

        if (!e.touches || e.touches.length !== 1)
            return;

        const touch = e.touches[0];

        pressStart = {
            x: touch.clientX,
            y: touch.clientY
        };

        const rect =
            map.getCanvas().getBoundingClientRect();

        pressLngLat = map.unproject({
            x: touch.clientX - rect.left,
            y: touch.clientY - rect.top
        });

        clearTimeout(pressTimer);

        pressTimer = setTimeout(() => {

            if (!pressLngLat)
                return;

            openAddPanel(pressLngLat);

        }, 700);
    },
    { passive: true }
);

map.getCanvas().addEventListener(
    'touchmove',
    function(e) {

        if (!pressStart)
            return;

        const touch = e.touches[0];

        const dx = touch.clientX - pressStart.x;
        const dy = touch.clientY - pressStart.y;

        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance > 10) {
            clearTimeout(pressTimer);
            pressStart = null;
            pressLngLat = null;
        }
    },
    { passive: true }
);

map.getCanvas().addEventListener(
    'touchend',
    function() {
        clearTimeout(pressTimer);
        pressStart = null;
        pressLngLat = null;
    }
);

================================================= */

let mouseTimer = null;
let mouseStart = null;
let mouseLngLat = null;

map.getCanvas().addEventListener(
    'mousedown',
    function(e) {

        if (e.button !== 0)
            return;

        mouseStart = {
            x: e.clientX,
            y: e.clientY
        };

        mouseLngLat =
            map.unproject([
                e.offsetX,
                e.offsetY
            ]);

        clearTimeout(mouseTimer);

        mouseTimer = setTimeout(() => {

            if (!mouseLngLat)
                return;

            openAddPanel(mouseLngLat);

        }, 700);
    }
);

map.getCanvas().addEventListener(
    'mousemove',
    function(e) {

        if (!mouseStart)
            return;

        const dx = e.clientX - mouseStart.x;
        const dy = e.clientY - mouseStart.y;

        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance > 8) {
            clearTimeout(mouseTimer);
            mouseStart = null;
            mouseLngLat = null;
        }
    }
);

map.getCanvas().addEventListener(
    'mouseup',
    function() {
        clearTimeout(mouseTimer);
        mouseStart = null;
        mouseLngLat = null;
    }
);



/* =================================================
   KULLANICI KONUMU
================================================= */

const locationBtn =
    document.getElementById('locationBtn');

let userLocationMarker = null;

let locationAccuracyCircle = null;


/*
 * Konumum butonuna basıldığında çalışır.
 */
locationBtn.addEventListener(
    'click',
    function() {

        if (!navigator.geolocation) {

            alert(
                'Bu cihazda konum özelliği desteklenmiyor.'
            );

            return;
        }

        locationBtn.classList.add('loading');

        navigator.geolocation.getCurrentPosition(

            function(position) {

                locationBtn.classList.remove('loading');

                const lat =
                    position.coords.latitude;

                const lng =
                    position.coords.longitude;

                const accuracy =
                    position.coords.accuracy;


                const userLngLat = [
                    lng,
                    lat
                ];


                /*
                 * Daha önce konum işareti varsa kaldır.
                 */
                if (userLocationMarker) {
                    userLocationMarker.remove();
                }


                if (locationAccuracyCircle) {
                    locationAccuracyCircle.remove();
                }


                /*
                 * Mavi konum noktası.
                 */
                const el =
                    document.createElement('div');

                el.style.width = '18px';
                el.style.height = '18px';

                el.style.borderRadius = '50%';

                el.style.background = '#4285F4';

                el.style.border =
                    '3px solid white';

                el.style.boxShadow =
                    '0 1px 5px rgba(0,0,0,.4)';


                userLocationMarker =
                    new maplibregl.Marker({
                        element: el
                    })
                    .setLngLat(userLngLat)
                    .addTo(map);


                /*
                 * Kullanıcının bulunduğu noktaya git.
                 */
                map.flyTo({

                    center: userLngLat,

                    zoom: Math.max(
                        map.getZoom(),
                        15
                    ),

                    duration: 1000

                });


            },

            function(error) {

                locationBtn.classList.remove(
                    'loading'
                );


                let message =
                    'Konum alınamadı.';


                switch (error.code) {

                    case error.PERMISSION_DENIED:

                        message =
                            'Konum izni verilmedi. ' +
                            'Tarayıcı veya uygulama ayarlarından ' +
                            'konum iznini açın.';

                        break;


                    case error.POSITION_UNAVAILABLE:

                        message =
                            'Konum bilgisi şu anda kullanılamıyor.';

                        break;


                    case error.TIMEOUT:

                        message =
                            'Konum alınırken zaman aşımına uğradı.';

                        break;

                }


                alert(message);

            },

            {
                enableHighAccuracy: true,

                timeout: 10000,

                maximumAge: 30000

            }

        );

    }
);

/* '2026-10-10' -> '10.10.2026' */
function formatDate(value) {

    if (typeof value !== 'string' || value.length !== 10)
        return 'Belirtilmemiş';

    const parts = value.split('-');

    return parts[2] + '.' + parts[1] + '.' + parts[0];
}


/* =================================================
   RESİM SINIRLARI VE KÜÇÜLTME
   -------------------------------------------------
   Her resim yüklenmeden önce tarayıcıda küçültülür:
   uzun kenar en fazla 1280 piksel, dosya en fazla
   200 KB. Sığmazsa önce kalite, sonra boyut düşürülür.
================================================= */

const MAX_IMAGES = 5;
const MAX_IMAGE_BYTES = 200 * 1024;
const MAX_IMAGE_SIDE = 1280;

function loadImage(file) {

    return new Promise((resolve, reject) => {

        const url = URL.createObjectURL(file);
        const img = new Image();

        img.onload = () => {
            URL.revokeObjectURL(url);
            resolve(img);
        };

        img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error('Resim okunamadı.'));
        };

        img.src = url;
    });
}

function canvasToJpeg(canvas, quality) {
    return new Promise(resolve => {
        canvas.toBlob(resolve, 'image/jpeg', quality);
    });
}

async function compressImage(file) {

    const img = await loadImage(file);

    let scale = Math.min(
        1,
        MAX_IMAGE_SIDE / Math.max(img.width, img.height)
    );

    for (;;) {

        const width = Math.max(1, Math.round(img.width * scale));
        const height = Math.max(1, Math.round(img.height * scale));

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext('2d');

        /* Saydam resimlerde arka plan siyah çıkmasın. */
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);

        for (const quality of [0.8, 0.7, 0.6, 0.5]) {

            const blob = await canvasToJpeg(canvas, quality);

            if (!blob)
                throw new Error('Resim hazırlanamadı.');

            if (blob.size <= MAX_IMAGE_BYTES)
                return blob;
        }

        if (Math.max(width, height) <= 480)
            throw new Error('Resim 200 KB altına indirilemedi.');

        scale *= 0.8;
    }
}


/*
 * Haritadaki küçük kutuda gösterilen küçük resim.
 * Kutunun boyutuna (220 x 140) göre ortadan kırpılır,
 * keskin ekranlar için iki katı çözünürlükte kaydedilir.
 * Birkaç on KB tuttuğu için hemen iner.
 */
const THUMB_WIDTH = 440;
const THUMB_HEIGHT = 280;

async function makeThumbnail(blob) {

    const img = await loadImage(blob);

    const scale = Math.max(
        THUMB_WIDTH / img.width,
        THUMB_HEIGHT / img.height
    );

    const width = img.width * scale;
    const height = img.height * scale;

    const canvas = document.createElement('canvas');
    canvas.width = THUMB_WIDTH;
    canvas.height = THUMB_HEIGHT;

    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, THUMB_WIDTH, THUMB_HEIGHT);

    ctx.drawImage(
        img,
        (THUMB_WIDTH - width) / 2,
        (THUMB_HEIGHT - height) / 2,
        width,
        height
    );

    const thumb = await canvasToJpeg(canvas, 0.7);

    if (!thumb)
        throw new Error('Küçük resim hazırlanamadı.');

    return thumb;
}


/* =================================================
   İNŞAAT EKLEME FORMU
================================================= */

const panel = document.getElementById('panel');
const imageInput = document.getElementById('imageInput');
const thumbs = document.getElementById('thumbs');
const sizeInfo = document.getElementById('sizeInfo');

let selectedLngLat = null;

/* Giriş yapılmadan uzun basıldıysa, girişten sonra açılacak nokta */
let pendingLngLat = null;

/* Seçilip küçültülmüş resimler: { blob, url } */
let selectedImages = [];

/* Resimler küçültülürken true olur */
let imagesProcessing = false;

/* Form her kapandığında artar; yarım kalan küçültmeler atılır. */
let panelSession = 0;

async function openAddPanel(lngLat) {

    /* İnşaat eklemek için giriş gerekir. */
    if (!currentUser) {
        pendingLngLat = lngLat;
        openLoginPanel();
        return;
    }

    await usernameLoading;

    /* Kullanıcı adı olmayan eski hesaplar için. */
    if (!currentUsername && !(await askUsername()))
        return;

    selectedLngLat = lngLat;
    renderThumbs();
    panel.style.display = 'block';

    layerOpened('panel');
}

function renderThumbs() {

    thumbs.textContent = '';

    let totalBytes = 0;

    selectedImages.forEach(item => {

        totalBytes += item.blob.size;

        const box = document.createElement('div');
        box.className = 'thumb';

        const img = document.createElement('img');
        img.src = item.url;
        img.alt = '';
        box.appendChild(img);

        const removeBtn = document.createElement('button');
        removeBtn.textContent = '×';
        removeBtn.setAttribute('aria-label', 'Resmi kaldır');
        removeBtn.addEventListener('click', () => {
            URL.revokeObjectURL(item.url);
            selectedImages =
                selectedImages.filter(other => other !== item);
            renderThumbs();
        });
        box.appendChild(removeBtn);

        thumbs.appendChild(box);
    });

    sizeInfo.textContent = selectedImages.length
        ? selectedImages.length + ' / ' + MAX_IMAGES +
          ' resim · toplam ' + Math.round(totalBytes / 1024) + ' KB'
        : 'Resimler otomatik küçültülür (her biri en fazla 200 KB).';
}

imageInput.addEventListener(
    'change',
    async function() {

        const files = Array.from(this.files || []);

        /* Aynı dosya tekrar seçilebilsin. */
        this.value = '';

        if (!files.length || imagesProcessing)
            return;

        const room = MAX_IMAGES - selectedImages.length;

        if (room <= 0) {
            alert('En fazla ' + MAX_IMAGES + ' resim eklenebilir.');
            return;
        }

        if (files.length > room) {
            alert(
                'En fazla ' + MAX_IMAGES + ' resim eklenebilir. ' +
                'Seçtiklerinden ilk ' + room + ' tanesi alındı.'
            );
        }

        const session = panelSession;

        let failed = 0;

        imagesProcessing = true;
        sizeInfo.textContent = 'Resimler hazırlanıyor…';

        for (const file of files.slice(0, room)) {

            try {

                const blob = await compressImage(file);

                /* Form bu sırada kapatıldıysa sonucu at. */
                if (session !== panelSession)
                    return;

                selectedImages.push({
                    blob: blob,
                    url: URL.createObjectURL(blob)
                });

            } catch (error) {

                console.error(error);
                failed++;
            }
        }

        if (session !== panelSession)
            return;

        imagesProcessing = false;
        renderThumbs();

        if (failed)
            alert(failed + ' resim okunamadı ve eklenmedi.');
    }
);


/* =================================================
   İNŞAATI KAYDET
   -------------------------------------------------
   Resimler Storage'a yüklenir, bilgiler Firestore'a
   yazılır. İşaret haritaya aşağıdaki "KAYITLI
   İNŞAATLAR" dinleyicisi tarafından eklenir.
================================================= */

const addBtn = document.getElementById('addBtn');

/*
 * Resimler hiç değişmediği için tarayıcı bir kez
 * indirdikten sonra bir yıl boyunca tekrar indirmez.
 */
const IMAGE_METADATA = {
    contentType: 'image/jpeg',
    cacheControl: 'public, max-age=31536000, immutable'
};

let saving = false;

addBtn.addEventListener(
    'click',
    async function() {

        if (!selectedLngLat || saving)
            return;

        if (!currentUser || !currentUsername) {
            alert('Önce giriş yapın.');
            return;
        }

        const name =
            document.getElementById('locationName').value.trim();

        const type = placeTypeSelect.value;

        const startDate =
            document.getElementById('startDate').value || null;

        const endDate =
            document.getElementById('endDate').value || null;

        /*
         * EK BİLGİLER (isteğe bağlı)
         * Sadece doldurulanlar kayda eklenir.
         */
        const extra = {};

        const company =
            document.getElementById('company').value.trim();

        const description =
            document.getElementById('description').value.trim();

        if (company)
            extra.company = company;

        if (buildStatusSelect.value)
            extra.buildStatus = buildStatusSelect.value;

        if (description)
            extra.description = description;

        for (const field of [
            { id: 'floors', label: 'Kat sayısı', max: 999 },
            { id: 'units', label: 'Daire / bölüm sayısı', max: 99999 }
        ]) {

            const raw = document.getElementById(field.id).value.trim();

            if (!raw)
                continue;

            const number = Number(raw);

            if (
                !Number.isInteger(number) ||
                number < 1 ||
                number > field.max
            ) {
                alert(
                    field.label + ' 1 ile ' + field.max +
                    ' arasında bir tam sayı olmalı.'
                );
                return;
            }

            extra[field.id] = number;
        }

        if (!type) {
            alert('Lütfen inşaat türünü seçin.');
            return;
        }

        if (startDate && endDate && endDate < startDate) {
            alert('Bitiş tarihi başlama tarihinden önce olamaz.');
            return;
        }

        if (imagesProcessing) {
            alert('Resimler hazırlanıyor, birkaç saniye sonra tekrar deneyin.');
            return;
        }

        if (!selectedImages.length) {
            alert('Lütfen en az 1 resim ekleyin.');
            return;
        }

        const lngLat = selectedLngLat;
        const images = selectedImages.slice();
        const user = currentUser;

        saving = true;
        addBtn.disabled = true;

        /* Kimlik önce üretilir; resimler de aynı adla kaydedilir. */
        const placeRef = doc(collection(db, 'places'));

        const uploadedPaths = [];
        const savedImages = [];

        try {

            for (let i = 0; i < images.length; i++) {

                addBtn.textContent =
                    'Yükleniyor ' + (i + 1) + '/' + images.length + '…';

                /* Klasör adı kullanıcının UID'si: kurallar sahipliği buradan anlar. */
                const path =
                    'places/' + user.uid + '/' +
                    placeRef.id + '_' + i + '.jpg';

                const imageRef = ref(storage, path);

                uploadedPaths.push(path);

                await uploadBytes(
                    imageRef,
                    images[i].blob,
                    IMAGE_METADATA
                );

                savedImages.push({
                    path: path,
                    url: await getDownloadURL(imageRef)
                });
            }

            addBtn.textContent = 'Kaydediliyor…';

            /* Haritadaki küçük kutu için küçük resim (ilk resimden). */
            const thumbPath =
                'places/' + user.uid + '/' +
                placeRef.id + '_thumb.jpg';

            const thumbRef = ref(storage, thumbPath);

            uploadedPaths.push(thumbPath);

            await uploadBytes(
                thumbRef,
                await makeThumbnail(images[0].blob),
                IMAGE_METADATA
            );

            const thumbURL = await getDownloadURL(thumbRef);

            const record = {
                name: name,
                type: type,
                startDate: startDate,
                endDate: endDate,
                lat: lngLat.lat,
                lng: lngLat.lng,
                images: savedImages,
                thumbPath: thumbPath,
                thumbURL: thumbURL,
                uid: user.uid,
                username: currentUsername,

                /*
                 * Yönetici onayı eklendiğinde yeni kayıtlar
                 * "pending" olarak başlayacak. Şimdilik hepsi onaylı.
                 */
                status: 'approved',

                createdAt: serverTimestamp()
            };

            await setDoc(placeRef, Object.assign(record, extra));

            closePanel();

        } catch (error) {

            console.error(error);

            /* Kayıt yazılamadıysa yüklenen resimleri geri sil. */
            uploadedPaths.forEach(path => {
                deleteObject(ref(storage, path)).catch(() => {});
            });

            alert(firebaseErrorMessage(error));

        } finally {

            saving = false;
            addBtn.disabled = false;
            addBtn.textContent = 'Ekle';
        }
    }
);

document.getElementById('cancelBtn').addEventListener(
    'click',
    closePanel
);

function closePanel() {
    resetPanel();
    layerClosed('panel');
}

/* Formu gizler ve temizler (geri tuşuyla kapanırken de kullanılır). */
function resetPanel() {

    panelSession++;

    panel.style.display = 'none';

    document.getElementById('locationName').value = '';
    document.getElementById('startDate').value = '';
    document.getElementById('endDate').value = '';

    document.getElementById('company').value = '';
    document.getElementById('floors').value = '';
    document.getElementById('units').value = '';
    document.getElementById('description').value = '';
    document.getElementById('extraFields').open = false;

    buildStatusSelect.value = '';
    placeTypeSelect.value = '';
    imageInput.value = '';

    selectedImages.forEach(item => URL.revokeObjectURL(item.url));
    selectedImages = [];

    imagesProcessing = false;
    selectedLngLat = null;

    renderThumbs();
}


/* =================================================
   KAYITLI İNŞAATLAR
   -------------------------------------------------
   Firestore'daki onaylı kayıtlar dinlenir. Sayfa
   açılınca hepsi gelir; ekleme ve silmeler anında
   haritaya yansır.

   İşaret            : sade iğne; yakınlaşınca üstünde
                       ikon ve tür adı görünür
   İşarete tıklama   : küçük kutu açılır, tekrar
                       tıklanınca kapanır
   Kutuya tıklama    : ayrıntı sayfası açılır
================================================= */

/* kayıt kimliği -> { data, marker } */
const places = new Map();

/* Küçük kutu tek tanedir, tıklanan işarete taşınır. */
const placePopup = new maplibregl.Popup({
    offset: 42,
    maxWidth: '260px',
    closeOnClick: false
});

let activePopupId = null;

placePopup.on('close', () => {
    activePopupId = null;
});

/* Haritada boş bir yere tıklanınca küçük kutu kapanır. */
map.on('click', () => {
    placePopup.remove();
});

/*
 * İşaretlerin üstündeki etiket (ikon + tür adı) bu
 * yakınlaştırma seviyesinden itibaren görünür.
 * Sayı küçüldükçe daha uzaktan görünür.
 */
const MARKER_LABEL_MIN_ZOOM = 14;

function updateMarkerLabels() {

    const show = map.getZoom() >= MARKER_LABEL_MIN_ZOOM;

    document.body.classList.toggle('show-place-labels', show);

    /* Küçük kutu, etiket görünüyorsa onun da üstünde açılır. */
    placePopup.setOffset(show ? 68 : 42);
}

map.on('zoom', updateMarkerLabels);

updateMarkerLabels();

function addPlaceMarker(id, data) {

    if (
        typeof data.lat !== 'number' ||
        typeof data.lng !== 'number'
    ) {
        return;
    }

    const type = placeType(data.type);

    const el = document.createElement('div');
    el.className = 'place-marker';

    /* Etiket: solda ikon, sağında tür adı. Yakınlaşınca görünür. */
    const label = document.createElement('div');
    label.className = 'place-label';
    label.textContent = type.icon + ' ' + type.label;
    el.appendChild(label);

    /* Sade iğne */
    const pin = document.createElement('div');
    pin.className = 'place-pin';
    el.appendChild(pin);

    el.addEventListener('click', event => {

        /* Tıklama haritaya geçmesin. */
        event.stopPropagation();

        /* Kutu bu işarette açıksa kapat, değilse aç. */
        if (activePopupId === id)
            placePopup.remove();
        else
            showPlacePopup(id);
    });

    /*
     * İşarete hızlıca iki kez tıklamak (aç-kapat) haritada
     * "çift tıklama ile yakınlaş" sayılmasın: işaretin üzerindeki
     * çift tıklama ve dokunma olayları haritaya iletilmez.
     */
    ['dblclick', 'touchstart', 'touchmove', 'touchend', 'touchcancel']
        .forEach(name => {
            el.addEventListener(name, event => {
                event.stopPropagation();
            });
        });

    const marker = new maplibregl.Marker({
        element: el,
        anchor: 'bottom'
    })
        .setLngLat([data.lng, data.lat])
        .addTo(map);

    places.set(id, { data: data, marker: marker });
}

function removePlaceMarker(id) {

    const place = places.get(id);

    if (!place)
        return;

    place.marker.remove();
    places.delete(id);
}

/* Küçük kutu: küçük resim + ekleyen kişi */
function showPlacePopup(id) {

    const place = places.get(id);

    if (!place)
        return;

    const data = place.data;
    const type = placeType(data.type);
    const images = Array.isArray(data.images) ? data.images : [];

    /* Küçük resim yoksa (eski kayıt) ilk resim kullanılır. */
    const thumbURL =
        data.thumbURL || (images.length ? images[0].url : null);

    const content = document.createElement('div');
    content.className = 'popup-content';

    if (thumbURL) {
        const img = document.createElement('img');
        img.src = thumbURL;
        img.alt = type.label;
        content.appendChild(img);
    }

    /* İnşaat adı burada gösterilmez; sadece tür. */
    const title = document.createElement('div');
    title.className = 'popup-title';
    title.textContent = type.icon + ' ' + type.label;
    content.appendChild(title);

    const userRow = document.createElement('div');
    userRow.className = 'popup-sub';
    userRow.textContent = 'Ekleyen: ' + (data.username || '-');
    content.appendChild(userRow);

    const hint = document.createElement('div');
    hint.className = 'popup-hint';
    hint.textContent = images.length > 1
        ? 'Tüm resimler (' + images.length + ') ve bilgiler için dokun'
        : 'Tüm bilgiler için dokun';
    content.appendChild(hint);

    content.addEventListener('click', () => {
        openDetail(id);
    });

    placePopup
        .setLngLat([data.lng, data.lat])
        .setDOMContent(content)
        .addTo(map);

    activePopupId = id;
}


/* =================================================
   AYRINTI SAYFASI
   -------------------------------------------------
   Haritanın üzerine alttan açılır. Üstte kaydırmalı
   resimler, altta üç sekme: Bilgiler, Yorumlar,
   Yükleyen.
================================================= */

const detailSheet = document.getElementById('detailSheet');
const detailImages = document.getElementById('detailImages');
const detailCounter = document.getElementById('detailCounter');
const detailDeleteBtn = document.getElementById('detailDeleteBtn');
const detailPrevBtn = document.getElementById('detailPrevBtn');
const detailNextBtn = document.getElementById('detailNextBtn');

let detailId = null;

function setDetailTab(name) {

    detailSheet.querySelectorAll('#detailTabs button')
        .forEach(button => {
            button.classList.toggle(
                'active',
                button.dataset.tab === name
            );
        });

    detailSheet.querySelectorAll('.tab-page')
        .forEach(page => {
            page.classList.toggle(
                'active',
                page.dataset.page === name
            );
        });

    document.getElementById('detailBody').scrollTop = 0;
}

detailSheet.querySelectorAll('#detailTabs button')
    .forEach(button => {
        button.addEventListener('click', () => {
            setDetailTab(button.dataset.tab);
        });
    });

/* Resimler kaydırıldıkça "2 / 5" sayacı güncellenir. */
function updateDetailCounter() {

    const total = detailImages.children.length;

    const index = currentImageIndex();

    /* Oklar: tek resimde ve uçlarda gizlenir. */
    detailPrevBtn.style.display = index > 0 ? 'block' : 'none';
    detailNextBtn.style.display = index < total - 1 ? 'block' : 'none';

    if (total < 2) {
        detailCounter.style.display = 'none';
        return;
    }

    detailCounter.style.display = 'block';
    detailCounter.textContent = (index + 1) + ' / ' + total;
}

function currentImageIndex() {

    const total = detailImages.children.length;

    const index = Math.round(
        detailImages.scrollLeft / (detailImages.clientWidth || 1)
    );

    return Math.max(0, Math.min(total - 1, index));
}

/* Bir sonraki (+1) ya da bir önceki (-1) resme geçer. */
function stepImage(direction) {

    detailImages.scrollTo({
        left: (currentImageIndex() + direction) * detailImages.clientWidth,
        behavior: 'smooth'
    });
}

detailPrevBtn.addEventListener('click', () => stepImage(-1));
detailNextBtn.addEventListener('click', () => stepImage(1));

/* Pencere boyutu değişince resim hizası bozulmasın. */
window.addEventListener('resize', () => {

    if (!detailId)
        return;

    detailImages.scrollLeft =
        currentImageIndex() * detailImages.clientWidth;
});

detailImages.addEventListener('scroll', updateDetailCounter);

/* uid -> üyelik tarihi yazısı (tekrar tekrar okunmasın) */
const memberSinceCache = new Map();

async function showUploader(id, data) {

    document.getElementById('detailUser').textContent =
        data.username || '-';

    let count = 0;

    places.forEach(place => {
        if (place.data.uid === data.uid)
            count++;
    });

    document.getElementById('detailUserCount').textContent = count;

    const sinceEl = document.getElementById('detailUserSince');

    if (memberSinceCache.has(data.uid)) {
        sinceEl.textContent = memberSinceCache.get(data.uid);
        return;
    }

    sinceEl.textContent = '…';

    let text = 'Bilinmiyor';

    try {

        const snapshot = await getDoc(doc(db, 'users', data.uid));

        const createdAt =
            snapshot.exists() ? snapshot.data().createdAt : null;

        if (createdAt && typeof createdAt.toDate === 'function') {
            text = createdAt.toDate().toLocaleDateString('tr-TR');
            memberSinceCache.set(data.uid, text);
        }

    } catch (error) {

        console.error(error);
    }

    /* Bu arada başka bir inşaat açıldıysa yazma. */
    if (detailId === id)
        sinceEl.textContent = text;
}

/* Bilgiler sekmesi: sadece doldurulmuş bilgiler gösterilir. */
function renderDetailInfo(data) {

    const box = document.getElementById('detailInfo');

    box.textContent = '';

    function addRow(label, value) {

        if (value === undefined || value === null || value === '')
            return;

        const row = document.createElement('div');
        row.className = 'detail-row';

        const name = document.createElement('span');
        name.textContent = label + ': ';
        row.appendChild(name);

        const text = document.createElement('b');
        text.textContent = value;
        row.appendChild(text);

        box.appendChild(row);
    }

    const buildStatus =
        BUILD_STATUSES.find(status => status.key === data.buildStatus);

    addRow('Durum', buildStatus ? buildStatus.label : null);
    addRow('Yapan firma', data.company);
    addRow('Başlama tarihi', data.startDate ? formatDate(data.startDate) : null);
    addRow('Bitiş tarihi', data.endDate ? formatDate(data.endDate) : null);
    addRow('Kat sayısı', data.floors);
    addRow('Daire / bölüm sayısı', data.units);

    if (data.description) {

        addRow('Açıklama', ' ');

        const text = document.createElement('p');
        text.className = 'detail-text';
        text.textContent = data.description;
        box.appendChild(text);
    }

    if (!box.children.length) {
        const empty = document.createElement('p');
        empty.className = 'tab-empty';
        empty.textContent = 'Ek bilgi girilmemiş.';
        box.appendChild(empty);
    }
}

function openDetail(id) {

    const place = places.get(id);

    if (!place)
        return;

    const data = place.data;
    const type = placeType(data.type);
    const images = Array.isArray(data.images) ? data.images : [];

    placePopup.remove();

    detailId = id;

    /* Başlıkta inşaat adı değil, türü yazar. */
    document.getElementById('detailTitle').textContent =
        type.icon + ' ' + type.label;

    renderDetailInfo(data);

    detailImages.textContent = '';

    images.forEach((image, index) => {
        const img = document.createElement('img');
        img.src = image.url;
        img.alt = type.label;

        /* İlk resim hemen, diğerleri kaydırıldıkça iner. */
        if (index > 0)
            img.loading = 'lazy';

        detailImages.appendChild(img);
    });

    detailImages.scrollLeft = 0;
    updateDetailCounter();

    refreshDeleteButton();

    showUploader(id, data);
    setDetailTab('info');

    detailSheet.classList.add('open');

    /*
     * Geri tuşu bu sayfayı kapatsın; adres çubuğu da
     * bu inşaatın bağlantısını göstersin.
     */
    layerOpened('detail', LINK_PREFIX + encodeURIComponent(id));
}

/* "Sil" sadece inşaatı ekleyen kişiye görünür. */
function refreshDeleteButton() {

    const place = places.get(detailId);

    detailDeleteBtn.style.display =
        (place && currentUser && place.data.uid === currentUser.uid)
            ? 'block'
            : 'none';
}

function closeDetail() {
    hideDetail();
    layerClosed('detail');
}

/* Sadece ekrandan kaldırır (geri tuşuyla kapanırken de kullanılır). */
function hideDetail() {
    detailSheet.classList.remove('open');
    detailId = null;
}

document.getElementById('detailCloseBtn').addEventListener(
    'click',
    closeDetail
);

/* Klavye: Esc kapatır, sağ/sol ok resim değiştirir. */
document.addEventListener('keydown', event => {

    if (!detailId)
        return;

    if (event.key === 'Escape')
        closeDetail();
    else if (event.key === 'ArrowRight')
        stepImage(1);
    else if (event.key === 'ArrowLeft')
        stepImage(-1);
});

detailDeleteBtn.addEventListener(
    'click',
    async function() {

        const place = places.get(detailId);

        if (!place)
            return;

        const id = detailId;
        const data = place.data;

        if (!confirm('Bu inşaat silinsin mi?'))
            return;

        detailDeleteBtn.disabled = true;

        try {

            await deleteDoc(doc(db, 'places', id));

            const paths =
                (Array.isArray(data.images) ? data.images : [])
                    .map(image => image.path);

            if (data.thumbPath)
                paths.push(data.thumbPath);

            paths.forEach(path => {
                deleteObject(ref(storage, path))
                    .catch(error => console.error(error));
            });

            closeDetail();

        } catch (error) {

            console.error(error);
            alert(firebaseErrorMessage(error));

        } finally {

            detailDeleteBtn.disabled = false;
        }
    }
);

onSnapshot(
    query(
        collection(db, 'places'),
        where('status', '==', 'approved')
    ),
    snapshot => {

        snapshot.docChanges().forEach(change => {

            const id = change.doc.id;

            removePlaceMarker(id);

            if (change.type !== 'removed') {
                addPlaceMarker(id, change.doc.data());
                return;
            }

            /* Silinen inşaatın kutusu ya da paneli açıksa kapat. */
            if (activePopupId === id)
                placePopup.remove();

            if (detailId === id)
                closeDetail();
        });

        firstSnapshotDone = true;

        renderHomeList();
        checkLinkedPlace();
    },
    error => {
        console.error(error);
        alert(
            'Kayıtlı inşaatlar yüklenemedi. ' +
            firebaseErrorMessage(error)
        );
    }
);


/* =================================================
   KULLANICI ADI
   -------------------------------------------------
   Küçük harf, rakam ve alt çizgi; 3-20 karakter.
   Aynı ad iki kişiye verilmez: "usernames/<ad>"
   belgesi varsa o ad alınmıştır.
================================================= */

const USERNAME_RE = /^[a-z0-9_]{3,20}$/;

const USERNAME_HELP =
    'Kullanıcı adı 3-20 karakter olmalı; sadece ' +
    'küçük harf (a-z), rakam ve alt çizgi (_) kullanılabilir.';

function normalizeUsername(value) {
    return (value || '').trim().toLowerCase();
}

async function isUsernameTaken(username) {
    const snapshot = await getDoc(doc(db, 'usernames', username));
    return snapshot.exists();
}

/* Kullanıcı adını hesaba bağlar (iki belge birlikte yazılır). */
async function claimUsername(user, username) {

    const batch = writeBatch(db);

    batch.set(doc(db, 'users', user.uid), {
        username: username,
        createdAt: serverTimestamp()
    });

    batch.set(doc(db, 'usernames', username), {
        uid: user.uid
    });

    await batch.commit();
}

async function loadUsername(user) {

    try {

        const snapshot = await getDoc(doc(db, 'users', user.uid));

        return snapshot.exists()
            ? snapshot.data().username || null
            : null;

    } catch (error) {

        console.error(error);
        return null;
    }
}

/* Kullanıcı adı olmayan hesaplara ad sorar. Alındıysa true döner. */
async function askUsername() {

    const username = normalizeUsername(
        prompt('İnşaat eklemek için bir kullanıcı adı seç.\n' + USERNAME_HELP)
    );

    if (!username)
        return false;

    if (!USERNAME_RE.test(username)) {
        alert(USERNAME_HELP);
        return false;
    }

    try {

        if (await isUsernameTaken(username)) {
            alert('Bu kullanıcı adı alınmış.');
            return false;
        }

        await claimUsername(currentUser, username);

        currentUsername = username;
        updateAccountButton();

        return true;

    } catch (error) {

        console.error(error);
        alert(firebaseErrorMessage(error));
        return false;
    }
}

const loginPanel = document.getElementById('loginPanel');
const loginBtn = document.getElementById('loginBtn');
const loginSwitch = document.getElementById('loginSwitch');
const loginUsername = document.getElementById('loginUsername');

/* false: giriş yap, true: yeni hesap oluştur */
let signupMode = false;

/* Girişten sonra kullanıcı adı okunurken bekleyen işlem */
let usernameLoading = Promise.resolve();

function setLoginMode(signup) {

    signupMode = signup;

    document.getElementById('loginTitle').textContent =
        signup ? 'Hesap oluştur' : 'Giriş yap';

    loginBtn.textContent = signup ? 'Kayıt ol' : 'Giriş';

    loginSwitch.textContent = signup
        ? 'Hesabın var mı? Giriş yap'
        : 'Hesabın yok mu? Kayıt ol';

    loginUsername.style.display = signup ? 'block' : 'none';

    document.getElementById('loginPassword').autocomplete =
        signup ? 'new-password' : 'current-password';
}

loginSwitch.addEventListener('click', () => {
    setLoginMode(!signupMode);
});

function openLoginPanel() {
    loginPanel.style.display = 'block';
    document.getElementById('loginEmail').focus();

    layerOpened('login');
}

function closeLoginPanel() {
    hideLoginPanel();
    layerClosed('login');
}

/* Sadece ekrandan kaldırır (geri tuşuyla kapanırken de kullanılır). */
function hideLoginPanel() {
    loginPanel.style.display = 'none';
    document.getElementById('loginPassword').value = '';
    loginUsername.value = '';
    setLoginMode(false);
}

function updateAccountButton() {

    /* Menüdeki hesap satırı */
    document.getElementById('menuAccount').textContent = currentUser
        ? 'Çıkış yap (' + (currentUsername || currentUser.email) + ')'
        : 'Giriş yap / Kayıt ol';

    /* "Yüklemelerim" sadece giriş yapılmışken görünür. */
    document.getElementById('menuMine').style.display =
        currentUser ? 'block' : 'none';

    /* "Yüklemelerim" listesi hesaba göre değişir. */
    renderHomeList();
}

onAuthStateChanged(auth, user => {

    if (!user || !currentUser || currentUser.uid !== user.uid)
        currentUsername = null;

    currentUser = user;

    updateAccountButton();

    /* Açık ayrıntı sayfasındaki "Sil" düğmesi yeni hesaba göre güncellensin. */
    refreshDeleteButton();

    if (!user)
        return;

    usernameLoading = loadUsername(user).then(username => {

        if (
            username &&
            currentUser &&
            currentUser.uid === user.uid
        ) {
            currentUsername = username;
            updateAccountButton();
        }
    });
});

/* Giriş yapılmamışsa giriş ekranını açar, yapılmışsa çıkış sorar. */
function accountAction() {

    if (!currentUser) {
        pendingLngLat = null;
        openLoginPanel();
        return;
    }

    const who = currentUsername || currentUser.email;

    if (confirm(who + ' hesabından çıkış yapılsın mı?')) {
        closePanel();
        signOut(auth).catch(error => alert(firebaseErrorMessage(error)));
    }
}



async function login() {

    const email =
        document.getElementById('loginEmail').value.trim();

    const password =
        document.getElementById('loginPassword').value;

    const username = normalizeUsername(loginUsername.value);

    if (!email || !password) {
        alert('E-posta ve şifre girin.');
        return;
    }

    if (signupMode && !USERNAME_RE.test(username)) {
        alert(USERNAME_HELP);
        return;
    }

    if (signupMode && password.length < 6) {
        alert('Şifre en az 6 karakter olmalı.');
        return;
    }

    loginBtn.disabled = true;

    try {

        if (signupMode) {

            if (await isUsernameTaken(username)) {
                alert('Bu kullanıcı adı alınmış.');
                return;
            }

            const result =
                await createUserWithEmailAndPassword(auth, email, password);

            try {

                await claimUsername(result.user, username);

            } catch (error) {

                /* Ad alınamadıysa yarım kalan hesabı geri al. */
                await result.user.delete().catch(() => {});

                throw new Error(
                    'Kullanıcı adı alınamadı. Başka bir ad deneyin.'
                );
            }

            currentUser = result.user;
            currentUsername = username;
            updateAccountButton();

        } else {

            const result =
                await signInWithEmailAndPassword(auth, email, password);

            currentUser = result.user;
        }

        closeLoginPanel();

        /* Giriş, uzun basma sonrası istendiyse kaldığı yerden devam. */
        if (pendingLngLat) {
            const lngLat = pendingLngLat;
            pendingLngLat = null;
            openAddPanel(lngLat);
        }

    } catch (error) {

        console.error(error);
        alert(firebaseErrorMessage(error));

    } finally {

        loginBtn.disabled = false;
    }
}

loginBtn.addEventListener('click', login);

document.getElementById('loginPassword').addEventListener(
    'keydown',
    e => {
        if (e.key === 'Enter')
            login();
    }
);

document.getElementById('loginCancelBtn').addEventListener(
    'click',
    () => {
        pendingLngLat = null;
        closeLoginPanel();
    }
);

/* =================================================
   GERİ TUŞU
   -------------------------------------------------
   Telefondaki geri tuşu (ya da kenardan kaydırma)
   uygulamadan çıkmak yerine açık olan şeyi kapatır:
   ayrıntı sayfası, ekleme formu ya da giriş ekranı.

   Nasıl: bunlardan biri açılınca tarayıcı geçmişine
   bir kayıt eklenir. Geri tuşu o kaydı geri alır,
   biz de açık olanı kapatırız. Kapat düğmesiyle
   kapatılınca kayıt kendimiz geri alınır.
================================================= */

/* Açık katmanlar, açılış sırasıyla: 'detail', 'panel', 'login' */
const openLayers = [];

/* Kendi yaptığımız, henüz tamamlanmamış geri alma işlemleri */
let ignoredPops = 0;

/*
 * Geri alma işlemi sürerken açılan katmanlar burada bekler.
 * (Tarayıcı geri almayı gecikmeli yapar; o bitmeden geçmişe
 * kayıt eklenirse yanlış kayıt geri alınır.)
 */
let waitingLayers = [];

const LAYER_HIDERS = {
    detail: hideDetail,
    panel: resetPanel,
    login: hideLoginPanel
};

/* Bir katman açıldığında çağrılır. */
function layerOpened(name, url) {

    /* Geri alma sürüyorsa sıraya al. */
    if (ignoredPops > 0) {

        waitingLayers = waitingLayers.filter(item => item.name !== name);
        waitingLayers.push({ name: name, url: url });

        return;
    }

    try {

        /* Zaten açıksa sadece adres güncellenir. */
        if (openLayers.includes(name)) {

            if (url) {
                history.replaceState(
                    { depth: openLayers.length },
                    '',
                    url
                );
            }

            return;
        }

        openLayers.push(name);

        history.pushState(
            { depth: openLayers.length },
            '',
            url || location.href
        );

    } catch (error) {}
}

/* Bir katman düğmeyle (geri tuşu dışında) kapatıldığında çağrılır. */
function layerClosed(name) {

    /* Henüz geçmişe eklenmemişse sıradan çıkarmak yeterli. */
    if (waitingLayers.some(item => item.name === name)) {
        waitingLayers = waitingLayers.filter(item => item.name !== name);
        return;
    }

    const index = openLayers.indexOf(name);

    if (index < 0)
        return;

    openLayers.splice(index, 1);

    ignoredPops++;
    history.back();
}

window.addEventListener('popstate', event => {

    /* Kendi geri alma işlemimiz tamamlandı. */
    if (ignoredPops > 0) {

        ignoredPops--;

        if (ignoredPops === 0) {

            const waiting = waitingLayers;
            waitingLayers = [];

            waiting.forEach(item => layerOpened(item.name, item.url));
        }

        return;
    }

    const depth = (event.state && event.state.depth) || 0;

    /* İleri tuşu: kapanmış bir şeyi geri açmayız, geri döneriz. */
    if (depth > openLayers.length) {
        ignoredPops++;
        history.go(openLayers.length - depth);
        return;
    }

    /* Geri tuşu: en son açılandan başlayarak kapat. */
    while (openLayers.length > depth)
        LAYER_HIDERS[openLayers.pop()]();
});

/* Sayfa yenilendiyse eski geçmiş kaydı sıfırlanır. */
try {
    history.replaceState(null, '', location.href);
} catch (error) {}


/* =================================================
   PAYLAŞIM BAĞLANTISI
   -------------------------------------------------
   Her inşaatın kendi adresi vardır:
       .../sayfa.html#insaat=<kimlik>
   Ayrıntı sayfası açıkken adres çubuğu da bu adresi
   gösterir (bkz. GERİ TUŞU). Bağlantıyla gelen kişide harita o
   inşaata gider ve ayrıntı sayfası açılır.
================================================= */

const LINK_PREFIX = '#insaat=';

function linkedIdFromHash() {

    const hash = location.hash || '';

    return hash.indexOf(LINK_PREFIX) === 0
        ? decodeURIComponent(hash.slice(LINK_PREFIX.length))
        : null;
}

function placeLink(id) {
    return location.href.split('#')[0] +
        LINK_PREFIX + encodeURIComponent(id);
}

/* Adres çubuğunu günceller (sayfa yenilenmez). */
function setHash(id) {

    try {
        history.replaceState(
            null,
            '',
            id
                ? LINK_PREFIX + encodeURIComponent(id)
                : location.pathname + location.search
        );
    } catch (error) {}
}

/* Sayfa bir bağlantıyla açıldıysa beklenen inşaat */
let linkedPlaceId = linkedIdFromHash();

let firstSnapshotDone = false;

function openLinkedPlace(id) {

    const place = places.get(id);

    if (!place)
        return false;

    showTab('map');

    map.jumpTo({
        center: [place.data.lng, place.data.lat],
        zoom: Math.max(map.getZoom(), 15)
    });

    /*
     * Adresteki bağlantı temizlenir; ayrıntı sayfası kendi
     * geçmiş kaydını ekler. Böylece geri tuşu sayfayı kapatır
     * ama uygulamadan çıkmaz.
     */
    setHash(null);

    openDetail(id);

    return true;
}

/* Kayıtlar her geldiğinde çağrılır. */
function checkLinkedPlace() {

    if (!linkedPlaceId)
        return;

    if (openLinkedPlace(linkedPlaceId)) {
        linkedPlaceId = null;
        return;
    }

    if (firstSnapshotDone) {
        linkedPlaceId = null;
        setHash(null);
        alert('Bu bağlantıdaki inşaat bulunamadı. Silinmiş olabilir.');
    }
}

window.addEventListener('hashchange', () => {

    /* Kendi geri alma işlemlerimiz sırasında bir şey yapma. */
    if (ignoredPops > 0)
        return;

    const id = linkedIdFromHash();

    if (id && id !== detailId && !openLinkedPlace(id))
        alert('Bu bağlantıdaki inşaat bulunamadı. Silinmiş olabilir.');
});

const detailShareBtn = document.getElementById('detailShareBtn');

detailShareBtn.addEventListener(
    'click',
    async function() {

        const place = places.get(detailId);

        if (!place)
            return;

        const url = placeLink(detailId);

        /* Telefonda paylaşım menüsü (WhatsApp vb.) açılır. */
        if (navigator.share) {

            try {
                await navigator.share({
                    title: placeType(place.data.type).label + ' inşaatı',
                    url: url
                });
            } catch (error) {}

            return;
        }

        try {

            await navigator.clipboard.writeText(url);

            detailShareBtn.textContent = '✓ Bağlantı kopyalandı';

            setTimeout(() => {
                detailShareBtn.textContent = '🔗 Paylaş';
            }, 2000);

        } catch (error) {

            prompt('Bağlantıyı kopyala:', url);
        }
    }
);


/* =================================================
   SEKMELER VE ANA SAYFA
   -------------------------------------------------
   Alt menüde iki sekme vardır: Ana Sayfa ve Harita.
   Ana sayfa haritanın üzerinde durur, Harita
   sekmesine geçilince gizlenir.
================================================= */

const altMenu = document.getElementById('altMenu');
const acKapa = document.getElementById('acKapa');
const menuItems = document.querySelectorAll('.alt-menu .oge');

/* Alt menüdeki öğe adı -> sekme adı */
const MENU_TABS = {
    anasayfa: 'home',
    harita: 'map'
};
const homeMenu = document.getElementById('homeMenu');
const homeList = document.getElementById('homeList');

/* Ana sayfada gösterilecek en fazla inşaat sayısı */
const HOME_LIST_LIMIT = 50;

function showTab(name) {

    document.body.dataset.tab = name;

    menuItems.forEach(item => {
        item.classList.toggle(
            'aktif',
            MENU_TABS[item.dataset.sayfa] === name
        );
    });

    homeMenu.classList.remove('open');

    if (name === 'home')
        placePopup.remove();
    else
        startAttributionTimer();
}

menuItems.forEach(item => {
    item.addEventListener('click', event => {
        event.preventDefault();

        const tab = MENU_TABS[item.dataset.sayfa];

        clearTimeout(menuCloseTimer);
        showTab(tab);

        /* Harita seçildiyse menü biraz sonra kapanır. */
        if (tab === 'map') {
            menuCloseTimer = setTimeout(() => {
                setMenuClosed(true);
            }, MENU_AUTO_CLOSE_MS);
        }
    });
});

/* Alt menüyü kapatır (true) ya da açar (false). */
function setMenuClosed(closed) {
    altMenu.classList.toggle('kapali', closed);
    acKapa.setAttribute('aria-expanded', String(!closed));
}

/* Mavi düğme: alt menüyü aç / kapat */
acKapa.addEventListener('click', () => {
    clearTimeout(menuCloseTimer);
    setMenuClosed(!altMenu.classList.contains('kapali'));
});

/*
 * Alt menüdeki "Harita" düğmesine basıldıktan bu kadar
 * süre sonra alt menü kendiliğinden kapanır (milisaniye).
 * Mavi düğmeyle tekrar açılır.
 */
const MENU_AUTO_CLOSE_MS = 1000;

let menuCloseTimer = null;

/* MENÜ */

document.getElementById('menuBtn').addEventListener(
    'click',
    event => {
        event.stopPropagation();

        /* Menü, düğmenin hemen altında açılır (düğme sayfayla birlikte kayar). */
        const buttonBox = event.currentTarget.getBoundingClientRect();

        const pageBox =
            document.getElementById('homePage').getBoundingClientRect();

        homeMenu.style.top =
            (buttonBox.bottom - pageBox.top + 2) + 'px';

        homeMenu.classList.toggle('open');
    }
);

/* Menü dışında bir yere tıklanınca menü kapanır. */
document.addEventListener('click', event => {
    if (!homeMenu.contains(event.target))
        homeMenu.classList.remove('open');
});

/* Sayfa kaydırılınca menü kapanır. */
document.getElementById('homeMain').addEventListener('scroll', () => {
    homeMenu.classList.remove('open');
});

document.getElementById('menuAccount').addEventListener(
    'click',
    () => {
        homeMenu.classList.remove('open');
        accountAction();
    }
);

document.getElementById('menuLatest').addEventListener(
    'click',
    () => {
        homeMenu.classList.remove('open');
        setHomeMode('latest');
    }
);

document.getElementById('menuMine').addEventListener(
    'click',
    () => {
        homeMenu.classList.remove('open');
        setHomeMode('mine');
    }
);

document.getElementById('menuMap').addEventListener(
    'click',
    () => {
        showTab('map');
    }
);

/*
 * ANA SAYFA LİSTESİ
 *   latest : son eklenenler (herkesin). İnşaat adı gösterilmez.
 *   mine   : giriş yapan kişinin kendi yükledikleri. İnşaat adı
 *            sadece burada görünür.
 */
let homeMode = 'latest';

function setHomeMode(mode) {
    homeMode = mode;
    renderHomeList();
    document.getElementById('homeMain').scrollTop = 0;
}

function createdMillis(data) {

    const createdAt = data.createdAt;

    /* Yeni eklenen kayıtta sunucu saati henüz gelmemiş olabilir. */
    return (createdAt && typeof createdAt.toMillis === 'function')
        ? createdAt.toMillis()
        : Date.now();
}

function renderHomeList() {

    /* Çıkış yapıldıysa "Yüklemelerim" gösterilemez. */
    if (homeMode === 'mine' && !currentUser)
        homeMode = 'latest';

    const mine = homeMode === 'mine';

    document.getElementById('homeTitle').textContent =
        mine ? 'Yüklemelerim' : 'Son eklenenler';

    let items = [];

    places.forEach((place, id) => {
        if (!mine || place.data.uid === currentUser.uid)
            items.push({ id: id, data: place.data });
    });

    items.sort((a, b) => createdMillis(b.data) - createdMillis(a.data));

    if (!mine)
        items = items.slice(0, HOME_LIST_LIMIT);

    homeList.textContent = '';

    if (!items.length) {

        /*
         * Kayıtlar henüz gelmediyse hiçbir şey yazma; yoksa
         * açılışta kısa bir an "Henüz inşaat eklenmemiş" görünür.
         */
        if (!firstSnapshotDone)
            return;

        const empty = document.createElement('p');
        empty.className = 'home-empty';
        empty.textContent = mine
            ? 'Henüz inşaat eklemedin. Harita sekmesinde bir noktaya ' +
              'basılı tutarak ekleyebilirsin.'
            : 'Henüz inşaat eklenmemiş. Harita sekmesinde bir noktaya ' +
              'basılı tutarak ilk inşaatı ekleyebilirsin.';
        homeList.appendChild(empty);

        return;
    }

    items.forEach(item => {

        const data = item.data;
        const type = placeType(data.type);
        const images = Array.isArray(data.images) ? data.images : [];
        const typeText = type.icon + ' ' + type.label;

        const thumbURL =
            data.thumbURL || (images.length ? images[0].url : null);

        const card = document.createElement('button');
        card.className = 'home-card';

        if (thumbURL) {
            const img = document.createElement('img');
            img.src = thumbURL;
            img.alt = '';
            img.loading = 'lazy';
            card.appendChild(img);
        }

        const text = document.createElement('div');
        text.className = 'home-card-text';

        const title = document.createElement('div');
        title.className = 'home-card-title';

        const sub = document.createElement('div');
        sub.className = 'home-card-sub';

        if (mine) {

            /* Kendi listesinde: ad (varsa) + tür */
            title.textContent = data.name || typeText;

            const createdAt = data.createdAt;

            const date =
                (createdAt && typeof createdAt.toDate === 'function')
                    ? createdAt.toDate().toLocaleDateString('tr-TR')
                    : '';

            sub.textContent =
                [data.name ? typeText : '', date]
                    .filter(Boolean)
                    .join(' · ');

        } else {

            /* Herkese açık listede ad gösterilmez. */
            title.textContent = typeText;
            sub.textContent = 'Ekleyen: ' + (data.username || '-');
        }

        text.appendChild(title);
        text.appendChild(sub);
        card.appendChild(text);

        card.addEventListener('click', () => {
            openDetail(item.id);
        });

        homeList.appendChild(card);
    });
}

/* Bağlantıyla gelindiyse doğrudan harita, yoksa ana sayfa açılır. */
showTab(linkedPlaceId ? 'map' : 'home');

updateAccountButton();
renderThumbs();

</script>
