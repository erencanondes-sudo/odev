   -------------------------------------------------
   Her resim yüklenmeden önce tarayıcıda küçültülür:
   uzun kenar en fazla 1280 piksel, dosya en fazla
   200 KB. Sığmazsa önce kalite, sonra boyut düşürülür.
================================================= */

const MAX_IMAGES = 5;
const MAX_IMAGE_BYTES = 200 * 1024;
const MAX_IMAGE_SIDE = 1280;

function loadImage(file) {

    return new Promise((resolve, reject) => {

        const url = URL.createObjectURL(file);
        const img = new Image();

        img.onload = () => {
            URL.revokeObjectURL(url);
            resolve(img);
        };

        img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error('Resim okunamadı.'));
        };

        img.src = url;
    });
}

function canvasToJpeg(canvas, quality) {
    return new Promise(resolve => {
        canvas.toBlob(resolve, 'image/jpeg', quality);
    });
}

async function compressImage(file) {

    const img = await loadImage(file);

    let scale = Math.min(
        1,
        MAX_IMAGE_SIDE / Math.max(img.width, img.height)
    );

    for (;;) {

        const width = Math.max(1, Math.round(img.width * scale));
        const height = Math.max(1, Math.round(img.height * scale));

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext('2d');

        /* Saydam resimlerde arka plan siyah çıkmasın. */
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);

        for (const quality of [0.8, 0.7, 0.6, 0.5]) {

            const blob = await canvasToJpeg(canvas, quality);

            if (!blob)
                throw new Error('Resim hazırlanamadı.');

            if (blob.size <= MAX_IMAGE_BYTES)
                return blob;
        }

        if (Math.max(width, height) <= 480)
            throw new Error('Resim 200 KB altına indirilemedi.');

        scale *= 0.8;
    }
}


/*
 * Haritadaki küçük kutuda gösterilen küçük resim.
 * Kutunun boyutuna (220 x 140) göre ortadan kırpılır,
 * keskin ekranlar için iki katı çözünürlükte kaydedilir.
 * Birkaç on KB tuttuğu için hemen iner.
 */
const THUMB_WIDTH = 440;
const THUMB_HEIGHT = 280;

async function makeThumbnail(blob) {

    const img = await loadImage(blob);

    const scale = Math.max(
        THUMB_WIDTH / img.width,
        THUMB_HEIGHT / img.height
    );

    const width = img.width * scale;
    const height = img.height * scale;

    const canvas = document.createElement('canvas');
    canvas.width = THUMB_WIDTH;
    canvas.height = THUMB_HEIGHT;

    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, THUMB_WIDTH, THUMB_HEIGHT);

    ctx.drawImage(
        img,
        (THUMB_WIDTH - width) / 2,
        (THUMB_HEIGHT - height) / 2,
        width,
        height
    );

    const thumb = await canvasToJpeg(canvas, 0.7);

    if (!thumb)
        throw new Error('Küçük resim hazırlanamadı.');

    return thumb;
}


/* =================================================
   İNŞAAT EKLEME FORMU
================================================= */

const panel = document.getElementById('panel');
const imageInput = document.getElementById('imageInput');
const thumbs = document.getElementById('thumbs');
const sizeInfo = document.getElementById('sizeInfo');

let selectedLngLat = null;

/* Giriş yapılmadan uzun basıldıysa, girişten sonra açılacak nokta */
let pendingLngLat = null;

/* Seçilip küçültülmüş resimler: { blob, url } */
let selectedImages = [];

/* Resimler küçültülürken true olur */
let imagesProcessing = false;

/* Form her kapandığında artar; yarım kalan küçültmeler atılır. */
let panelSession = 0;

async function openAddPanel(lngLat) {

    /* İnşaat eklemek için giriş gerekir. */
    if (!currentUser) {
        pendingLngLat = lngLat;
        openLoginPanel();
        return;
    }

    await usernameLoading;

    /* Kullanıcı adı olmayan eski hesaplar için. */
    if (!currentUsername && !(await askUsername()))
        return;

    selectedLngLat = lngLat;
    renderThumbs();
    panel.style.display = 'block';

    layerOpened('panel');
}

function renderThumbs() {

    thumbs.textContent = '';

    let totalBytes = 0;

    selectedImages.forEach(item => {

        totalBytes += item.blob.size;

        const box = document.createElement('div');
        box.className = 'thumb';

        const img = document.createElement('img');
        img.src = item.url;
        img.alt = '';
        box.appendChild(img);

        const removeBtn = document.createElement('button');
        removeBtn.textContent = '×';
        removeBtn.setAttribute('aria-label', 'Resmi kaldır');
        removeBtn.addEventListener('click', () => {
            URL.revokeObjectURL(item.url);
            selectedImages =
                selectedImages.filter(other => other !== item);
            renderThumbs();
        });
        box.appendChild(removeBtn);

        thumbs.appendChild(box);
    });

    sizeInfo.textContent = selectedImages.length
        ? selectedImages.length + ' / ' + MAX_IMAGES +
          ' resim · toplam ' + Math.round(totalBytes / 1024) + ' KB'
        : 'Resimler otomatik küçültülür (her biri en fazla 200 KB).';
}

imageInput.addEventListener(
    'change',
    async function() {

        const files = Array.from(this.files || []);

        /* Aynı dosya tekrar seçilebilsin. */
        this.value = '';

        if (!files.length || imagesProcessing)
            return;

        const room = MAX_IMAGES - selectedImages.length;

        if (room <= 0) {
            alert('En fazla ' + MAX_IMAGES + ' resim eklenebilir.');
            return;
        }

        if (files.length > room) {
            alert(
                'En fazla ' + MAX_IMAGES + ' resim eklenebilir. ' +
                'Seçtiklerinden ilk ' + room + ' tanesi alındı.'
            );
        }

        const session = panelSession;

        let failed = 0;

        imagesProcessing = true;
        sizeInfo.textContent = 'Resimler hazırlanıyor…';

        for (const file of files.slice(0, room)) {

            try {

                const blob = await compressImage(file);

                /* Form bu sırada kapatıldıysa sonucu at. */
                if (session !== panelSession)
                    return;

                selectedImages.push({
                    blob: blob,
                    url: URL.createObjectURL(blob)
                });

            } catch (error) {

                console.error(error);
                failed++;
            }
        }

        if (session !== panelSession)
            return;

        imagesProcessing = false;
        renderThumbs();

        if (failed)
            alert(failed + ' resim okunamadı ve eklenmedi.');
    }
);


/* =================================================
   İNŞAATI KAYDET
   -------------------------------------------------
   Resimler Storage'a yüklenir, bilgiler Firestore'a
   yazılır. İşaret haritaya aşağıdaki "KAYITLI
   İNŞAATLAR" dinleyicisi tarafından eklenir.
================================================= */

const addBtn = document.getElementById('addBtn');

/*
 * Resimler hiç değişmediği için tarayıcı bir kez
 * indirdikten sonra bir yıl boyunca tekrar indirmez.
 */
const IMAGE_METADATA = {
    contentType: 'image/jpeg',
    cacheControl: 'public, max-age=31536000, immutable'
};

let saving = false;

addBtn.addEventListener(
    'click',
    async function() {

        if (!selectedLngLat || saving)
            return;

        if (!currentUser || !currentUsername) {
            alert('Önce giriş yapın.');
            return;
        }

        const name =
            document.getElementById('locationName').value.trim();

        const type = placeTypeSelect.value;

        const startDate =
            document.getElementById('startDate').value || null;

        const endDate =
            document.getElementById('endDate').value || null;

        /*
         * EK BİLGİLER (isteğe bağlı)
         * Sadece doldurulanlar kayda eklenir.
         */
        const extra = {};

        const company =
            document.getElementById('company').value.trim();

        const description =
            document.getElementById('description').value.trim();

        if (company)
            extra.company = company;

        if (buildStatusSelect.value)
            extra.buildStatus = buildStatusSelect.value;

        if (description)
            extra.description = description;

        for (const field of [
            { id: 'floors', label: 'Kat sayısı', max: 999 },
            { id: 'units', label: 'Daire / bölüm sayısı', max: 99999 }
        ]) {

            const raw = document.getElementById(field.id).value.trim();

            if (!raw)
                continue;

            const number = Number(raw);

            if (
                !Number.isInteger(number) ||
                number < 1 ||
                number > field.max
            ) {
                alert(
                    field.label + ' 1 ile ' + field.max +
                    ' arasında bir tam sayı olmalı.'
                );
                return;
            }

            extra[field.id] = number;
        }

        if (!type) {
            alert('Lütfen inşaat türünü seçin.');
            return;
        }

        if (startDate && endDate && endDate < startDate) {
            alert('Bitiş tarihi başlama tarihinden önce olamaz.');
            return;
        }

        if (imagesProcessing) {
            alert('Resimler hazırlanıyor, birkaç saniye sonra tekrar deneyin.');
            return;
        }

        if (!selectedImages.length) {
            alert('Lütfen en az 1 resim ekleyin.');
            return;
        }

        const lngLat = selectedLngLat;
        const images = selectedImages.slice();
        const user = currentUser;

        saving = true;
        addBtn.disabled = true;

        /* Kimlik önce üretilir; resimler de aynı adla kaydedilir. */
        const placeRef = doc(collection(db, 'places'));

        const uploadedPaths = [];
        const savedImages = [];

        try {

            for (let i = 0; i < images.length; i++) {

                addBtn.textContent =
                    'Yükleniyor ' + (i + 1) + '/' + images.length + '…';

                /* Klasör adı kullanıcının UID'si: kurallar sahipliği buradan anlar. */
                const path =
                    'places/' + user.uid + '/' +
                    placeRef.id + '_' + i + '.jpg';

                const imageRef = ref(storage, path);

                uploadedPaths.push(path);

                await uploadBytes(
                    imageRef,
                    images[i].blob,
                    IMAGE_METADATA
                );

                savedImages.push({
                    path: path,
                    url: await getDownloadURL(imageRef)
                });
            }

            addBtn.textContent = 'Kaydediliyor…';

            /* Haritadaki küçük kutu için küçük resim (ilk resimden). */
            const thumbPath =
                'places/' + user.uid + '/' +
                placeRef.id + '_thumb.jpg';

            const thumbRef = ref(storage, thumbPath);

            uploadedPaths.push(thumbPath);

            await uploadBytes(
                thumbRef,
                await makeThumbnail(images[0].blob),
                IMAGE_METADATA
            );

            const thumbURL = await getDownloadURL(thumbRef);

            const record = {
                name: name,
                type: type,
                startDate: startDate,
                endDate: endDate,
                lat: lngLat.lat,
                lng: lngLat.lng,
                images: savedImages,
                thumbPath: thumbPath,
                thumbURL: thumbURL,
                uid: user.uid,
                username: currentUsername,

                /*
                 * Yönetici onayı eklendiğinde yeni kayıtlar
                 * "pending" olarak başlayacak. Şimdilik hepsi onaylı.
                 */
                status: 'approved',

                createdAt: serverTimestamp()
            };

            await setDoc(placeRef, Object.assign(record, extra));

            closePanel();

        } catch (error) {

            console.error(error);

            /* Kayıt yazılamadıysa yüklenen resimleri geri sil. */
            uploadedPaths.forEach(path => {
                deleteObject(ref(storage, path)).catch(() => {});
            });

            alert(firebaseErrorMessage(error));

        } finally {

            saving = false;
            addBtn.disabled = false;
            addBtn.textContent = 'Ekle';
        }
    }
);

document.getElementById('cancelBtn').addEventListener(
    'click',
    closePanel
);

function closePanel() {
    resetPanel();
    layerClosed('panel');
}

/* Formu gizler ve temizler (geri tuşuyla kapanırken de kullanılır). */
function resetPanel() {

    panelSession++;

    panel.style.display = 'none';

    document.getElementById('locationName').value = '';
    document.getElementById('startDate').value = '';
    document.getElementById('endDate').value = '';

    document.getElementById('company').value = '';
    document.getElementById('floors').value = '';
    document.getElementById('units').value = '';
    document.getElementById('description').value = '';
    document.getElementById('extraFields').open = false;

    buildStatusSelect.value = '';
    placeTypeSelect.value = '';
    imageInput.value = '';

    selectedImages.forEach(item => URL.revokeObjectURL(item.url));
    selectedImages = [];

    imagesProcessing = false;
    selectedLngLat = null;

    renderThumbs();
}


/* =================================================
   KAYITLI İNŞAATLAR
   -------------------------------------------------
   Firestore'daki onaylı kayıtlar dinlenir. Sayfa
   açılınca hepsi gelir; ekleme ve silmeler anında
   haritaya yansır.

   İşaret            : sade iğne; yakınlaşınca üstünde
                       ikon ve tür adı görünür
   İşarete tıklama   : küçük kutu açılır, tekrar
                       tıklanınca kapanır
   Kutuya tıklama    : ayrıntı sayfası açılır
================================================= */

/* kayıt kimliği -> { data, marker } */
const places = new Map();

/* Küçük kutu tek tanedir, tıklanan işarete taşınır. */
const placePopup = new maplibregl.Popup({
    offset: 42,
    maxWidth: '260px',
    closeOnClick: false
});

let activePopupId = null;

placePopup.on('close', () => {
    activePopupId = null;
});

/* Haritada boş bir yere tıklanınca küçük kutu kapanır. */
map.on('click', () => {
    placePopup.remove();
});

/*
 * İşaretlerin üstündeki etiket (ikon + tür adı) bu
 * yakınlaştırma seviyesinden itibaren görünür.
 * Sayı küçüldükçe daha uzaktan görünür.
 */
const MARKER_LABEL_MIN_ZOOM = 14;

function updateMarkerLabels() {

    const show = map.getZoom() >= MARKER_LABEL_MIN_ZOOM;

    document.body.classList.toggle('show-place-labels', show);

    /* Küçük kutu, etiket görünüyorsa onun da üstünde açılır. */
    placePopup.setOffset(show ? 68 : 42);
}

map.on('zoom', updateMarkerLabels);

updateMarkerLabels();

function addPlaceMarker(id, data) {

    if (
        typeof data.lat !== 'number' ||
        typeof data.lng !== 'number'
    ) {
        return;
    }

    const type = placeType(data.type);

    const el = document.createElement('div');
    el.className = 'place-marker';

    /* Etiket: solda ikon, sağında tür adı. Yakınlaşınca görünür. */
    const label = document.createElement('div');
    label.className = 'place-label';
    label.textContent = type.icon + ' ' + type.label;
    el.appendChild(label);

    /* Sade iğne */
    const pin = document.createElement('div');
    pin.className = 'place-pin';
    el.appendChild(pin);

    el.addEventListener('click', event => {

        /* Tıklama haritaya geçmesin. */
        event.stopPropagation();

        /* Kutu bu işarette açıksa kapat, değilse aç. */
        if (activePopupId === id)
            placePopup.remove();
        else
            showPlacePopup(id);
    });

    /*
     * İşarete hızlıca iki kez tıklamak (aç-kapat) haritada
     * "çift tıklama ile yakınlaş" sayılmasın: işaretin üzerindeki
     * çift tıklama ve dokunma olayları haritaya iletilmez.
     */
    ['dblclick', 'touchstart', 'touchmove', 'touchend', 'touchcancel']
        .forEach(name => {
            el.addEventListener(name, event => {
                event.stopPropagation();
            });
        });

    const marker = new maplibregl.Marker({
        element: el,
        anchor: 'bottom'
    })
        .setLngLat([data.lng, data.lat])
        .addTo(map);

    places.set(id, { data: data, marker: marker });
}

function removePlaceMarker(id) {

    const place = places.get(id);

    if (!place)
        return;

    place.marker.remove();
    places.delete(id);
}

/* Küçük kutu: küçük resim + ekleyen kişi */
function showPlacePopup(id) {

    const place = places.get(id);

    if (!place)
        return;

    const data = place.data;
    const type = placeType(data.type);
    const images = Array.isArray(data.images) ? data.images : [];

    /* Küçük resim yoksa (eski kayıt) ilk resim kullanılır. */
    const thumbURL =
        data.thumbURL || (images.length ? images[0].url : null);

    const content = document.createElement('div');
    content.className = 'popup-content';

    if (thumbURL) {
        const img = document.createElement('img');
        img.src = thumbURL;
        img.alt = type.label;
        content.appendChild(img);
    }

    /* İnşaat adı burada gösterilmez; sadece tür. */
    const title = document.createElement('div');
    title.className = 'popup-title';
    title.textContent = type.icon + ' ' + type.label;
    content.appendChild(title);

    const userRow = document.createElement('div');
    userRow.className = 'popup-sub';
    userRow.textContent = 'Ekleyen: ' + (data.username || '-');
    content.appendChild(userRow);

    const hint = document.createElement('div');
    hint.className = 'popup-hint';
    hint.textContent = images.length > 1
        ? 'Tüm resimler (' + images.length + ') ve bilgiler için dokun'
        : 'Tüm bilgiler için dokun';
    content.appendChild(hint);

    content.addEventListener('click', () => {
        openDetail(id);
    });

    placePopup
        .setLngLat([data.lng, data.lat])
        .setDOMContent(content)
        .addTo(map);

    activePopupId = id;
}


/* =================================================
   AYRINTI SAYFASI
   -------------------------------------------------
   Haritanın üzerine alttan açılır. Üstte kaydırmalı
   resimler, altta üç sekme: Bilgiler, Yorumlar,
   Yükleyen.
================================================= */

const detailSheet = document.getElementById('detailSheet');
const detailImages = document.getElementById('detailImages');
const detailCounter = document.getElementById('detailCounter');
const detailDeleteBtn = document.getElementById('detailDeleteBtn');
const detailPrevBtn = document.getElementById('detailPrevBtn');
const detailNextBtn = document.getElementById('detailNextBtn');

let detailId = null;

function setDetailTab(name) {

    detailSheet.querySelectorAll('#detailTabs button')
        .forEach(button => {
            button.classList.toggle(
                'active',
                button.dataset.tab === name
            );
        });

    detailSheet.querySelectorAll('.tab-page')
        .forEach(page => {
            page.classList.toggle(
                'active',
                page.dataset.page === name
            );
        });

    document.getElementById('detailBody').scrollTop = 0;
}

detailSheet.querySelectorAll('#detailTabs button')
    .forEach(button => {
        button.addEventListener('click', () => {
            setDetailTab(button.dataset.tab);
        });
    });

/* Resimler kaydırıldıkça "2 / 5" sayacı güncellenir. */
function updateDetailCounter() {

    const total = detailImages.children.length;

    const index = currentImageIndex();

    /* Oklar: tek resimde ve uçlarda gizlenir. */
    detailPrevBtn.style.display = index > 0 ? 'block' : 'none';
    detailNextBtn.style.display = index < total - 1 ? 'block' : 'none';

    if (total < 2) {
        detailCounter.style.display = 'none';
        return;
    }

    detailCounter.style.display = 'block';
    detailCounter.textContent = (index + 1) + ' / ' + total;
}

function currentImageIndex() {

    const total = detailImages.children.length;

    const index = Math.round(
        detailImages.scrollLeft / (detailImages.clientWidth || 1)
    );

    return Math.max(0, Math.min(total - 1, index));
}

/* Bir sonraki (+1) ya da bir önceki (-1) resme geçer. */
function stepImage(direction) {

    detailImages.scrollTo({
        left: (currentImageIndex() + direction) * detailImages.clientWidth,
        behavior: 'smooth'
    });
}

detailPrevBtn.addEventListener('click', () => stepImage(-1));
detailNextBtn.addEventListener('click', () => stepImage(1));

/* Pencere boyutu değişince resim hizası bozulmasın. */
window.addEventListener('resize', () => {

    if (!detailId)
        return;

    detailImages.scrollLeft =
        currentImageIndex() * detailImages.clientWidth;
});

detailImages.addEventListener('scroll', updateDetailCounter);

/* uid -> üyelik tarihi yazısı (tekrar tekrar okunmasın) */
const memberSinceCache = new Map();

async function showUploader(id, data) {

    document.getElementById('detailUser').textContent =
        data.username || '-';

    let count = 0;

    places.forEach(place => {
        if (place.data.uid === data.uid)
            count++;
    });

    document.getElementById('detailUserCount').textContent = count;

    const sinceEl = document.getElementById('detailUserSince');

    if (memberSinceCache.has(data.uid)) {
        sinceEl.textContent = memberSinceCache.get(data.uid);
        return;
    }

    sinceEl.textContent = '…';

    let text = 'Bilinmiyor';

    try {

        const snapshot = await getDoc(doc(db, 'users', data.uid));

        const createdAt =
            snapshot.exists() ? snapshot.data().createdAt : null;

        if (createdAt && typeof createdAt.toDate === 'function') {
            text = createdAt.toDate().toLocaleDateString('tr-TR');
            memberSinceCache.set(data.uid, text);
        }

    } catch (error) {

        console.error(error);
    }

    /* Bu arada başka bir inşaat açıldıysa yazma. */
    if (detailId === id)
        sinceEl.textContent = text;
}

/* Bilgiler sekmesi: sadece doldurulmuş bilgiler gösterilir. */
function renderDetailInfo(data) {

    const box = document.getElementById('detailInfo');

    box.textContent = '';

    function addRow(label, value) {

        if (value === undefined || value === null || value === '')
            return;

        const row = document.createElement('div');
        row.className = 'detail-row';

        const name = document.createElement('span');
        name.textContent = label + ': ';
        row.appendChild(name);

        const text = document.createElement('b');
        text.textContent = value;
        row.appendChild(text);

        box.appendChild(row);
    }

    const buildStatus =
        BUILD_STATUSES.find(status => status.key === data.buildStatus);

    addRow('Durum', buildStatus ? buildStatus.label : null);
    addRow('Yapan firma', data.company);
    addRow('Başlama tarihi', data.startDate ? formatDate(data.startDate) : null);
    addRow('Bitiş tarihi', data.endDate ? formatDate(data.endDate) : null);
    addRow('Kat sayısı', data.floors);
    addRow('Daire / bölüm sayısı', data.units);

    if (data.description) {

        addRow('Açıklama', ' ');

        const text = document.createElement('p');
        text.className = 'detail-text';
        text.textContent = data.description;
        box.appendChild(text);
    }

    if (!box.children.length) {
        const empty = document.createElement('p');
        empty.className = 'tab-empty';
        empty.textContent = 'Ek bilgi girilmemiş.';
        box.appendChild(empty);
    }
}

function openDetail(id) {

    const place = places.get(id);

    if (!place)
        return;

    const data = place.data;
    const type = placeType(data.type);
    const images = Array.isArray(data.images) ? data.images : [];

    placePopup.remove();

    detailId = id;

    /* Başlıkta inşaat adı değil, türü yazar. */
    document.getElementById('detailTitle').textContent =
        type.icon + ' ' + type.label;

    renderDetailInfo(data);

    detailImages.textContent = '';

    images.forEach((image, index) => {
        const img = document.createElement('img');
        img.src = image.url;
        img.alt = type.label;

        /* İlk resim hemen, diğerleri kaydırıldıkça iner. */
        if (index > 0)
            img.loading = 'lazy';

        detailImages.appendChild(img);
    });

    detailImages.scrollLeft = 0;
    updateDetailCounter();

    refreshDeleteButton();

    showUploader(id, data);
    setDetailTab('info');

    detailSheet.classList.add('open');

    /*
     * Geri tuşu bu sayfayı kapatsın; adres çubuğu da
     * bu inşaatın bağlantısını göstersin.
     */
    layerOpened('detail', LINK_PREFIX + encodeURIComponent(id));
}

/* "Sil" sadece inşaatı ekleyen kişiye görünür. */
function refreshDeleteButton() {

    const place = places.get(detailId);

    detailDeleteBtn.style.display =
        (place && currentUser && place.data.uid === currentUser.uid)
            ? 'block'
            : 'none';
}

function closeDetail() {
    hideDetail();
    layerClosed('detail');
}

/* Sadece ekrandan kaldırır (geri tuşuyla kapanırken de kullanılır). */
function hideDetail() {
    detailSheet.classList.remove('open');
    detailId = null;
}

document.getElementById('detailCloseBtn').addEventListener(
    'click',
    closeDetail
);

/* Klavye: Esc kapatır, sağ/sol ok resim değiştirir. */
document.addEventListener('keydown', event => {

    if (!detailId)
        return;

    if (event.key === 'Escape')
        closeDetail();
    else if (event.key === 'ArrowRight')
        stepImage(1);
    else if (event.key === 'ArrowLeft')
        stepImage(-1);
});

detailDeleteBtn.addEventListener(
    'click',
    async function() {

        const place = places.get(detailId);

        if (!place)
            return;

        const id = detailId;
        const data = place.data;

        if (!confirm('Bu inşaat silinsin mi?'))
            return;

        detailDeleteBtn.disabled = true;

        try {

            await deleteDoc(doc(db, 'places', id));

            const paths =
                (Array.isArray(data.images) ? data.images : [])
                    .map(image => image.path);

            if (data.thumbPath)
                paths.push(data.thumbPath);

            paths.forEach(path => {
                deleteObject(ref(storage, path))
                    .catch(error => console.error(error));
            });

            closeDetail();

        } catch (error) {

            console.error(error);
            alert(firebaseErrorMessage(error));

        } finally {

            detailDeleteBtn.disabled = false;
        }
    }
);

onSnapshot(
    query(
        collection(db, 'places'),
        where('status', '==', 'approved')
    ),
    snapshot => {

        snapshot.docChanges().forEach(change => {

            const id = change.doc.id;

            removePlaceMarker(id);

            if (change.type !== 'removed') {
                addPlaceMarker(id, change.doc.data());
                return;
            }

            /* Silinen inşaatın kutusu ya da paneli açıksa kapat. */
            if (activePopupId === id)
                placePopup.remove();

            if (detailId === id)
                closeDetail();
        });

        firstSnapshotDone = true;

        renderHomeList();
        checkLinkedPlace();
    },
    error => {
        console.error(error);
        alert(
            'Kayıtlı inşaatlar yüklenemedi. ' +
            firebaseErrorMessage(error)
        );
    }
);


/* =================================================
   KULLANICI ADI
   -------------------------------------------------
   Küçük harf, rakam ve alt çizgi; 3-20 karakter.
   Aynı ad iki kişiye verilmez: "usernames/<ad>"
   belgesi varsa o ad alınmıştır.
================================================= */

const USERNAME_RE = /^[a-z0-9_]{3,20}$/;

const USERNAME_HELP =
    'Kullanıcı adı 3-20 karakter olmalı; sadece ' +
    'küçük harf (a-z), rakam ve alt çizgi (_) kullanılabilir.';

function normalizeUsername(value) {
    return (value || '').trim().toLowerCase();
}

async function isUsernameTaken(username) {
    const snapshot = await getDoc(doc(db, 'usernames', username));
    return snapshot.exists();
}

/* Kullanıcı adını hesaba bağlar (iki belge birlikte yazılır). */
async function claimUsername(user, username) {

    const batch = writeBatch(db);

    batch.set(doc(db, 'users', user.uid), {
        username: username,
        createdAt: serverTimestamp()
    });

    batch.set(doc(db, 'usernames', username), {
        uid: user.uid
    });

    await batch.commit();
}

async function loadUsername(user) {

    try {

        const snapshot = await getDoc(doc(db, 'users', user.uid));

        return snapshot.exists()
            ? snapshot.data().username || null
            : null;

    } catch (error) {

        console.error(error);
        return null;
    }
}

/* Kullanıcı adı olmayan hesaplara ad sorar. Alındıysa true döner. */
async function askUsername() {

    const username = normalizeUsername(
        prompt('İnşaat eklemek için bir kullanıcı adı seç.\n' + USERNAME_HELP)
    );

    if (!username)
        return false;

    if (!USERNAME_RE.test(username)) {
        alert(USERNAME_HELP);
        return false;
    }

    try {

        if (await isUsernameTaken(username)) {
            alert('Bu kullanıcı adı alınmış.');
            return false;
        }

        await claimUsername(currentUser, username);

        currentUsername = username;
        updateAccountButton();

        return true;

    } catch (error) {

        console.error(error);
        alert(firebaseErrorMessage(error));
        return false;
    }
}


/* =================================================
   GİRİŞ / KAYIT / ÇIKIŞ
================================================= */

const loginPanel = document.getElementById('loginPanel');
const loginBtn = document.getElementById('loginBtn');
const loginSwitch = document.getElementById('loginSwitch');
const loginUsername = document.getElementById('loginUsername');

/* false: giriş yap, true: yeni hesap oluştur */
let signupMode = false;

/* Girişten sonra kullanıcı adı okunurken bekleyen işlem */
let usernameLoading = Promise.resolve();

function setLoginMode(signup) {

    signupMode = signup;

    document.getElementById('loginTitle').textContent =
        signup ? 'Hesap oluştur' : 'Giriş yap';

    loginBtn.textContent = signup ? 'Kayıt ol' : 'Giriş';

    loginSwitch.textContent = signup
        ? 'Hesabın var mı? Giriş yap'
        : 'Hesabın yok mu? Kayıt ol';

    loginUsername.style.display = signup ? 'block' : 'none';

    document.getElementById('loginPassword').autocomplete =
        signup ? 'new-password' : 'current-password';
}

loginSwitch.addEventListener('click', () => {
    setLoginMode(!signupMode);
});

function openLoginPanel() {
    loginPanel.style.display = 'block';
    document.getElementById('loginEmail').focus();

    layerOpened('login');
}

function closeLoginPanel() {
    hideLoginPanel();
    layerClosed('login');
}

/* Sadece ekrandan kaldırır (geri tuşuyla kapanırken de kullanılır). */
function hideLoginPanel() {
    loginPanel.style.display = 'none';
    document.getElementById('loginPassword').value = '';
    loginUsername.value = '';
    setLoginMode(false);
}

function updateAccountButton() {

    /* Menüdeki hesap satırı */
    document.getElementById('menuAccount').textContent = currentUser
        ? 'Çıkış yap (' + (currentUsername || currentUser.email) + ')'
        : 'Giriş yap / Kayıt ol';

    /* "Yüklemelerim" sadece giriş yapılmışken görünür. */
    document.getElementById('menuMine').style.display =
        currentUser ? 'block' : 'none';

    /* "Yüklemelerim" listesi hesaba göre değişir. */
    renderHomeList();
}

onAuthStateChanged(auth, user => {

    if (!user || !currentUser || currentUser.uid !== user.uid)
        currentUsername = null;

    currentUser = user;

    updateAccountButton();

    /* Açık ayrıntı sayfasındaki "Sil" düğmesi yeni hesaba göre güncellensin. */
    refreshDeleteButton();

    if (!user)
        return;

    usernameLoading = loadUsername(user).then(username => {

        if (
            username &&
            currentUser &&
            currentUser.uid === user.uid
        ) {
            currentUsername = username;
            updateAccountButton();
        }
    });
});

/* Giriş yapılmamışsa giriş ekranını açar, yapılmışsa çıkış sorar. */
function accountAction() {

    if (!currentUser) {
        pendingLngLat = null;
        openLoginPanel();
        return;
    }

    const who = currentUsername || currentUser.email;

    if (confirm(who + ' hesabından çıkış yapılsın mı?')) {
        closePanel();
        signOut(auth).catch(error => alert(firebaseErrorMessage(error)));
    }
}



async function login() {

    const email =
        document.getElementById('loginEmail').value.trim();

    const password =
        document.getElementById('loginPassword').value;

    const username = normalizeUsername(loginUsername.value);

    if (!email || !password) {
        alert('E-posta ve şifre girin.');
        return;
    }

    if (signupMode && !USERNAME_RE.test(username)) {
        alert(USERNAME_HELP);
        return;
    }

    if (signupMode && password.length < 6) {
        alert('Şifre en az 6 karakter olmalı.');
        return;
    }

    loginBtn.disabled = true;

    try {

        if (signupMode) {

            if (await isUsernameTaken(username)) {
                alert('Bu kullanıcı adı alınmış.');
                return;
            }

            const result =
                await createUserWithEmailAndPassword(auth, email, password);

            try {

                await claimUsername(result.user, username);

            } catch (error) {

                /* Ad alınamadıysa yarım kalan hesabı geri al. */
                await result.user.delete().catch(() => {});

                throw new Error(
                    'Kullanıcı adı alınamadı. Başka bir ad deneyin.'
                );
            }

            currentUser = result.user;
            currentUsername = username;
            updateAccountButton();

        } else {

            const result =
                await signInWithEmailAndPassword(auth, email, password);

            currentUser = result.user;
        }

        closeLoginPanel();

        /* Giriş, uzun basma sonrası istendiyse kaldığı yerden devam. */
        if (pendingLngLat) {
            const lngLat = pendingLngLat;
            pendingLngLat = null;
            openAddPanel(lngLat);
        }

    } catch (error) {

        console.error(error);
        alert(firebaseErrorMessage(error));

    } finally {

        loginBtn.disabled = false;
    }
}

loginBtn.addEventListener('click', login);

document.getElementById('loginPassword').addEventListener(
    'keydown',
    e => {
        if (e.key === 'Enter')
            login();
    }
);

document.getElementById('loginCancelBtn').addEventListener(
    'click',
    () => {
        pendingLngLat = null;
        closeLoginPanel();
    }
);

/* =================================================
   GERİ TUŞU
   -------------------------------------------------
   Telefondaki geri tuşu (ya da kenardan kaydırma)
   uygulamadan çıkmak yerine açık olan şeyi kapatır:
   ayrıntı sayfası, ekleme formu ya da giriş ekranı.

   Nasıl: bunlardan biri açılınca tarayıcı geçmişine
   bir kayıt eklenir. Geri tuşu o kaydı geri alır,
   biz de açık olanı kapatırız. Kapat düğmesiyle
   kapatılınca kayıt kendimiz geri alınır.
================================================= */

/* Açık katmanlar, açılış sırasıyla: 'detail', 'panel', 'login' */
const openLayers = [];

/* Kendi yaptığımız, henüz tamamlanmamış geri alma işlemleri */
let ignoredPops = 0;

/*
 * Geri alma işlemi sürerken açılan katmanlar burada bekler.
 * (Tarayıcı geri almayı gecikmeli yapar; o bitmeden geçmişe
 * kayıt eklenirse yanlış kayıt geri alınır.)
 */
let waitingLayers = [];

const LAYER_HIDERS = {
    detail: hideDetail,
    panel: resetPanel,
    login: hideLoginPanel
};

/* Bir katman açıldığında çağrılır. */
function layerOpened(name, url) {

    /* Geri alma sürüyorsa sıraya al. */
    if (ignoredPops > 0) {

        waitingLayers = waitingLayers.filter(item => item.name !== name);
        waitingLayers.push({ name: name, url: url });

        return;
    }

    try {

        /* Zaten açıksa sadece adres güncellenir. */
        if (openLayers.includes(name)) {

            if (url) {
                history.replaceState(
                    { depth: openLayers.length },
                    '',
                    url
                );
            }

            return;
        }

        openLayers.push(name);

        history.pushState(
            { depth: openLayers.length },
            '',
            url || location.href
        );

    } catch (error) {}
}

/* Bir katman düğmeyle (geri tuşu dışında) kapatıldığında çağrılır. */
function layerClosed(name) {

    /* Henüz geçmişe eklenmemişse sıradan çıkarmak yeterli. */
    if (waitingLayers.some(item => item.name === name)) {
        waitingLayers = waitingLayers.filter(item => item.name !== name);
        return;
    }

    const index = openLayers.indexOf(name);

    if (index < 0)
        return;

    openLayers.splice(index, 1);

    ignoredPops++;
    history.back();
}

window.addEventListener('popstate', event => {

    /* Kendi geri alma işlemimiz tamamlandı. */
    if (ignoredPops > 0) {

        ignoredPops--;

        if (ignoredPops === 0) {

            const waiting = waitingLayers;
            waitingLayers = [];

            waiting.forEach(item => layerOpened(item.name, item.url));
        }

        return;
    }

    const depth = (event.state && event.state.depth) || 0;

    /* İleri tuşu: kapanmış bir şeyi geri açmayız, geri döneriz. */
    if (depth > openLayers.length) {
        ignoredPops++;
        history.go(openLayers.length - depth);
        return;
    }

    /* Geri tuşu: en son açılandan başlayarak kapat. */
    while (openLayers.length > depth)
        LAYER_HIDERS[openLayers.pop()]();
});

/* Sayfa yenilendiyse eski geçmiş kaydı sıfırlanır. */
try {
    history.replaceState(null, '', location.href);
} catch (error) {}


/* =================================================
   PAYLAŞIM BAĞLANTISI
   -------------------------------------------------
   Her inşaatın kendi adresi vardır:
       .../sayfa.html#insaat=<kimlik>
   Ayrıntı sayfası açıkken adres çubuğu da bu adresi
   gösterir (bkz. GERİ TUŞU). Bağlantıyla gelen kişide harita o
   inşaata gider ve ayrıntı sayfası açılır.
================================================= */

const LINK_PREFIX = '#insaat=';

function linkedIdFromHash() {

    const hash = location.hash || '';

    return hash.indexOf(LINK_PREFIX) === 0
        ? decodeURIComponent(hash.slice(LINK_PREFIX.length))
        : null;
}

function placeLink(id) {
    return location.href.split('#')[0] +
        LINK_PREFIX + encodeURIComponent(id);
}

/* Adres çubuğunu günceller (sayfa yenilenmez). */
function setHash(id) {

    try {
        history.replaceState(
            null,
            '',
            id
                ? LINK_PREFIX + encodeURIComponent(id)
                : location.pathname + location.search
        );
    } catch (error) {}
}

/* Sayfa bir bağlantıyla açıldıysa beklenen inşaat */
let linkedPlaceId = linkedIdFromHash();

let firstSnapshotDone = false;

function openLinkedPlace(id) {

    const place = places.get(id);

    if (!place)
        return false;

    showTab('map');

    map.jumpTo({
        center: [place.data.lng, place.data.lat],
        zoom: Math.max(map.getZoom(), 15)
    });

    /*
     * Adresteki bağlantı temizlenir; ayrıntı sayfası kendi
     * geçmiş kaydını ekler. Böylece geri tuşu sayfayı kapatır
     * ama uygulamadan çıkmaz.
     */
    setHash(null);

    openDetail(id);

    return true;
}

/* Kayıtlar her geldiğinde çağrılır. */
function checkLinkedPlace() {

    if (!linkedPlaceId)
        return;

    if (openLinkedPlace(linkedPlaceId)) {
        linkedPlaceId = null;
        return;
    }

    if (firstSnapshotDone) {
        linkedPlaceId = null;
        setHash(null);
        alert('Bu bağlantıdaki inşaat bulunamadı. Silinmiş olabilir.');
    }
}

window.addEventListener('hashchange', () => {

    /* Kendi geri alma işlemlerimiz sırasında bir şey yapma. */
    if (ignoredPops > 0)
        return;

    const id = linkedIdFromHash();

    if (id && id !== detailId && !openLinkedPlace(id))
        alert('Bu bağlantıdaki inşaat bulunamadı. Silinmiş olabilir.');
});

const detailShareBtn = document.getElementById('detailShareBtn');

detailShareBtn.addEventListener(
    'click',
    async function() {

        const place = places.get(detailId);

        if (!place)
            return;

        const url = placeLink(detailId);

        /* Telefonda paylaşım menüsü (WhatsApp vb.) açılır. */
        if (navigator.share) {

            try {
                await navigator.share({
                    title: placeType(place.data.type).label + ' inşaatı',
                    url: url
                });
            } catch (error) {}

            return;
        }

        try {

            await navigator.clipboard.writeText(url);

            detailShareBtn.textContent = '✓ Bağlantı kopyalandı';

            setTimeout(() => {
                detailShareBtn.textContent = '🔗 Paylaş';
            }, 2000);

        } catch (error) {

            prompt('Bağlantıyı kopyala:', url);
        }
    }
);


/* =================================================
   SEKMELER VE ANA SAYFA
   -------------------------------------------------
   Alt menüde iki sekme vardır: Ana Sayfa ve Harita.
   Ana sayfa haritanın üzerinde durur, Harita
   sekmesine geçilince gizlenir.
================================================= */

const altMenu = document.getElementById('altMenu');
const acKapa = document.getElementById('acKapa');
const menuItems = document.querySelectorAll('.alt-menu .oge');

/* Alt menüdeki öğe adı -> sekme adı */
const MENU_TABS = {
    anasayfa: 'home',
    harita: 'map'
};
const homeMenu = document.getElementById('homeMenu');
const homeList = document.getElementById('homeList');

/* Ana sayfada gösterilecek en fazla inşaat sayısı */
const HOME_LIST_LIMIT = 50;

function showTab(name) {

    document.body.dataset.tab = name;

    menuItems.forEach(item => {
        item.classList.toggle(
            'aktif',
            MENU_TABS[item.dataset.sayfa] === name
        );
    });

    homeMenu.classList.remove('open');

    if (name === 'home')
        placePopup.remove();
}

menuItems.forEach(item => {
    item.addEventListener('click', event => {
        event.preventDefault();
        showTab(MENU_TABS[item.dataset.sayfa]);
    });
});

/* Mavi düğme: alt menüyü aç / kapat */
acKapa.addEventListener('click', () => {
    const closed = altMenu.classList.toggle('kapali');
    acKapa.setAttribute('aria-expanded', String(!closed));
});

/* MENÜ */

document.getElementById('menuBtn').addEventListener(
    'click',
    event => {
        event.stopPropagation();
        homeMenu.classList.toggle('open');
    }
);

/* Menü dışında bir yere tıklanınca menü kapanır. */
document.addEventListener('click', event => {
    if (!homeMenu.contains(event.target))
        homeMenu.classList.remove('open');
});

document.getElementById('menuAccount').addEventListener(
    'click',
    () => {
        homeMenu.classList.remove('open');
        accountAction();
    }
);

document.getElementById('menuLatest').addEventListener(
    'click',
    () => {
        homeMenu.classList.remove('open');
        setHomeMode('latest');
    }
);

document.getElementById('menuMine').addEventListener(
    'click',
    () => {
        homeMenu.classList.remove('open');
        setHomeMode('mine');
    }
);

document.getElementById('menuMap').addEventListener(
    'click',
    () => {
        showTab('map');
    }
);

/*
 * ANA SAYFA LİSTESİ
 *   latest : son eklenenler (herkesin). İnşaat adı gösterilmez.
 *   mine   : giriş yapan kişinin kendi yükledikleri. İnşaat adı
 *            sadece burada görünür.
 */
let homeMode = 'latest';

function setHomeMode(mode) {
    homeMode = mode;
    renderHomeList();
    document.getElementById('homeMain').scrollTop = 0;
}

function createdMillis(data) {

    const createdAt = data.createdAt;

    /* Yeni eklenen kayıtta sunucu saati henüz gelmemiş olabilir. */
    return (createdAt && typeof createdAt.toMillis === 'function')
        ? createdAt.toMillis()
        : Date.now();
}

function renderHomeList() {

    /* Çıkış yapıldıysa "Yüklemelerim" gösterilemez. */
    if (homeMode === 'mine' && !currentUser)
        homeMode = 'latest';

    const mine = homeMode === 'mine';

    document.getElementById('homeTitle').textContent =
        mine ? 'Yüklemelerim' : 'Son eklenenler';

    let items = [];

    places.forEach((place, id) => {
        if (!mine || place.data.uid === currentUser.uid)
            items.push({ id: id, data: place.data });
    });

    items.sort((a, b) => createdMillis(b.data) - createdMillis(a.data));

    if (!mine)
        items = items.slice(0, HOME_LIST_LIMIT);

    homeList.textContent = '';

    if (!items.length) {

        const empty = document.createElement('p');
        empty.className = 'home-empty';
        empty.textContent = mine
            ? 'Henüz inşaat eklemedin. Harita sekmesinde bir noktaya ' +
              'basılı tutarak ekleyebilirsin.'
            : 'Henüz inşaat eklenmemiş. Harita sekmesinde bir noktaya ' +
              'basılı tutarak ilk inşaatı ekleyebilirsin.';
        homeList.appendChild(empty);

        return;
    }

    items.forEach(item => {

        const data = item.data;
        const type = placeType(data.type);
        const images = Array.isArray(data.images) ? data.images : [];
        const typeText = type.icon + ' ' + type.label;

        const thumbURL =
            data.thumbURL || (images.length ? images[0].url : null);

        const card = document.createElement('button');
        card.className = 'home-card';

        if (thumbURL) {
            const img = document.createElement('img');
            img.src = thumbURL;
            img.alt = '';
            img.loading = 'lazy';
            card.appendChild(img);
        }

        const text = document.createElement('div');
        text.className = 'home-card-text';

        const title = document.createElement('div');
        title.className = 'home-card-title';

        const sub = document.createElement('div');
        sub.className = 'home-card-sub';

        if (mine) {

            /* Kendi listesinde: ad (varsa) + tür */
            title.textContent = data.name || typeText;

            const createdAt = data.createdAt;

            const date =
                (createdAt && typeof createdAt.toDate === 'function')
                    ? createdAt.toDate().toLocaleDateString('tr-TR')
                    : '';

            sub.textContent =
                [data.name ? typeText : '', date]
                    .filter(Boolean)
                    .join(' · ');

        } else {

            /* Herkese açık listede ad gösterilmez. */
            title.textContent = typeText;
            sub.textContent = 'Ekleyen: ' + (data.username || '-');
        }

        text.appendChild(title);
        text.appendChild(sub);
        card.appendChild(text);

        card.addEventListener('click', () => {
            openDetail(item.id);
        });

        homeList.appendChild(card);
    });
}

/* Bağlantıyla gelindiyse doğrudan harita, yoksa ana sayfa açılır. */
showTab(linkedPlaceId ? 'map' : 'home');

updateAccountButton();
renderThumbs();

</script>
