<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>İnşaat Haritası</title>

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js"></script>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#map {
    position: absolute;
    inset: 0;
}

/* -----------------------------
   ALT PANELLER
   panel       : inşaat ekleme formu
   loginPanel  : giriş / kayıt
   detailPanel : inşaatın tüm resimleri ve bilgileri
----------------------------- */

#panel,
#loginPanel,
#detailPanel {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    width: min(92%, 400px);
    max-height: calc(100% - 40px);
    overflow-y: auto;
    background: white;
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 5px 25px rgba(0,0,0,.25);
    z-index: 20;
    display: none;
}

#detailPanel {
    z-index: 25;
}

#panel h3,
#loginPanel h3,
#detailPanel h3 {
    margin: 0 0 14px;
    font-size: 20px;
}

#locationName,
#placeType,
#startDate,
#endDate,
#loginUsername,
#loginEmail,
#loginPassword {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    font-family: inherit;
    background: white;
    margin-bottom: 10px;
}

/* Kullanıcı adı kutusu sadece kayıt olurken görünür */
#loginUsername {
    display: none;
}

.field-row {
    display: flex;
    gap: 8px;
}

.field-row > label {
    flex: 1;
    min-width: 0;
}

.field-label {
    display: block;
    font-size: 12px;
    color: #666;
    margin-bottom: 4px;
}

#imageInput {
    width: 100%;
    margin-bottom: 10px;
}

/* Seçilen resimlerin küçük önizlemeleri */
#thumbs {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 8px;
}

.thumb {
    position: relative;
    width: 64px;
    height: 64px;
}

.thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
    display: block;
}

.thumb button {
    position: absolute;
    top: -7px;
    right: -7px;
    width: 22px;
    height: 22px;
    flex: none;
    padding: 0;
    border-radius: 50%;
    background: #c62828;
    color: white;
    font-size: 14px;
    line-height: 22px;
}

#sizeInfo {
    font-size: 12px;
    color: #777;
    margin-bottom: 12px;
}

.buttons {
    display: flex;
    gap: 8px;
}

button {
    flex: 1;
    border: 0;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
    cursor: default;
}

#addBtn,
#loginBtn {
    background: #28a745;
    color: white;
}

#cancelBtn,
#loginCancelBtn,
#detailCloseBtn {
    background: #eee;
    color: #333;
}

#detailDeleteBtn {
    display: none;
    background: #fdecea;
    color: #c62828;
}

/* Giriş / kayıt arasında geçiş bağlantısı */
#loginSwitch {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 6px;
    background: none;
    color: #1a73e8;
    font-size: 14px;
    font-weight: normal;
}

/* -----------------------------
   HARİTADAKİ İNŞAAT İŞARETİ
   Üzerinde inşaatın türü yazar.
----------------------------- */

.place-marker {
    /* Konumlandırmayı (position: absolute) MapLibre yapar. */
    background: #28a745;
    color: white;
    border: 2px solid white;
    border-radius: 14px;
    padding: 4px 9px;
    font-size: 12px;
    font-weight: bold;
    white-space: nowrap;
    box-shadow: 0 3px 10px rgba(0,0,0,.35);
    cursor: pointer;
}

.place-marker::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: -8px;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: #28a745;
    border-bottom: 0;
}

/* -----------------------------
   İŞARETE İLK TIKLAMA: KÜÇÜK KUTU
   1 resim + ekleyen kişi
----------------------------- */

.popup-content {
    width: 220px;
    cursor: pointer;
}

.popup-content img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 8px;
    display: block;
    background: #eee;
}

.popup-title {
    font-weight: bold;
    font-size: 16px;
    overflow-wrap: anywhere;
}

.popup-sub {
    font-size: 13px;
    color: #555;
    margin-top: 2px;
}

.popup-hint {
    font-size: 12px;
    color: #1a73e8;
    margin-top: 6px;
}

/* -----------------------------
   İKİNCİ TIKLAMA: AYRINTI PANELİ
   Tüm resimler ve bilgiler
----------------------------- */

#detailTitle {
    overflow-wrap: anywhere;
}

.detail-row {
    font-size: 14px;
    color: #333;
    margin-bottom: 6px;
}

.detail-row span {
    color: #777;
}

#detailImages {
    margin: 12px 0;
}

#detailImages img {
    width: 100%;
    border-radius: 10px;
    margin-bottom: 8px;
    display: block;
    background: #eee;
}

/* -----------------------------
   KONUMUM VE HESAP BUTONLARI
----------------------------- */

#locationBtn,
#accountBtn {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 15;

    width: 48px;
    height: 48px;

    border: none;
    border-radius: 50%;

    background: white;
    color: #333;

    font-size: 22px;

    box-shadow: 0 2px 10px rgba(0,0,0,.25);

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    padding: 0;
}

#accountBtn {
    top: 73px;
}

#locationBtn:active,
#accountBtn:active {
    transform: scale(.94);
}

#locationBtn.loading {
    opacity: .6;
}

/* Giriş yapılmışsa yeşil görünür */
body.signed-in #accountBtn {
    background: #28a745;
}

/* -----------------------------
   GÖRÜNÜM SEÇENEKLERİ
----------------------------- */

#options {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 15;

    background: white;
    border-radius: 14px;
    padding: 6px 12px;

    box-shadow: 0 2px 10px rgba(0,0,0,.25);

    font-size: 14px;
    color: #333;
}

#options label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 0;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
}

#options input {
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: #28a745;
    cursor: pointer;
}

</style>

<body>

<div id="map"></div>

<button id="locationBtn" aria-label="Konumum" title="Konumum">📍</button>

<!-- GİRİŞ / KAYIT -->
<div id="loginPanel">

<!-- İNŞAAT EKLEME FORMU -->
<div id="panel">
    <h3>İnşaat ekle</h3>

    <input id="locationName" type="text" placeholder="İnşaat adı" maxlength="100">

    <select id="placeType" aria-label="İnşaat türü">
        <option value="">Tür seç…</option>
    </select>

    <div class="field-row">
        <label>
            <span class="field-label">Başlama tarihi</span>
            <input id="startDate" type="date">
        </label>
        <label>
            <span class="field-label">Bitiş tarihi</span>

    <span class="field-label">Resimler (en az 1, en fazla 5)</span>

    <input id="imageInput" type="file" accept="image/*" multiple>

    <div id="thumbs"></div>

    <div id="sizeInfo"></div>

    <div class="buttons">
        <button id="cancelBtn">İptal</button>

<!-- İNŞAAT AYRINTISI -->
<div id="detailPanel">
    <h3 id="detailTitle"></h3>

    <div class="detail-row"><span>Tür:</span> <b id="detailType"></b></div>
    <div class="detail-row"><span>Başlama:</span> <b id="detailStart"></b></div>
    <div class="detail-row"><span>Bitiş:</span> <b id="detailEnd"></b></div>
    <div class="detail-row"><span>Ekleyen:</span> <b id="detailUser"></b></div>

    <div id="detailImages"></div>

    <div class="buttons">
        <button id="detailDeleteBtn">Sil</button>
        <button id="detailCloseBtn">Kapat</button>
    </div>
</div>

<script type="module">

/* =================================================
   FIREBASE
   -------------------------------------------------
   Auth      : e-posta / şifre ile giriş ve kayıt
   Firestore : "places"    inşaat kayıtları
               "users"     kullanıcı adı (uid -> ad)
               "usernames" kullanıcı adı (ad -> uid),
                           aynı adın iki kez alınmasını önler
   Storage   : resimler, "places/<uid>/" klasöründe

   Herkes haritayı görebilir. Hesap açan herkes
   inşaat ekleyebilir; herkes yalnızca kendi
   eklediğini silebilir.
================================================= */

import { initializeApp }
    from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';

import {
    getAuth,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    signOut
} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js';

import {
    getFirestore,
    collection,
    doc,
    getDoc,
    setDoc,
    deleteDoc,
    writeBatch,
    query,
    where,
    onSnapshot,
    serverTimestamp
} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js';

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL,
    deleteObject
} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-storage.js';

const firebaseConfig = {
    apiKey: "AIzaSyAjePBYTAqvEOMKCAM0OYjlnHKXP7SL5Us",
    authDomain: "harita-8a168.firebaseapp.com",
    projectId: "harita-8a168",
    storageBucket: "harita-8a168.firebasestorage.app",
    messagingSenderId: "223766175597",
    appId: "1:223766175597:web:ef353c0fe382e275a70464"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);
const storage = getStorage(firebaseApp);

/* Giriş yapmış kullanıcı (yoksa null) ve kullanıcı adı */
let currentUser = null;
let currentUsername = null;

/* Firebase hatalarını Türkçe mesaja çevirir. */
function firebaseErrorMessage(error) {

    const code = (error && error.code) || '';

    if (
        code === 'permission-denied' ||
        code === 'storage/unauthorized'
    ) {
        return 'Bu işlem için yetkin yok.';
    }

    if (
        code === 'auth/invalid-credential' ||
        code === 'auth/wrong-password' ||
        code === 'auth/user-not-found' ||
        code === 'auth/invalid-email'
    ) {
        return 'E-posta veya şifre hatalı.';
    }

    if (code === 'auth/email-already-in-use')
        return 'Bu e-posta ile zaten bir hesap var. Giriş yapmayı deneyin.';

    if (code === 'auth/weak-password')
        return 'Şifre en az 6 karakter olmalı.';

    if (code === 'auth/too-many-requests')
        return 'Çok fazla deneme yapıldı. Biraz sonra tekrar deneyin.';

    if (
        code === 'auth/network-request-failed' ||
        code === 'unavailable' ||
        code === 'storage/retry-limit-exceeded'
    ) {
        return 'İnternet bağlantısı kurulamadı.';
    }

    if (!code && error && error.message)
        return error.message;

    return 'İşlem başarısız: ' + (code || 'bilinmeyen hata');
}


/* =================================================
   HARİTA
   -------------------------------------------------
   Harita önce stilsiz oluşturulur. Stil dosyası
   ayrıca indirilir, Türkçe isimler ve küçük POI
   ikonları stile ÖNCEDEN işlenir, sonra haritaya
   verilir. Böylece ikonlar ilk çizimde bile küçük
   görünür (önce büyük görünüp küçülme olmaz).
================================================= */

const STYLE_URL = 'https://tiles.openfreemap.org/styles/liberty';

/* POI ikonlarının küçültme oranı (1 = orijinal) */
const POI_ICON_SCALE = 0.5;

/* Cadde ve sokak isimlerinin yazı küçültme oranı (1 = orijinal) */
const STREET_TEXT_SCALE = 0.75;

/* Türkçe isim önceliği uygulanacak veri katmanları */
const TURKISH_NAME_LAYERS = [
    'poi',
    'park',
    'transportation_name',
    'place',
    'aerodrome_label'
];

const map = new maplibregl.Map({
    container: 'map',
    center: [26.4144, 40.1467],
    zoom: 14,
    doubleClickZoom: true,
    attributionControl: false
});

/*
 * Kaynak bilgisi (OpenFreeMap / OpenStreetMap) küçük
 * bir "i" düğmesi olarak gösterilir. Tamamen kaldırma:
 * OpenStreetMap verisinin lisansı kaynak gösterilmesini
 * zorunlu kılıyor.
 */
map.addControl(
    new maplibregl.AttributionControl({ compact: true }),
    'bottom-right'
);

/*
 * OpenStreetMap kaynak gösterme kuralı: yazı açılışta
 * görünür olmalı; harita kaydırılınca veya 5 saniye
 * sonra "i" düğmesine küçülebilir.
 *
 * MapLibre haritayı kaydırınca kendisi küçültür.
 * Burada ek olarak 5 saniye sonra küçültüyoruz.
 */
const ATTRIBUTION_VISIBLE_MS = 5000;

function collapseAttribution() {

    const el = map.getContainer().querySelector(
        '.maplibregl-ctrl-attrib'
    );

    if (!el || !el.classList.contains('maplibregl-compact'))
        return;

    el.removeAttribute('open');
    el.classList.remove('maplibregl-compact-show');
}

map.once('load', () => {
    setTimeout(collapseAttribution, ATTRIBUTION_VISIBLE_MS);
});


/* =================================================
   GÖRÜNÜM SEÇENEKLERİ
   -------------------------------------------------
   Harita temiz başlar. Kutular işaretlenince ilgili
   katmanlar görünür olur.
     streets : cadde/sokak isimleri + yol numaraları
     places  : mekânlar, duraklar, parklar, havalimanı
================================================= */

const visibleGroups = {
    streets: false,
    places: false
};

const PLACE_SOURCE_LAYERS = [
    'poi',
    'park',
    'aerodrome_label'
];

/* Katmanın hangi seçeneğe ait olduğunu döndürür. */
function layerGroup(layer) {

    if (layer.type !== 'symbol')
        return null;

    const sourceLayer = layer['source-layer'];

    if (sourceLayer === 'transportation_name')
        return 'streets';

    if (PLACE_SOURCE_LAYERS.includes(sourceLayer))
        return 'places';

    return null;
}

/* Seçeneklerin güncel halini haritaya uygular. */
function applyVisibility() {

    const style = map.getStyle();

    if (!style || !style.layers)
        return;

    style.layers.forEach(layer => {

        const group = layerGroup(layer);

        if (!group)
            return;

        try {
            map.setLayoutProperty(
                layer.id,
                'visibility',
                visibleGroups[group] ? 'visible' : 'none'
            );
        } catch (e) {}
    });
}

document.getElementById('showStreets').addEventListener(
    'change',
    function() {
        visibleGroups.streets = this.checked;
        applyVisibility();
    }
);

document.getElementById('showPlaces').addEventListener(
    'change',
    function() {
        visibleGroups.places = this.checked;
        applyVisibility();
    }
);

/* Tarayıcı geri gelince eski işaretleri hatırlamasın. */
document.getElementById('showStreets').checked = false;
document.getElementById('showPlaces').checked = false;


/*
 * icon-size değerini oranla çarpar.
 * Değer sayı, eski tip {stops: [...]} nesnesi veya
 * ifade (interpolate / step / diğer) olabilir.
 */
function scaleSize(value, scale) {

    if (value === undefined || value === null)
        return scale;

    if (typeof value === 'number')
        return value * scale;

    /* Eski tip fonksiyon: { stops: [[zoom, değer], ...] } */
    if (!Array.isArray(value)) {

        if (Array.isArray(value.stops)) {
            return Object.assign({}, value, {
                stops: value.stops.map(stop => [
                    stop[0],
                    scaleSize(stop[1], scale)
                ])
            });
        }

        return value;
    }

    const op = value[0];

    /* ['interpolate', tip, girdi, z1, d1, z2, d2, ...] */
    if (typeof op === 'string' && op.indexOf('interpolate') === 0) {
        return value.map((item, i) =>
            (i >= 4 && i % 2 === 0)
                ? scaleSize(item, scale)
                : item
        );
    }

    /* ['step', girdi, d0, z1, d1, z2, d2, ...] */
    if (op === 'step') {
        return value.map((item, i) =>
            (i >= 2 && i % 2 === 0)
                ? scaleSize(item, scale)
                : item
        );
    }

    return ['*', value, scale];
}


/*
 * Stil haritaya verilmeden önce düzenlenir.
 */
function prepareStyle(style) {

    (style.layers || []).forEach(layer => {

        if (layer.type !== 'symbol')
            return;

        if (!layer.layout)
            layer.layout = {};

        const sourceLayer = layer['source-layer'];

        /* GÖRÜNÜM SEÇENEKLERİ: harita temiz başlar */
        const group = layerGroup(layer);

        if (group) {
            layer.layout.visibility =
                visibleGroups[group] ? 'visible' : 'none';
        }

        /* TÜRKÇE İSİM ÖNCELİĞİ */
        if (
            layer.layout['text-field'] &&
            TURKISH_NAME_LAYERS.includes(sourceLayer)
        ) {
            layer.layout['text-field'] = [
                'coalesce',
                ['get', 'name:tr'],
                ['get', 'name'],
                ['get', 'name:latin']
            ];
        }

        /*
         * CADDE VE SOKAK İSİMLERİ
         * Yol numarası levhaları (ikonlu katmanlar) hariç.
         * text-size belirtilmemişse MapLibre varsayılanı 16'dır.
         */
        if (
            sourceLayer === 'transportation_name' &&
            layer.layout['text-field'] &&
            !layer.layout['icon-image']
        ) {
            const currentTextSize = layer.layout['text-size'];

            layer.layout['text-size'] = scaleSize(
                (currentTextSize === undefined || currentTextSize === null)
                    ? 16
                    : currentTextSize,
                STREET_TEXT_SCALE
            );
        }

        /*
         * TÜM POI İKONLARI (duraklar dahil)
         * Yazı boyutuna dokunulmuyor.
         */
        if (
            sourceLayer === 'poi' &&
            layer.layout['icon-image']
        ) {
            layer.layout['icon-size'] = scaleSize(
                layer.layout['icon-size'],
                POI_ICON_SCALE
            );
        }
    });

    return style;
}


fetch(STYLE_URL)
    .then(response => {
        if (!response.ok)
            throw new Error('Stil indirilemedi: ' + response.status);
        return response.json();
    })
    .then(style => {
        map.setStyle(prepareStyle(style));
    })
    .catch(error => {
        /* Stil düzenlenemezse harita yine de açılsın. */
        console.error(error);
        map.once('style.load', applyVisibility);
        map.setStyle(STYLE_URL);
    });


/* =================================================
   UZUN BASMA - TELEFON
================================================= */

let pressTimer = null;
let pressStart = null;
let pressLngLat = null;

map.getCanvas().addEventListener(
    'touchstart',
    function(e) {

        if (!e.touches || e.touches.length !== 1)
            return;

        const touch = e.touches[0];

        pressStart = {
            x: touch.clientX,
            y: touch.clientY
        };

        const rect =
            map.getCanvas().getBoundingClientRect();

        pressLngLat = map.unproject({
            x: touch.clientX - rect.left,
            y: touch.clientY - rect.top
        });

        clearTimeout(pressTimer);

        pressTimer = setTimeout(() => {

            if (!pressLngLat)
                return;

            openAddPanel(pressLngLat);

        }, 700);
    },
    { passive: true }
);

map.getCanvas().addEventListener(
    'touchmove',
    function(e) {

        if (!pressStart)
            return;

        const touch = e.touches[0];

        const dx = touch.clientX - pressStart.x;
        const dy = touch.clientY - pressStart.y;

        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance > 10) {
            clearTimeout(pressTimer);
            pressStart = null;
            pressLngLat = null;
        }
    },
    { passive: true }
);

map.getCanvas().addEventListener(
    'touchend',
    function() {
        clearTimeout(pressTimer);
        pressStart = null;
        pressLngLat = null;
    }
);


/* =================================================
   UZUN BASMA - BİLGİSAYAR
================================================= */

let mouseTimer = null;
let mouseStart = null;
let mouseLngLat = null;

map.getCanvas().addEventListener(
    'mousedown',
    function(e) {

        if (e.button !== 0)
            return;

        mouseStart = {
            x: e.clientX,
            y: e.clientY
        };

        mouseLngLat =
            map.unproject([
                e.offsetX,
                e.offsetY
            ]);

        clearTimeout(mouseTimer);

        mouseTimer = setTimeout(() => {

            if (!mouseLngLat)
                return;

            openAddPanel(mouseLngLat);

        }, 700);
    }
);

map.getCanvas().addEventListener(
    'mousemove',
    function(e) {

        if (!mouseStart)
            return;

        const dx = e.clientX - mouseStart.x;
        const dy = e.clientY - mouseStart.y;

        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance > 8) {
            clearTimeout(mouseTimer);
            mouseStart = null;
            mouseLngLat = null;
        }
    }
);

map.getCanvas().addEventListener(
    'mouseup',
    function() {
        clearTimeout(mouseTimer);
        mouseStart = null;
        mouseLngLat = null;
    }
);



/* =================================================
   KULLANICI KONUMU
================================================= */

const locationBtn =
    document.getElementById('locationBtn');

let userLocationMarker = null;

let locationAccuracyCircle = null;


/*
 * Konumum butonuna basıldığında çalışır.
 */
locationBtn.addEventListener(
    'click',
    function() {

        if (!navigator.geolocation) {

            alert(
                'Bu cihazda konum özelliği desteklenmiyor.'
            );

            return;
        }

        locationBtn.classList.add('loading');

        navigator.geolocation.getCurrentPosition(

            function(position) {

                locationBtn.classList.remove('loading');

                const lat =
                    position.coords.latitude;

                const lng =
                    position.coords.longitude;

                const accuracy =
                    position.coords.accuracy;


                const userLngLat = [
                    lng,
                    lat
                ];


                /*
                 * Daha önce konum işareti varsa kaldır.
                 */
                if (userLocationMarker) {
                    userLocationMarker.remove();
                }


                if (locationAccuracyCircle) {
                    locationAccuracyCircle.remove();
                }


                /*
                 * Mavi konum noktası.
                 */
                const el =
                    document.createElement('div');

                el.style.width = '18px';
                el.style.height = '18px';

                el.style.borderRadius = '50%';

                el.style.background = '#4285F4';

                el.style.border =
                    '3px solid white';

                el.style.boxShadow =
                    '0 1px 5px rgba(0,0,0,.4)';


                userLocationMarker =
                    new maplibregl.Marker({
                        element: el
                    })
                    .setLngLat(userLngLat)
                    .addTo(map);


                /*
                 * Kullanıcının bulunduğu noktaya git.
                 */
                map.flyTo({

                    center: userLngLat,

                    zoom: Math.max(
                        map.getZoom(),
                        15
                    ),

                    duration: 1000

                });


            },

            function(error) {

                locationBtn.classList.remove(
                    'loading'
                );


                let message =
                    'Konum alınamadı.';


                switch (error.code) {

                    case error.PERMISSION_DENIED:

                        message =
                            'Konum izni verilmedi. ' +
                            'Tarayıcı veya uygulama ayarlarından ' +
                            'konum iznini açın.';

                        break;


                    case error.POSITION_UNAVAILABLE:

                        message =
                            'Konum bilgisi şu anda kullanılamıyor.';

                        break;


                    case error.TIMEOUT:

                        message =
                            'Konum alınırken zaman aşımına uğradı.';

                        break;

                }


                alert(message);

            },

            {
                enableHighAccuracy: true,

                timeout: 10000,

                maximumAge: 30000

            }

        );

    }
);

];

/* Bilinmeyen tür "Diğer" olarak gösterilir. */
function placeType(key) {
    return PLACE_TYPES.find(type => type.key === key) ||
        PLACE_TYPES[PLACE_TYPES.length - 1];
}

/* '2026-10-10' -> '10.10.2026' */
function formatDate(value) {

    if (typeof value !== 'string' || value.length !== 10)
        return 'Belirtilmemiş';

    const parts = value.split('-');

    return parts[2] + '.' + parts[1] + '.' + parts[0];
}


/* =================================================
   RESİM SINIRLARI VE KÜÇÜLTME
   -------------------------------------------------
   Her resim yüklenmeden önce tarayıcıda küçültülür:
   uzun kenar en fazla 1280 piksel, dosya en fazla
   200 KB. Sığmazsa önce kalite, sonra boyut düşürülür.
================================================= */

const MAX_IMAGES = 5;
const MAX_IMAGE_BYTES = 200 * 1024;
const MAX_IMAGE_SIDE = 1280;

function loadImage(file) {

    return new Promise((resolve, reject) => {

        const url = URL.createObjectURL(file);
        const img = new Image();

        img.onload = () => {
            URL.revokeObjectURL(url);
            resolve(img);
        };

        img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error('Resim okunamadı.'));
        };

        img.src = url;
    });
}

function canvasToJpeg(canvas, quality) {
    return new Promise(resolve => {
        canvas.toBlob(resolve, 'image/jpeg', quality);
    });
}

async function compressImage(file) {

    const img = await loadImage(file);

    let scale = Math.min(
        1,
        MAX_IMAGE_SIDE / Math.max(img.width, img.height)
    );

    for (;;) {

        const width = Math.max(1, Math.round(img.width * scale));
        const height = Math.max(1, Math.round(img.height * scale));

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext('2d');

        /* Saydam resimlerde arka plan siyah çıkmasın. */
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);

        for (const quality of [0.8, 0.7, 0.6, 0.5]) {

            const blob = await canvasToJpeg(canvas, quality);

            if (!blob)
                throw new Error('Resim hazırlanamadı.');

            if (blob.size <= MAX_IMAGE_BYTES)
                return blob;
        }

        if (Math.max(width, height) <= 480)
            throw new Error('Resim 200 KB altına indirilemedi.');

        scale *= 0.8;
    }
}


/* =================================================
   İNŞAAT EKLEME FORMU
================================================= */

const panel = document.getElementById('panel');
const imageInput = document.getElementById('imageInput');
const thumbs = document.getElementById('thumbs');
const sizeInfo = document.getElementById('sizeInfo');

let selectedLngLat = null;

/* Giriş yapılmadan uzun basıldıysa, girişten sonra açılacak nokta */
let pendingLngLat = null;

/* Seçilip küçültülmüş resimler: { blob, url } */
let selectedImages = [];

/* Resimler küçültülürken true olur */
let imagesProcessing = false;

/* Form her kapandığında artar; yarım kalan küçültmeler atılır. */
let panelSession = 0;

async function openAddPanel(lngLat) {

    /* İnşaat eklemek için giriş gerekir. */
    if (!currentUser) {
        pendingLngLat = lngLat;
        openLoginPanel();
        return;
    }

    await usernameLoading;

    /* Kullanıcı adı olmayan eski hesaplar için. */
    if (!currentUsername && !(await askUsername()))
        return;

    selectedLngLat = lngLat;
    renderThumbs();
    panel.style.display = 'block';
}

function renderThumbs() {

    thumbs.textContent = '';

    let totalBytes = 0;

    selectedImages.forEach(item => {

        totalBytes += item.blob.size;

        const box = document.createElement('div');
        box.className = 'thumb';

        const img = document.createElement('img');
        img.src = item.url;
        img.alt = '';
        box.appendChild(img);

        const removeBtn = document.createElement('button');
        removeBtn.textContent = '×';
        removeBtn.setAttribute('aria-label', 'Resmi kaldır');
        removeBtn.addEventListener('click', () => {
            URL.revokeObjectURL(item.url);
            selectedImages =
                selectedImages.filter(other => other !== item);
            renderThumbs();
        });
        box.appendChild(removeBtn);

        thumbs.appendChild(box);
    });

    sizeInfo.textContent = selectedImages.length
        ? selectedImages.length + ' / ' + MAX_IMAGES +
          ' resim · toplam ' + Math.round(totalBytes / 1024) + ' KB'
        : 'Resimler otomatik küçültülür (her biri en fazla 200 KB).';
}

imageInput.addEventListener(
    'change',
    async function() {

        const files = Array.from(this.files || []);

        /* Aynı dosya tekrar seçilebilsin. */
        this.value = '';

        if (!files.length || imagesProcessing)
            return;

        const room = MAX_IMAGES - selectedImages.length;

        if (room <= 0) {
            alert('En fazla ' + MAX_IMAGES + ' resim eklenebilir.');
            return;
        }

        if (files.length > room) {
            alert(
                'En fazla ' + MAX_IMAGES + ' resim eklenebilir. ' +
                'Seçtiklerinden ilk ' + room + ' tanesi alındı.'
            );
        }

        const session = panelSession;

        let failed = 0;

        imagesProcessing = true;
        sizeInfo.textContent = 'Resimler hazırlanıyor…';

        for (const file of files.slice(0, room)) {

            try {

                const blob = await compressImage(file);

                /* Form bu sırada kapatıldıysa sonucu at. */
                if (session !== panelSession)
                    return;

                selectedImages.push({
                    blob: blob,
                    url: URL.createObjectURL(blob)
                });

            } catch (error) {

                console.error(error);
                failed++;
            }
        }

        if (session !== panelSession)
            return;

        imagesProcessing = false;
        renderThumbs();

        if (failed)
            alert(failed + ' resim okunamadı ve eklenmedi.');
    }
);


/* =================================================
   İNŞAATI KAYDET
   -------------------------------------------------
   Resimler Storage'a yüklenir, bilgiler Firestore'a
   yazılır. İşaret haritaya aşağıdaki "KAYITLI
   İNŞAATLAR" dinleyicisi tarafından eklenir.
================================================= */

const addBtn = document.getElementById('addBtn');

let saving = false;

addBtn.addEventListener(
    'click',
    async function() {

        if (!selectedLngLat || saving)
            return;

        if (!currentUser || !currentUsername) {
            alert('Önce giriş yapın.');
            return;
        }

        const name =
            document.getElementById('locationName').value.trim();

        const type = placeTypeSelect.value;

        const startDate =
            document.getElementById('startDate').value || null;

        const endDate =
            document.getElementById('endDate').value || null;

        if (!name) {
            alert('Lütfen inşaat adı girin.');
            return;
        }

        if (!type) {
            alert('Lütfen inşaat türünü seçin.');
            return;
        }

        if (startDate && endDate && endDate < startDate) {
            alert('Bitiş tarihi başlama tarihinden önce olamaz.');
            return;
        }

        if (imagesProcessing) {
            alert('Resimler hazırlanıyor, birkaç saniye sonra tekrar deneyin.');
            return;
        }

        if (!selectedImages.length) {
            alert('Lütfen en az 1 resim ekleyin.');
            return;
        }

        const lngLat = selectedLngLat;
        const images = selectedImages.slice();
        const user = currentUser;

        saving = true;
        addBtn.disabled = true;

        /* Kimlik önce üretilir; resimler de aynı adla kaydedilir. */
        const placeRef = doc(collection(db, 'places'));

        const uploadedPaths = [];
        const savedImages = [];

        try {

            for (let i = 0; i < images.length; i++) {

                addBtn.textContent =
                    'Yükleniyor ' + (i + 1) + '/' + images.length + '…';

                /* Klasör adı kullanıcının UID'si: kurallar sahipliği buradan anlar. */
                const path =
                    'places/' + user.uid + '/' +
                    placeRef.id + '_' + i + '.jpg';

                const imageRef = ref(storage, path);

                uploadedPaths.push(path);

                await uploadBytes(
                    imageRef,
                    images[i].blob,
                    { contentType: 'image/jpeg' }
                );

                savedImages.push({
                    path: path,
                    url: await getDownloadURL(imageRef)
                });
            }

            addBtn.textContent = 'Kaydediliyor…';

            await setDoc(placeRef, {
                name: name,
                type: type,
                startDate: startDate,
                endDate: endDate,
                lat: lngLat.lat,
                lng: lngLat.lng,
                images: savedImages,
                uid: user.uid,
                username: currentUsername,

                /*
                 * Yönetici onayı eklendiğinde yeni kayıtlar
                 * "pending" olarak başlayacak. Şimdilik hepsi onaylı.
                 */
                status: 'approved',

                createdAt: serverTimestamp()
            });

            closePanel();

        } catch (error) {

            console.error(error);

            /* Kayıt yazılamadıysa yüklenen resimleri geri sil. */
            uploadedPaths.forEach(path => {
                deleteObject(ref(storage, path)).catch(() => {});
            });

            alert(firebaseErrorMessage(error));

        } finally {

            saving = false;
            addBtn.disabled = false;
            addBtn.textContent = 'Ekle';
        }
    }
);

document.getElementById('cancelBtn').addEventListener(
    'click',
    closePanel
);

function closePanel() {

    panelSession++;

    panel.style.display = 'none';

    document.getElementById('locationName').value = '';
    document.getElementById('startDate').value = '';
    document.getElementById('endDate').value = '';

    placeTypeSelect.value = '';
    imageInput.value = '';

    selectedImages.forEach(item => URL.revokeObjectURL(item.url));
    selectedImages = [];

    imagesProcessing = false;
    selectedLngLat = null;

    renderThumbs();
}


/* =================================================
   KAYITLI İNŞAATLAR
   -------------------------------------------------
   Firestore'daki onaylı kayıtlar dinlenir. Sayfa
   açılınca hepsi gelir; ekleme ve silmeler anında
   haritaya yansır.

   İşaret       : üzerinde inşaatın türü yazar
   1. tıklama   : küçük kutu (1 resim + ekleyen kişi)
   2. tıklama   : ayrıntı paneli (tüm resimler, bilgiler)
================================================= */

/* kayıt kimliği -> { data, marker } */
const places = new Map();

/* Küçük kutu tek tanedir, tıklanan işarete taşınır. */
const placePopup = new maplibregl.Popup({
    offset: 36,
    maxWidth: '260px',
    closeOnClick: false
});

let activePopupId = null;

placePopup.on('close', () => {
    activePopupId = null;
});

/* Haritada boş bir yere tıklanınca küçük kutu kapanır. */
map.on('click', () => {
    placePopup.remove();
});

function addPlaceMarker(id, data) {

    if (
        typeof data.lat !== 'number' ||
        typeof data.lng !== 'number'
    ) {
        return;
    }

    const type = placeType(data.type);

    const el = document.createElement('div');

    el.className = 'place-marker';
    el.textContent = type.icon + ' ' + type.label;

    el.addEventListener('click', event => {

        /* Tıklama haritaya geçip kutuyu kapatmasın. */
        event.stopPropagation();

        if (activePopupId === id)
            openDetail(id);
        else
            showPlacePopup(id);
    });

    const marker = new maplibregl.Marker({
        element: el,
        anchor: 'bottom',
        offset: [0, -8]
    })
        .setLngLat([data.lng, data.lat])
        .addTo(map);

    places.set(id, { data: data, marker: marker });
}

function removePlaceMarker(id) {

    const place = places.get(id);

    if (!place)
        return;

    place.marker.remove();
    places.delete(id);
}

/* 1. tıklama: 1 resim + ekleyen kişi */
function showPlacePopup(id) {

    const place = places.get(id);

    if (!place)
        return;

    const data = place.data;
    const type = placeType(data.type);
    const images = Array.isArray(data.images) ? data.images : [];

    const content = document.createElement('div');
    content.className = 'popup-content';

    if (images.length) {
        const img = document.createElement('img');
        img.src = images[0].url;
        img.alt = data.name || '';
        content.appendChild(img);
    }

    const title = document.createElement('div');
    title.className = 'popup-title';
    title.textContent = data.name || type.label;
    content.appendChild(title);

    const typeRow = document.createElement('div');
    typeRow.className = 'popup-sub';
    typeRow.textContent = type.icon + ' ' + type.label;
    content.appendChild(typeRow);

    const userRow = document.createElement('div');
    userRow.className = 'popup-sub';
    userRow.textContent = 'Ekleyen: ' + (data.username || '-');
    content.appendChild(userRow);

    const hint = document.createElement('div');
    hint.className = 'popup-hint';
    hint.textContent = images.length > 1
        ? 'Tüm resimler (' + images.length + ') ve bilgiler için dokun'
        : 'Tüm bilgiler için dokun';
    content.appendChild(hint);

    content.addEventListener('click', () => {
        openDetail(id);
    });

    placePopup
        .setLngLat([data.lng, data.lat])
        .setDOMContent(content)
        .addTo(map);

    activePopupId = id;
}


/* =================================================
   AYRINTI PANELİ (2. tıklama)
================================================= */

const detailPanel = document.getElementById('detailPanel');
const detailDeleteBtn = document.getElementById('detailDeleteBtn');

let detailId = null;

function openDetail(id) {

    const place = places.get(id);

    if (!place)
        return;

    const data = place.data;
    const type = placeType(data.type);
    const images = Array.isArray(data.images) ? data.images : [];

    placePopup.remove();

    detailId = id;

    document.getElementById('detailTitle').textContent =
        data.name || type.label;

    document.getElementById('detailType').textContent =
        type.icon + ' ' + type.label;

    document.getElementById('detailStart').textContent =
        formatDate(data.startDate);

    document.getElementById('detailEnd').textContent =
        formatDate(data.endDate);

    document.getElementById('detailUser').textContent =
        data.username || '-';

    const box = document.getElementById('detailImages');

    box.textContent = '';

    images.forEach(image => {
        const img = document.createElement('img');
        img.src = image.url;
        img.alt = data.name || '';
        img.loading = 'lazy';
        box.appendChild(img);
    });

    /* "Sil" sadece inşaatı ekleyen kişiye görünür. */
    detailDeleteBtn.style.display =
        (currentUser && data.uid === currentUser.uid)
            ? 'block'
            : 'none';

    detailPanel.scrollTop = 0;
    detailPanel.style.display = 'block';
}

function closeDetail() {
    detailPanel.style.display = 'none';
    document.getElementById('detailImages').textContent = '';
    detailId = null;
}

document.getElementById('detailCloseBtn').addEventListener(
    'click',
    closeDetail
);

detailDeleteBtn.addEventListener(
    'click',
    async function() {

        const place = places.get(detailId);

        if (!place)
            return;

        const id = detailId;
        const data = place.data;

        if (!confirm('"' + (data.name || '') + '" silinsin mi?'))
            return;

        detailDeleteBtn.disabled = true;

        try {

            await deleteDoc(doc(db, 'places', id));

            (Array.isArray(data.images) ? data.images : [])
                .forEach(image => {
                    deleteObject(ref(storage, image.path))
                        .catch(error => console.error(error));
                });

            closeDetail();

        } catch (error) {

            console.error(error);
            alert(firebaseErrorMessage(error));

        } finally {

            detailDeleteBtn.disabled = false;
        }
    }
);

onSnapshot(
    query(
        collection(db, 'places'),
        where('status', '==', 'approved')
    ),
    snapshot => {

        snapshot.docChanges().forEach(change => {

            const id = change.doc.id;

            removePlaceMarker(id);

            if (change.type !== 'removed') {
                addPlaceMarker(id, change.doc.data());
                return;
            }

            /* Silinen inşaatın kutusu ya da paneli açıksa kapat. */
            if (activePopupId === id)
                placePopup.remove();

            if (detailId === id)
                closeDetail();
        });
    },
    error => {
        console.error(error);
        alert(
            'Kayıtlı inşaatlar yüklenemedi. ' +
            firebaseErrorMessage(error)
        );
    }
);


/* =================================================
   KULLANICI ADI
   -------------------------------------------------
   Küçük harf, rakam ve alt çizgi; 3-20 karakter.
   Aynı ad iki kişiye verilmez: "usernames/<ad>"
   belgesi varsa o ad alınmıştır.
================================================= */

const USERNAME_RE = /^[a-z0-9_]{3,20}$/;

const USERNAME_HELP =
    'Kullanıcı adı 3-20 karakter olmalı; sadece ' +
    'küçük harf (a-z), rakam ve alt çizgi (_) kullanılabilir.';

function normalizeUsername(value) {
    return (value || '').trim().toLowerCase();
}

async function isUsernameTaken(username) {
    const snapshot = await getDoc(doc(db, 'usernames', username));
    return snapshot.exists();
}

/* Kullanıcı adını hesaba bağlar (iki belge birlikte yazılır). */
async function claimUsername(user, username) {

    const batch = writeBatch(db);

    batch.set(doc(db, 'users', user.uid), {
        username: username,
        createdAt: serverTimestamp()
    });

    batch.set(doc(db, 'usernames', username), {
        uid: user.uid
    });

    await batch.commit();
}

async function loadUsername(user) {

    try {

        const snapshot = await getDoc(doc(db, 'users', user.uid));

        return snapshot.exists()
            ? snapshot.data().username || null
            : null;

    } catch (error) {

        console.error(error);
        return null;
    }
}

/* Kullanıcı adı olmayan hesaplara ad sorar. Alındıysa true döner. */
async function askUsername() {

    const username = normalizeUsername(
        prompt('İnşaat eklemek için bir kullanıcı adı seç.\n' + USERNAME_HELP)
    );

    if (!username)
        return false;

    if (!USERNAME_RE.test(username)) {
        alert(USERNAME_HELP);
        return false;
    }

    try {

        if (await isUsernameTaken(username)) {
            alert('Bu kullanıcı adı alınmış.');
            return false;
        }

        await claimUsername(currentUser, username);

        currentUsername = username;
        updateAccountButton();

        return true;

    } catch (error) {

        console.error(error);
        alert(firebaseErrorMessage(error));
        return false;
    }
}


/* =================================================
   GİRİŞ / KAYIT / ÇIKIŞ
================================================= */

const accountBtn = document.getElementById('accountBtn');
const loginPanel = document.getElementById('loginPanel');
const loginBtn = document.getElementById('loginBtn');
const loginSwitch = document.getElementById('loginSwitch');
const loginUsername = document.getElementById('loginUsername');

/* false: giriş yap, true: yeni hesap oluştur */
let signupMode = false;

/* Girişten sonra kullanıcı adı okunurken bekleyen işlem */
let usernameLoading = Promise.resolve();

function setLoginMode(signup) {

    signupMode = signup;

    document.getElementById('loginTitle').textContent =
        signup ? 'Hesap oluştur' : 'Giriş yap';

    loginBtn.textContent = signup ? 'Kayıt ol' : 'Giriş';

    loginSwitch.textContent = signup
        ? 'Hesabın var mı? Giriş yap'
        : 'Hesabın yok mu? Kayıt ol';

    loginUsername.style.display = signup ? 'block' : 'none';

    document.getElementById('loginPassword').autocomplete =
        signup ? 'new-password' : 'current-password';
}

loginSwitch.addEventListener('click', () => {
    setLoginMode(!signupMode);
});

function openLoginPanel() {
    loginPanel.style.display = 'block';
    document.getElementById('loginEmail').focus();
}

function closeLoginPanel() {
    loginPanel.style.display = 'none';
    document.getElementById('loginPassword').value = '';
    loginUsername.value = '';
    setLoginMode(false);
}

function updateAccountButton() {

    document.body.classList.toggle('signed-in', !!currentUser);

    const label = currentUser
        ? 'Çıkış yap (' + (currentUsername || currentUser.email) + ')'
        : 'Giriş yap';

    accountBtn.title = label;
    accountBtn.setAttribute('aria-label', label);
}

onAuthStateChanged(auth, user => {

    if (!user || !currentUser || currentUser.uid !== user.uid)
        currentUsername = null;

    currentUser = user;

    updateAccountButton();

    /* "Sil" düğmesi eski hesaba göre kalmasın. */
    closeDetail();

    if (!user)
        return;

    usernameLoading = loadUsername(user).then(username => {

        if (
            username &&
            currentUser &&
            currentUser.uid === user.uid
        ) {
            currentUsername = username;
            updateAccountButton();
        }
    });
});

accountBtn.addEventListener('click', () => {

    if (!currentUser) {
        pendingLngLat = null;
        openLoginPanel();
        return;
    }

    const who = currentUsername || currentUser.email;

    if (confirm(who + ' hesabından çıkış yapılsın mı?')) {
        closePanel();
        signOut(auth).catch(error => alert(firebaseErrorMessage(error)));
    }
});

async function login() {

    const email =
        document.getElementById('loginEmail').value.trim();

    const password =
        document.getElementById('loginPassword').value;

    const username = normalizeUsername(loginUsername.value);

    if (!email || !password) {
        alert('E-posta ve şifre girin.');
        return;
    }

    if (signupMode && !USERNAME_RE.test(username)) {
        alert(USERNAME_HELP);
        return;
    }

    if (signupMode && password.length < 6) {
        alert('Şifre en az 6 karakter olmalı.');
        return;
    }

    loginBtn.disabled = true;

    try {

        if (signupMode) {

            if (await isUsernameTaken(username)) {
                alert('Bu kullanıcı adı alınmış.');
                return;
            }

            const result =
                await createUserWithEmailAndPassword(auth, email, password);

            try {

                await claimUsername(result.user, username);

            } catch (error) {

                /* Ad alınamadıysa yarım kalan hesabı geri al. */
                await result.user.delete().catch(() => {});

                throw new Error(
                    'Kullanıcı adı alınamadı. Başka bir ad deneyin.'
                );
            }

            currentUser = result.user;
            currentUsername = username;
            updateAccountButton();

        } else {

            const result =
                await signInWithEmailAndPassword(auth, email, password);

            currentUser = result.user;
        }

        closeLoginPanel();

        /* Giriş, uzun basma sonrası istendiyse kaldığı yerden devam. */
        if (pendingLngLat) {
            const lngLat = pendingLngLat;
            pendingLngLat = null;
            openAddPanel(lngLat);
        }

    } catch (error) {

        console.error(error);
        alert(firebaseErrorMessage(error));

    } finally {

        loginBtn.disabled = false;
    }
}

loginBtn.addEventListener('click', login);

document.getElementById('loginPassword').addEventListener(
    'keydown',
    e => {
        if (e.key === 'Enter')
            login();
    }
);

document.getElementById('loginCancelBtn').addEventListener(
    'click',
    () => {
        pendingLngLat = null;
        closeLoginPanel();
    }
);

renderThumbs();

</script>
