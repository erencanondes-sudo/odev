<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Harita - Filtresiz</title>

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js"></script>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#map {
    position: absolute;
    inset: 0;
}

#panel {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    width: min(92%, 400px);
    background: white;
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 5px 25px rgba(0,0,0,.25);
    z-index: 20;
    display: none;
}

#panel h3 {
    margin: 0 0 14px;
    font-size: 20px;
}

#locationName {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    margin-bottom: 10px;
}

#imageInput {
    width: 100%;
    margin-bottom: 10px;
}

#preview {
    width: 100%;
    max-height: 180px;
    object-fit: cover;
    border-radius: 10px;
    display: none;
    margin-bottom: 10px;
}

#sizeInfo {
    font-size: 12px;
    color: #777;
    margin-bottom: 12px;
}

.buttons {
    display: flex;
    gap: 8px;
}

button {
    flex: 1;
    border: 0;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

#addBtn {
    background: #28a745;
    color: white;
}

#cancelBtn {
    background: #eee;
    color: #333;
}

.custom-marker {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #28a745;
    border: 4px solid white;
    box-shadow: 0 3px 10px rgba(0,0,0,.35);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.popup-content {
    width: 220px;
}

.popup-content img {
    width: 100%;
    max-height: 140px;
    object-fit: cover;
    border-radius: 8px;
    margin-top: 8px;
}

.popup-title {
    font-weight: bold;
    font-size: 16px;
}

/* -----------------------------
   KONUMUM BUTONU
----------------------------- */

#locationBtn {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 15;

    width: 48px;
    height: 48px;

    border: none;
    border-radius: 50%;

    background: white;
    color: #333;

    font-size: 22px;

    box-shadow: 0 2px 10px rgba(0,0,0,.25);

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    padding: 0;
}

/* -----------------------------
   GÖRÜNÜM SEÇENEKLERİ
----------------------------- */

#options {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 15;

    background: white;
    border-radius: 14px;
    padding: 6px 12px;

    box-shadow: 0 2px 10px rgba(0,0,0,.25);

    font-size: 14px;
    color: #333;
}

#options label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 0;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
}

#options input {
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: #28a745;
    cursor: pointer;
}

#locationBtn:active {
    transform: scale(.94);
}

#locationBtn.loading {
    opacity: .6;
}

</style>
</head>

<body>

<div id="map"></div>

<button id="locationBtn" aria-label="Konumum" title="Konumum">📍</button>

<div id="options">
    <label>
        <input id="showStreets" type="checkbox">
        Cadde ve sokak isimleri
    </label>
    <label>
        <input id="showPlaces" type="checkbox">
        Diğer yerler
    </label>
</div>

<div id="panel">
    <h3>Konum ekle</h3>

    <input id="locationName" type="text" placeholder="Konum adı">

    <input id="imageInput" type="file" accept="image/*">

    <img id="preview">

    <div id="sizeInfo"></div>

    <div class="buttons">
        <button id="cancelBtn">İptal</button>
        <button id="addBtn">Ekle</button>
    </div>
</div>

<script>

/* =================================================
   HARİTA
   -------------------------------------------------
   Harita önce stilsiz oluşturulur. Stil dosyası
   ayrıca indirilir, Türkçe isimler ve küçük POI
   ikonları stile ÖNCEDEN işlenir, sonra haritaya
   verilir. Böylece ikonlar ilk çizimde bile küçük
   görünür (önce büyük görünüp küçülme olmaz).
================================================= */

const STYLE_URL = 'https://tiles.openfreemap.org/styles/liberty';

/* POI ikonlarının küçültme oranı (1 = orijinal) */
const POI_ICON_SCALE = 0.5;

/* Cadde ve sokak isimlerinin yazı küçültme oranı (1 = orijinal) */
const STREET_TEXT_SCALE = 0.75;

/* Türkçe isim önceliği uygulanacak veri katmanları */
const TURKISH_NAME_LAYERS = [
    'poi',
    'park',
    'transportation_name',
    'place',
    'aerodrome_label'
];

const map = new maplibregl.Map({
    container: 'map',
    center: [26.4144, 40.1467],
    zoom: 14,
    doubleClickZoom: true
});


/* =================================================
   GÖRÜNÜM SEÇENEKLERİ
   -------------------------------------------------
   Harita temiz başlar. Kutular işaretlenince ilgili
   katmanlar görünür olur.
     streets : cadde/sokak isimleri + yol numaraları
     places  : mekânlar, duraklar, parklar, havalimanı
================================================= */

const visibleGroups = {
    streets: false,
    places: false
};

const PLACE_SOURCE_LAYERS = [
    'poi',
    'park',
    'aerodrome_label'
];

/* Katmanın hangi seçeneğe ait olduğunu döndürür. */
function layerGroup(layer) {

    if (layer.type !== 'symbol')
        return null;

    const sourceLayer = layer['source-layer'];

    if (sourceLayer === 'transportation_name')
        return 'streets';

    if (PLACE_SOURCE_LAYERS.includes(sourceLayer))
        return 'places';

    return null;
}

/* Seçeneklerin güncel halini haritaya uygular. */
function applyVisibility() {

    const style = map.getStyle();

    if (!style || !style.layers)
        return;

    style.layers.forEach(layer => {

        const group = layerGroup(layer);

        if (!group)
            return;

        try {
            map.setLayoutProperty(
                layer.id,
                'visibility',
                visibleGroups[group] ? 'visible' : 'none'
            );
        } catch (e) {}
    });
}

document.getElementById('showStreets').addEventListener(
    'change',
    function() {
        visibleGroups.streets = this.checked;
        applyVisibility();
    }
);

document.getElementById('showPlaces').addEventListener(
    'change',
    function() {
        visibleGroups.places = this.checked;
        applyVisibility();
    }
);

/* Tarayıcı geri gelince eski işaretleri hatırlamasın. */
document.getElementById('showStreets').checked = false;
document.getElementById('showPlaces').checked = false;


/*
 * icon-size değerini oranla çarpar.
 * Değer sayı, eski tip {stops: [...]} nesnesi veya
 * ifade (interpolate / step / diğer) olabilir.
 */
function scaleSize(value, scale) {

    if (value === undefined || value === null)
        return scale;

    if (typeof value === 'number')
        return value * scale;

    /* Eski tip fonksiyon: { stops: [[zoom, değer], ...] } */
    if (!Array.isArray(value)) {

        if (Array.isArray(value.stops)) {
            return Object.assign({}, value, {
                stops: value.stops.map(stop => [
                    stop[0],
                    scaleSize(stop[1], scale)
                ])
            });
        }

        return value;
    }

    const op = value[0];

    /* ['interpolate', tip, girdi, z1, d1, z2, d2, ...] */
    if (typeof op === 'string' && op.indexOf('interpolate') === 0) {
        return value.map((item, i) =>
            (i >= 4 && i % 2 === 0)
                ? scaleSize(item, scale)
                : item
        );
    }

    /* ['step', girdi, d0, z1, d1, z2, d2, ...] */
    if (op === 'step') {
        return value.map((item, i) =>
            (i >= 2 && i % 2 === 0)
                ? scaleSize(item, scale)
                : item
        );
    }

    return ['*', value, scale];
}


/*
 * Stil haritaya verilmeden önce düzenlenir.
 */
function prepareStyle(style) {

    (style.layers || []).forEach(layer => {

        if (layer.type !== 'symbol')
            return;

        if (!layer.layout)
            layer.layout = {};

        const sourceLayer = layer['source-layer'];

        /* GÖRÜNÜM SEÇENEKLERİ: harita temiz başlar */
        const group = layerGroup(layer);

        if (group) {
            layer.layout.visibility =
                visibleGroups[group] ? 'visible' : 'none';
        }

        /* TÜRKÇE İSİM ÖNCELİĞİ */
        if (
            layer.layout['text-field'] &&
            TURKISH_NAME_LAYERS.includes(sourceLayer)
        ) {
            layer.layout['text-field'] = [
                'coalesce',
                ['get', 'name:tr'],
                ['get', 'name'],
                ['get', 'name:latin']
            ];
        }

        /*
         * CADDE VE SOKAK İSİMLERİ
         * Yol numarası levhaları (ikonlu katmanlar) hariç.
         * text-size belirtilmemişse MapLibre varsayılanı 16'dır.
         */
        if (
            sourceLayer === 'transportation_name' &&
            layer.layout['text-field'] &&
            !layer.layout['icon-image']
        ) {
            const currentTextSize = layer.layout['text-size'];

            layer.layout['text-size'] = scaleSize(
                (currentTextSize === undefined || currentTextSize === null)
                    ? 16
                    : currentTextSize,
                STREET_TEXT_SCALE
            );
        }

        /*
         * TÜM POI İKONLARI (duraklar dahil)
         * Yazı boyutuna dokunulmuyor.
         */
        if (
            sourceLayer === 'poi' &&
            layer.layout['icon-image']
        ) {
            layer.layout['icon-size'] = scaleSize(
                layer.layout['icon-size'],
                POI_ICON_SCALE
            );
        }
    });

    return style;
}


fetch(STYLE_URL)
    .then(response => {
        if (!response.ok)
            throw new Error('Stil indirilemedi: ' + response.status);
        return response.json();
    })
    .then(style => {
        map.setStyle(prepareStyle(style));
    })
    .catch(error => {
        /* Stil düzenlenemezse harita yine de açılsın. */
        console.error(error);
        map.once('style.load', applyVisibility);
        map.setStyle(STYLE_URL);
    });


/* =================================================
   UZUN BASMA - TELEFON
================================================= */

let pressTimer = null;
let pressStart = null;
let pressLngLat = null;

map.getCanvas().addEventListener(
    'touchstart',
    function(e) {

        if (!e.touches || e.touches.length !== 1)
            return;

        const touch = e.touches[0];

        pressStart = {
            x: touch.clientX,
            y: touch.clientY
        };

        const rect =
            map.getCanvas().getBoundingClientRect();

        pressLngLat = map.unproject({
            x: touch.clientX - rect.left,
            y: touch.clientY - rect.top
        });

        clearTimeout(pressTimer);

        pressTimer = setTimeout(() => {

            if (!pressLngLat)
                return;

            openAddPanel(pressLngLat);

        }, 700);
    },
    { passive: true }
);

map.getCanvas().addEventListener(
    'touchmove',
    function(e) {

        if (!pressStart)
            return;

        const touch = e.touches[0];

        const dx = touch.clientX - pressStart.x;
        const dy = touch.clientY - pressStart.y;

        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance > 10) {
            clearTimeout(pressTimer);
            pressStart = null;
            pressLngLat = null;
        }
    },
    { passive: true }
);

map.getCanvas().addEventListener(
    'touchend',
    function() {
        clearTimeout(pressTimer);
        pressStart = null;
        pressLngLat = null;
    }
);


/* =================================================
   UZUN BASMA - BİLGİSAYAR
================================================= */

let mouseTimer = null;
let mouseStart = null;
let mouseLngLat = null;

map.getCanvas().addEventListener(
    'mousedown',
    function(e) {

        if (e.button !== 0)
            return;

        mouseStart = {
            x: e.clientX,
            y: e.clientY
        };

        mouseLngLat =
            map.unproject([
                e.offsetX,
                e.offsetY
            ]);

        clearTimeout(mouseTimer);

        mouseTimer = setTimeout(() => {

            if (!mouseLngLat)
                return;

            openAddPanel(mouseLngLat);

        }, 700);
    }
);

map.getCanvas().addEventListener(
    'mousemove',
    function(e) {

        if (!mouseStart)
            return;

        const dx = e.clientX - mouseStart.x;
        const dy = e.clientY - mouseStart.y;

        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance > 8) {
            clearTimeout(mouseTimer);
            mouseStart = null;
            mouseLngLat = null;
        }
    }
);

map.getCanvas().addEventListener(
    'mouseup',
    function() {
        clearTimeout(mouseTimer);
        mouseStart = null;
        mouseLngLat = null;
    }
);



/* =================================================
   KULLANICI KONUMU
================================================= */

const locationBtn =
    document.getElementById('locationBtn');

let userLocationMarker = null;

let locationAccuracyCircle = null;


/*
 * Konumum butonuna basıldığında çalışır.
 */
locationBtn.addEventListener(
    'click',
    function() {

        if (!navigator.geolocation) {

            alert(
                'Bu cihazda konum özelliği desteklenmiyor.'
            );

            return;
        }

        locationBtn.classList.add('loading');

        navigator.geolocation.getCurrentPosition(

            function(position) {

                locationBtn.classList.remove('loading');

                const lat =
                    position.coords.latitude;

                const lng =
                    position.coords.longitude;

                const accuracy =
                    position.coords.accuracy;


                const userLngLat = [
                    lng,
                    lat
                ];


                /*
                 * Daha önce konum işareti varsa kaldır.
                 */
                if (userLocationMarker) {
                    userLocationMarker.remove();
                }


                if (locationAccuracyCircle) {
                    locationAccuracyCircle.remove();
                }


                /*
                 * Mavi konum noktası.
                 */
                const el =
                    document.createElement('div');

                el.style.width = '18px';
                el.style.height = '18px';

                el.style.borderRadius = '50%';

                el.style.background = '#4285F4';

                el.style.border =
                    '3px solid white';

                el.style.boxShadow =
                    '0 1px 5px rgba(0,0,0,.4)';


                userLocationMarker =
                    new maplibregl.Marker({
                        element: el
                    })
                    .setLngLat(userLngLat)
                    .addTo(map);


                /*
                 * Kullanıcının bulunduğu noktaya git.
                 */
                map.flyTo({

                    center: userLngLat,

                    zoom: Math.max(
                        map.getZoom(),
                        15
                    ),

                    duration: 1000

                });


            },

            function(error) {

                locationBtn.classList.remove(
                    'loading'
                );


                let message =
                    'Konum alınamadı.';


                switch (error.code) {

                    case error.PERMISSION_DENIED:

                        message =
                            'Konum izni verilmedi. ' +
                            'Tarayıcı veya uygulama ayarlarından ' +
                            'konum iznini açın.';

                        break;


                    case error.POSITION_UNAVAILABLE:

                        message =
                            'Konum bilgisi şu anda kullanılamıyor.';

                        break;


                    case error.TIMEOUT:

                        message =
                            'Konum alınırken zaman aşımına uğradı.';

                        break;

                }


                alert(message);

            },

            {
                enableHighAccuracy: true,

                timeout: 10000,

                maximumAge: 30000

            }

        );

    }
);


/* =================================================
   MARKER / FOTOĞRAF
================================================= */

let selectedLngLat = null;
let currentMarker = null;
let compressedImageFile = null;

function openAddPanel(lngLat) {
    selectedLngLat = lngLat;
    document.getElementById('panel').style.display = 'block';
}

document.getElementById('imageInput').addEventListener(
    'change',
    function() {

        const file = this.files[0];

        if (!file)
            return;

        const originalMB =
            file.size / 1024 / 1024;

        const img = new Image();

        const objectURL =
            URL.createObjectURL(file);

        img.src = objectURL;

        img.onload = function() {

            const MAX_SIZE = 1200;

            let width = img.width;
            let height = img.height;

            if (width > MAX_SIZE || height > MAX_SIZE) {

                if (width > height) {
                    height = height * MAX_SIZE / width;
                    width = MAX_SIZE;
                } else {
                    width = width * MAX_SIZE / height;
                    height = MAX_SIZE;
                }
            }

            const canvas =
                document.createElement('canvas');

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');

            ctx.drawImage(
                img,
                0,
                0,
                width,
                height
            );

            canvas.toBlob(
                function(blob) {

                    compressedImageFile =
                        new File(
                            [blob],
                            'image.jpg',
                            { type: 'image/jpeg' }
                        );

                    const compressedMB =
                        blob.size / 1024 / 1024;

                    const preview =
                        document.getElementById('preview');

                    preview.src =
                        URL.createObjectURL(blob);

                    preview.style.display = 'block';

                    document.getElementById('sizeInfo').innerText =
                        'Orijinal: ' +
                        originalMB.toFixed(2) +
                        ' MB → Sıkıştırılmış: ' +
                        compressedMB.toFixed(2) +
                        ' MB';
                },
                'image/jpeg',
                0.75
            );
        };
    }
);


/* =================================================
   MARKER EKLE
================================================= */

document.getElementById('addBtn').addEventListener(
    'click',
    function() {

        if (!selectedLngLat)
            return;

        const name =
            document.getElementById('locationName')
            .value.trim();

        if (!name) {
            alert('Lütfen konum adı girin.');
            return;
        }

        if (currentMarker)
            currentMarker.remove();

        const el =
            document.createElement('div');

        el.className = 'custom-marker';
        el.innerHTML = '●';

        currentMarker =
            new maplibregl.Marker({
                element: el
            })
            .setLngLat(selectedLngLat)
            .addTo(map);

        let popupHTML =
            '<div class="popup-content">' +
            '<div class="popup-title">' +
            escapeHTML(name) +
            '</div>';

        if (compressedImageFile) {

            const imageURL =
                URL.createObjectURL(
                    compressedImageFile
                );

            popupHTML +=
                '<img src="' +
                imageURL +
                '">';
        }

        popupHTML += '</div>';

        new maplibregl.Popup({
            offset: 25
        })
        .setLngLat(selectedLngLat)
        .setHTML(popupHTML)
        .addTo(map);

        closePanel();
    }
);


/* =================================================
   İPTAL
================================================= */

document.getElementById('cancelBtn').addEventListener(
    'click',
    closePanel
);

function closePanel() {

    document.getElementById('panel').style.display = 'none';

    document.getElementById('locationName').value = '';

    document.getElementById('imageInput').value = '';

    document.getElementById('preview').style.display = 'none';

    document.getElementById('preview').src = '';

    document.getElementById('sizeInfo').innerText = '';

    compressedImageFile = null;
    selectedLngLat = null;
}


/* =================================================
   HTML GÜVENLİĞİ
================================================= */

function escapeHTML(text) {

    return text
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}

</script>

</body>
</html>
